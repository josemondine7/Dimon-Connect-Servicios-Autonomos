<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Oferta y Demanda — Dimon Connect</title>
  
  <link rel="stylesheet" href="css/variables.css">
  <link rel="stylesheet" href="css/global.css">
  <link rel="stylesheet" href="css/componentes.css">
  <link rel="stylesheet" href="css/responsivo.css">
</head>
<body>

  <header>
    <button class="boton-volver" onclick="window.location.href='index.html'" data-txt="volver">← Volver</button>
    <h2 data-txt="ofertaDemanda">Oferta y Demanda</h2>
  </header>

  <div class="selector-listas">
    <button class="boton-lista activo" id="boton-ofertas" data-txt="serviciosOfertados">Servicios Ofrecidos</button>
    <button class="boton-lista" id="boton-demandas" data-txt="serviciosSolicitados">Servicios Solicitados</button>
  </div>

  <div class="contenedor-lista">
    <div class="acciones-lista">
      <a href="ofrecer-servicio.html" class="boton-secundario" data-txt="brindarServicio">Brindar mi Servicio</a>
      <a href="solicitar-servicio.html" class="boton-secundario" data-txt="solicitarServicio">Solicitar un Servicio</a>
    </div>

    <div id="lista-ofertas" class="lista-servicios">
      <!-- Se llena automáticamente con JavaScript -->
    </div>

    <div id="lista-demandas" class="lista-servicios" style="display:none;">
      <!-- Se llena automáticamente con JavaScript -->
    </div>
  </div>

  <script src="js/idioma.js"></script>
  <script src="js/almacenamiento.js"></script>
  <script src="js/validacion.js"></script>
  <script src="js/trato.js"></script>
  <script src="js/flujos.js"></script>
</body>
</html>
