<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Dimon Connect | Servicios Autónomos</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    html, body {
      width: 100%;
      min-height: 100vh;
      /* ✅ FONDO FIJO — NO SE MUEVE MÁS */
      background: url('06f9228d-9ba5-4998-9604-c4432eefaa34_20260825_182353_0000.png') no-repeat center center fixed;
      background-size: cover; /* Cubre toda la pantalla bien */
      background-attachment: fixed; /* Queda fijo, no se mueve */
      color: #ffffff;
      text-align: center;
      padding: 1.5rem;
    }

    /* Capa para que se lea bien el texto */
    .capa-sombra {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(5, 16, 64, 0.45);
      z-index: -1;
    }

    .contenedor {
      width: 100%;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      align-items: center;
      position: relative;
      z-index: 1;
    }

    /* Espacio arriba — deja ver el logo y nombre del fondo sin taparlo */
    .espacio-superior {
      height: 28vh; /* Equilibrado para celular y PC */
    }

    /* --- BARRA DE BÚSQUEDA --- */
    .buscador {
      display: flex;
      justify-content: center;
      gap: 0;
      margin-bottom: 3.5rem;
      width: 100%;
      max-width: 550px; /* Más ancho en PC */
    }

    .buscador form {
      display: flex;
      width: 100%;
    }

    .buscador input {
      flex: 1;
      padding: 1.1rem 1.5rem; /* Más grande y cómodo */
      font-size: 1.05rem;
      border: none;
      border-radius: 14px 0 0 14px;
      background: rgba(255, 255, 255, 0.92);
      color: #051040;
      outline: none;
    }

    .buscador button {
      padding: 1.1rem 1.5rem;
      border: none;
      border-radius: 0 14px 14px 0;
      background: #00ccff;
      color: #051040;
      font-size: 1.2rem;
      cursor: pointer;
      transition: background 0.2s;
    }

    .buscador button:hover {
      background: #00b8e6;
    }

    /* --- BOTONES PRINCIPALES — MÁS GRANDES Y BONITOS --- */
    .botones {
      display: flex;
      flex-direction: column;
      gap: 1.2rem; /* Más espacio entre ellos */
      align-items: center;
      margin-bottom: 4rem;
      width: 100%;
    }

    .boton {
      width: 320px; /* Más ancho en PC */
      padding: 1.2rem 1.5rem; /* Más alto, más cómodo */
      border-radius: 14px;
      font-size: 1.1rem; /* Letra más grande */
      font-weight: 600;
      text-decoration: none;
      display: block;
      transition: all 0.2s;
      cursor: pointer;
    }

    .boton:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 16px rgba(0, 204, 255, 0.25);
    }

    .boton-1 {
      background: #00ccff;
      color: #051040;
      border: none;
    }

    .boton-2 {
      background: rgba(0, 204, 255, 0.15);
      color: #ffffff;
      border: 2px solid #00ccff;
    }

    .boton-3 {
      background: rgba(255, 255, 255, 0.1);
      color: #ffffff;
      border: 2px solid #ffffff;
    }

    /* --- ENLACES INFERIORES --- */
    .pie {
      width: 100%;
      padding-bottom: 5rem;
      margin-top: auto;
    }

    .enlaces-pie {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 1.2rem;
      margin-bottom: 1rem;
      padding: 0.5rem;
    }

    .enlaces-pie a {
      color: #b0e0ff;
      text-decoration: none;
      font-size: 0.9rem;
      border-bottom: 1px solid transparent;
      transition: all 0.2s;
    }

    .enlaces-pie a:hover {
      border-bottom-color: #00ccff;
      color: #ffffff;
    }

    .asistente-lira {
      color: #00ccff;
      font-size: 0.95rem;
      text-decoration: none;
      display: inline-block;
      margin-top: 0.5rem;
      padding: 0.6rem 1.2rem;
      border-radius: 10px;
      background: rgba(0, 204, 255, 0.1);
    }

    .asistente-lira:hover {
      background: rgba(0, 204, 255, 0.2);
      text-shadow: 0 0 8px #00ccff;
    }

    /* --- BOTÓN DE DESCARGA --- */
    .descarga {
      position: fixed;
      left: 1.5rem;
      bottom: 2rem;
      padding: 0.8rem 1.3rem;
      border-radius: 10px;
      background: #ff7700;
      color: #ffffff;
      border: none;
      font-weight: 600;
      font-size: 0.95rem;
      text-decoration: none;
      z-index: 10;
      transition: background 0.2s;
    }

    .descarga:hover {
      background: #e66a00;
    }

    /* --- AJUSTE ESPECIAL PARA COMPUTADORA --- */
    @media (min-width: 768px) {
      .espacio-superior { height: 30vh; }
      .buscador { max-width: 600px; }
      .botones { flex-direction: row; flex-wrap: wrap; justify-content: center; gap: 1.5rem; }
      .boton { width: 260px; } /* Ancho uniforme en PC */
      .enlaces-pie { gap: 1.5rem; }
    }

    /* --- AJUSTE PARA CELULAR --- */
    @media (max-width: 480px) {
      .espacio-superior { height: 22vh; }
      .boton { width: 90%; }
      .descarga { position: static; margin: 1rem auto; display: block; width: fit-content; }
      .enlaces-pie { gap: 0.8rem; }
      .pie { padding-bottom: 2rem; }
    }
  </style>
</head>
<body>

  <div class="capa-sombra"></div>

  <div class="contenedor">

    <!-- Fondo fijo con logo y nombre — NO se mueve -->
    <div class="espacio-superior"></div>

    <!-- 🔍 BARRA DE BÚSQUEDA -->
    <div class="buscador">
      <form action="buscar.html" method="get">
        <input type="search" name="q" placeholder="Buscar servicios, personas..." required>
        <button type="submit">🔍</button>
      </form>
    </div>

    <!-- 🟢 BOTONES PRINCIPALES — MÁS GRANDES Y BONITOS -->
    <div class="botones">
      <a href="ofrecer.html" class="boton boton-1">Ofrecer mis servicios</a>
      <a href="solicitar.html" class="boton boton-2">Solicitar un servicio</a>
      <a href="login.html" class="boton boton-3">Iniciar sesión</a>
    </div>

    <!-- 🔗 ENLACES INFERIORES — TODOS VISIBLES -->
    <div class="pie">
      <nav class="enlaces-pie">
        <a href="normas.html">📜 Normas y Seguridad</a>
        <a href="normas.html#privacidad">🔒 Privacidad</a>
        <a href="normas.html#terminos">📄 Términos de Servicio</a>
        <a href="normas.html#cookies">🍪 Cookies</a>
        <a href="normas.html#contacto">📬 Contacto</a>
      </nav>
      <a href="lira.html" class="asistente-lira">🤖 Hablar con el Asistente Lira</a>
    </div>

  </div>

  <!-- 📱 BOTÓN DE DESCARGA -->
  <a href="#" class="descarga">📱 Descargar aplicación</a>

</body>
</html>
