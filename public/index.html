<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Dimon Connect — Servicios Autónomos</title>
  
  <script>
    const traducciones = {
      es: { 
        buscarPlaceholder:"Buscar servicios, personas, ayuda...", 
        ofertaDemanda:"Oferta y Demanda", brindarServicio:"Brindar mi Servicio", 
        solicitarServicio:"Solicitar un Servicio", normas:"Normas y Seguridad", 
        privacidad:"Privacidad", terminos:"Términos de Servicio", cookies:"Cookies",
        descargarApp:"Descargar Aplicación"
      },
      en: { 
        buscarPlaceholder:"Search services, people, help...", 
        ofertaDemanda:"Offer & Demand", brindarServicio:"Offer my Service", 
        solicitarServicio:"Request a Service", normas:"Rules & Security", 
        privacidad:"Privacy", terminos:"Terms of Service", cookies:"Cookies",
        descargarApp:"Download App"
      },
      pt: { 
        buscarPlaceholder:"Procurar serviços, pessoas, ajuda...", 
        ofertaDemanda:"Oferta e Procura", brindarServicio:"Oferecer meu Serviço", 
        solicitarServicio:"Solicitar um Serviço", normas:"Regras e Segurança", 
        privacidad:"Privacidade", terminos:"Termos de Serviço", cookies:"Cookies",
        descargarApp:"Baixar Aplicação"
      },
      zh: { 
        buscarPlaceholder:"搜索服务、人员、帮助...", 
        ofertaDemanda:"供需信息", brindarServicio:"提供我的服务", 
        solicitarServicio:"请求服务", normas:"安全规则", 
        privacidad:"隐私", terminos:"服务条款", cookies:"Cookie政策",
        descargarApp:"下载应用"
      },
      ar: { 
        buscarPlaceholder:"البحث عن خدمات، أشخاص، مساعدة...", 
        ofertaDemanda:"العرض والطلب", brindarServicio:"تقديم خدمتي", 
        solicitarServicio:"طلب خدمة", normas:"الأمان والقواعد", 
        privacidad:"الخصوصية", terminos:"شروط الخدمة", cookies:"ملفات تعريف الارتباط",
        descargarApp:"تحميل التطبيق"
      }
    };
    let idiomaActual = localStorage.getItem('idioma') || 'es';
    
    function cambiarIdioma(codigo) {
      idiomaActual = codigo;
      localStorage.setItem('idioma', codigo);
      aplicarTraducciones();
      actualizarBotonIdioma();
    }
    
    function aplicarTraducciones() {
      document.querySelectorAll('[data-txt]').forEach(el => {
        const clave = el.getAttribute('data-txt');
        el.textContent = traducciones[idiomaActual][clave] || clave;
      });
      document.querySelectorAll('[data-placeholder]').forEach(el => {
        const clave = el.getAttribute('data-placeholder');
        el.placeholder = traducciones[idiomaActual][clave] || '';
      });
    }

    function actualizarBotonIdioma() {
      const nombres = { es: 'Español', en: 'English', pt: 'Português', zh: '中文', ar: 'العربية' };
      document.getElementById('boton-idioma').textContent = nombres[idiomaActual] || 'Español';
    }
  </script>
  
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      position: fixed;
    }
    body {
      background: url('1788448614792.png') no-repeat center center;
      background-size: cover;
      background-attachment: fixed;
      margin: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      color: white;
    }

    header {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      padding: 15px 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      z-index: 100;
    }

    .boton-idioma {
      background: none;
      border: none;
      color: white;
      font-size: 15px;
      cursor: pointer;
      opacity: 0.85;
    }

    .buscador-pequeno {
      flex: 1;
      max-width: 280px;
      margin: 0 15px;
    }

    .buscador-pequeno input {
      width: 100%;
      padding: 9px 16px;
      border-radius: 20px;
      border: none;
      background: rgba(255,255,255,0.15);
      color: white;
      font-size: 14px;
      outline: none;
      text-align: center;
    }

    .buscador-pequeno input::placeholder {
      color: rgba(255,255,255,0.5);
    }

    .boton-lira {
      width: 34px;
      height: 34px;
      background: #6b7280;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 18px;
      color: white;
      text-decoration: none;
      border-radius: 8px;
    }

    .contenedor-central {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 100%;
      max-width: 400px;
      padding: 0 20px;
    }

    .botones-principales {
      display: flex;
      flex-direction: column;
      gap: 14px;
      width: 100%;
    }

    .boton-principal {
      padding: 16px 20px;
      border-radius: 14px;
      background: rgba(255,255,255,0.15);
      color: white;
      font-size: 18px;
      text-align: center;
      text-decoration: none;
      transition: background 0.2s;
      display: block;
    }

    .boton-principal:hover {
      background: rgba(255,255,255,0.25);
    }

    .enlaces-inferiores {
      position: fixed;
      bottom: 12px;
      left: 0;
      right: 0;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 15px;
      font-size: 11px;
      opacity: 0.75;
      z-index: 100;
    }

    .enlaces-inferiores a {
      color: white;
      text-decoration: none;
    }

    .enlaces-centro {
      text-align: center;
      flex: 1;
      padding: 0 10px;
    }

    .boton-descarga {
      padding: 6px 14px;
      background: #16a34a;
      color: white;
      font-size: 11px;
      border-radius: 12px;
      text-decoration: none;
      white-space: nowrap;
    }

    #selector-idioma { display: none; }
  </style>
</head>
<body>

  <header>
    <button class="boton-idioma" id="boton-idioma" onclick="document.getElementById('selector-idioma').click()">Español</button>
    <select id="selector-idioma" onchange="cambiarIdioma(this.value)">
      <option value="es">Español</option>
      <option value="en">English</option>
      <option value="pt">Português</option>
      <option value="zh">中文</option>
      <option value="ar">العربية</option>
    </select>
    <div class="buscador-pequeno">
      <input type="text" data-placeholder="buscarPlaceholder">
    </div>
    <a href="chat-lira.html" class="boton-lira">✚</a>
  </header>

  <main class="contenedor-central">
    <div class="botones-principales">
      <a href="oferta-demanda.html" class="boton-principal" data-txt="ofertaDemanda"></a>
      <a href="ofrecer-servicio.html" class="boton-principal" data-txt="brindarServicio"></a>
      <a href="solicitar-servicio.html" class="boton-principal" data-txt="solicitarServicio"></a>
    </div>
  </main>

  <footer class="enlaces-inferiores">
    <div></div>
    <div class="enlaces-centro">
      <a href="normas-seguridad.html" data-txt="normas"></a> ·
      <a href="politica-privacidad.html" data-txt="privacidad"></a> ·
      <a href="terminos-servicio.html" data-txt="terminos"></a> ·
      <a href="politica-cookies.html" data-txt="cookies"></a>
    </div>
    <a href="descarga.html" class="boton-descarga" data-txt="descargarApp"></a>
  </footer>

  <script>
    aplicarTraducciones();
    actualizarBotonIdioma();
  </script>

</body>
</html>
