<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Dimon Connect | Servicios Autónomos</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', sans-serif; }
    html, body {
      width: 100%; min-height: 100vh; margin: 0; padding: 0;
      background: url('fondo-Dimon.png') no-repeat center center fixed;
      background-size: cover; background-attachment: fixed;
      color: #fff; text-align: center; padding: 1.5rem; padding-bottom: 7rem; overflow-x: hidden;
    }
    .capa-sombra { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(5,16,64,.25); z-index: -1; }
    .contenedor { width: 100%; display: flex; flex-direction: column; align-items: center; position: relative; z-index: 1; }
    .espacio-superior { height: 38vh; width: 100%; }
    .boton-lira {
      position: fixed; top: 1.5rem; right: 1.5rem; width: 44px; height: 44px; border-radius: 8px;
      background: rgba(0,204,255,.2); border: 2px solid #00ccff; color: #00ccff; font-size: 1.2rem;
      display: flex; align-items: center; justify-content: center; text-decoration: none; z-index: 20;
    }
    .buscador { display: flex; justify-content: center; gap: 0; margin-bottom: 3rem; width: 100%; max-width: 500px; }
    .buscador form { display: flex; width: 100%; }
    .buscador input {
      flex: 1; padding: 1rem 1.3rem; font-size: 1rem; border: none; border-radius: 12px 0 0 12px;
      background: rgba(255,255,255,.95); color: #051040; outline: none;
    }
    .buscador button {
      padding: 1rem 1.3rem; border: none; border-radius: 0 12px 12px 0;
      background: #00ccff; color: #051040; font-size: 1.1rem; cursor: pointer;
    }
    .botones { display: flex; flex-direction: column; gap: 1.1rem; align-items: center; margin-bottom: 3rem; width: 100%; }
    .boton {
      width: 300px; max-width: 90%; padding: 1.1rem; border-radius: 12px; font-size: 1rem; font-weight: 600;
      text-decoration: none; display: block; cursor: pointer; transition: all .2s;
    }
    .boton-1 { background: #00ccff; color: #051040; border: none; }
    .boton-2 { background: transparent; color: #fff; border: 2px solid #00ccff; }
    .boton-3 { background: transparent; color: #fff; border: 2px solid #fff; }
    .pie { width: 100%; position: relative; z-index: 2; }
    .enlaces-pie {
      display: flex; flex-wrap: wrap; justify-content: center; gap: 1.2rem; margin-bottom: .8rem;
      padding: .8rem; background: rgba(0,20,60,.5); border-radius: 12px;
    }
    .enlaces-pie a { color: #b0e0ff; text-decoration: none; font-size: .85rem; }
    .enlaces-pie a:hover { color: #fff; text-decoration: underline; }
    .descarga {
      position: fixed; left: 1.2rem; bottom: 1.2rem; padding: .7rem 1rem; border-radius: 8px;
      background: #ff7700; color: #fff; border: none; font-weight: 600; font-size: .85rem;
      text-decoration: none; z-index: 10;
    }
    @media (min-width: 768px) {
      .espacio-superior { height: 40vh; }
      .buscador { max-width: 600px; }
      .botones { flex-direction: row; gap: 1.5rem; flex-wrap: wrap; }
      .boton { width: 240px; }
      .enlaces-pie { gap: 1.5rem; }
    }
    @media (max-width: 480px) {
      .espacio-superior { height: 30vh; }
      .descarga { position: static; margin: 1rem auto; display: block; width: fit-content; }
      .enlaces-pie { gap: .7rem; }
    }
  </style>
</head>
<body>

  <div class="capa-sombra"></div>
  <a href="lira.html" class="boton-lira">⚙️</a>

  <div class="contenedor">
    <div class="espacio-superior"></div>

    <div class="buscador">
      <form action="buscar.html" method="get">
        <input type="search" name="q" placeholder="Buscar servicios, personas..." required>
        <button type="submit">🔍</button>
      </form>
    </div>

    <div class="botones">
      <a href="ofrecer.html" class="boton boton-1">Ofrecer mis servicios</a>
      <a href="solicitar.html" class="boton boton-2">Solicitar un servicio</a>
      <a href="login.html" class="boton boton-3">Iniciar sesión</a>
    </div>

    <div class="pie">
      <nav class="enlaces-pie">
        <a href="normas.html">Normas y Seguridad</a>
        <a href="normas.html#privacidad">Privacidad</a>
        <a href="normas.html#terminos">Términos de Servicio</a>
        <a href="normas.html#cookies">Cookies</a>
        <a href="normas.html#contacto">Contacto</a>
      </nav>
    </div>
  </div>

  <a href="#" class="descarga">Descargar aplicación</a>

</body>
</html>
