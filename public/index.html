<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Dimon Connect - Servicios Autónomos" />
  <title>Dimon Connect | Servicios Autónomos</title>

  <link rel="stylesheet" href="styles.css" />
</head>
<body>

  <main class="hero">

    <!-- Fondo decorativo -->
    <div class="glow glow-left"></div>
    <div class="glow glow-right"></div>

    <!-- Mapa mundial en SVG -->
    <div class="map-background" aria-hidden="true">
      <img src="world-map.svg" alt="" />
    </div>

    <!-- Barra superior -->
    <header class="navbar">

      <a href="#" class="brand" aria-label="Dimon Connect">
        <svg class="brand-mark" viewBox="0 0 48 48" role="img" aria-hidden="true">
          <defs>
            <linearGradient id="logoBlue" x1="0%" y1="0%" x2="100%" y2="100%">
              <stop offset="0%" stop-color="#00e9ff" />
              <stop offset="100%" stop-color="#0875ff" />
            </linearGradient>

            <linearGradient id="logoDark" x1="0%" y1="0%" x2="100%" y2="100%">
              <stop offset="0%" stop-color="#102eaf" />
              <stop offset="100%" stop-color="#071566" />
            </linearGradient>
          </defs>

          <polygon
            points="24,2 46,24 24,46 2,24"
            fill="url(#logoBlue)"
          />

          <polygon
            points="24,10 38,24 24,38 10,24"
            fill="#071a8e"
          />

          <polygon
            points="24,10 38,24 24,24 14,24"
            fill="#0a5bda"
          />

          <polygon
            points="24,24 38,24 24,38 14,24"
            fill="url(#logoDark)"
          />

          <polygon
            points="24,2 24,10 10,24 2,24"
            fill="#11dff8"
            opacity=".9"
          />
        </svg>

        <span class="brand-name">
          <strong>Dimon</strong>
          <span>Connect</span>
        </span>
      </a>

      <nav class="navigation" aria-label="Navegación principal">
        <a href="#">Cursos</a>
        <a href="#">Mentoría</a>
        <a href="#">Tienda &amp; Blog</a>
        <a href="#">Encuentra empleo</a>
        <a href="#">Únete</a>
        <a href="#">Únete nosotros</a>
      </nav>

      <button class="search-icon" aria-label="Buscar">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <circle cx="10.7" cy="10.7" r="6.4"></circle>
          <path d="M16 16l5 5"></path>
        </svg>
      </button>

    </header>

    <!-- Contenido principal -->
    <section class="hero-content">

      <div class="hero-logo">
        <svg viewBox="0 0 140 140" role="img" aria-label="Logotipo Dimon">
          <defs>
            <linearGradient id="heroLogoBlue" x1="0%" y1="0%" x2="100%" y2="100%">
              <stop offset="0%" stop-color="#12e7fa" />
              <stop offset="100%" stop-color="#0876ff" />
            </linearGradient>

            <linearGradient id="heroLogoNavy" x1="0%" y1="0%" x2="100%" y2="100%">
              <stop offset="0%" stop-color="#153dc9" />
              <stop offset="100%" stop-color="#06135e" />
            </linearGradient>
          </defs>

          <polygon
            points="70,5 135,70 70,135 5,70"
            fill="url(#heroLogoBlue)"
          />

          <polygon
            points="70,20 120,70 70,120 20,70"
            fill="#061889"
          />

          <polygon
            points="70,20 120,70 70,70 35,70"
            fill="#116bd9"
          />

          <polygon
            points="70,70 120,70 70,120 35,70"
            fill="url(#heroLogoNavy)"
          />

          <polygon
            points="70,5 70,20 20,70 5,70"
            fill="#11ddf8"
          />
        </svg>
      </div>

      <div class="copy">
        <p class="eyebrow">
          Dimon <span>Connect</span>
        </p>

        <h1>
          Servicios <span>Autónomos</span>
        </h1>

        <p class="subtitle">
          El puente entre quien necesita un servicio<br />
          y quien tiene la solución.
        </p>

        <form class="service-search">
          <label class="sr-only" for="service-input">
            Buscar servicios
          </label>

          <input
            id="service-input"
            type="search"
            placeholder="Buscar servicios..."
          />

          <button type="submit" aria-label="Buscar servicios">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <circle cx="10.7" cy="10.7" r="6.4"></circle>
              <path d="M16 16l5 5"></path>
            </svg>
          </button>
        </form>
      </div>

    </section>

    <!-- Acciones -->
    <section class="actions" aria-label="Acciones principales">
      <a href="#" class="button button-primary">
        Oferta de servicios
      </a>

      <a href="#" class="button button-secondary">
        ¿Quieres trabajar con nosotros?
      </a>

      <a href="#" class="button button-accent">
        Solicita un servicio
      </a>
    </section>

    <!-- Firma inferior -->
    <div class="ai-signature">
      <strong>Dola AI</strong>
      <span>Dola AI</span>
    </div>

  </main>

</body>
</html>
