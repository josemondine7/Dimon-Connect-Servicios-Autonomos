<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Dimon Connect — Servicios Autónomos</title>

  <script src="js/idioma.js"></script>
  <script src="js/monedas.js"></script>

  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
    html, body { 
      width: 100%; 
      height: 100vh; 
      overflow: hidden; 
      position: fixed;
    }
    body {
      background: url('../1788448614792.png') no-repeat center center;
      background-size: cover;
      background-attachment: fixed;
      background-color: #1a2a6c;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 20px;
      padding-bottom: 60px;
      color: white;
    }

    /* ✅ Idioma arriba derecha */
    .top-lang {
      position: fixed;
      top: 20px;
      right: 20px;
      z-index: 100;
    }

    .lang-link {
      background: none;
      border: none;
      color: white;
      font-size: 16px;
      cursor: pointer;
      opacity: 0.8;
    }

    .lang-link:hover {
      opacity: 1;
      text-decoration: underline;
    }

    /* ✅ Buscador ARRIBA del logo, más chico */
    .search-bar {
      width: 100%;
      max-width: 320px;
      margin-bottom: 25px;
      margin-top: 20px;
    }

    .search-bar input {
      width: 100%;
      padding: 10px 18px;
      border-radius: 20px;
      border: none;
      background: rgba(255,255,255,0.08);
      color: white;
      font-size: 14px;
      outline: none;
      text-align: center;
    }

    .search-bar input::placeholder {
      color: rgba(255,255,255,0.5);
    }

    /* ✅ Logo */
    .logo-container {
      text-align: center;
      margin-bottom: 30px;
    }

    .logo-img {
      width: 100px;
      height: auto;
      margin-bottom: 10px;
    }

    .logo-text-main {
      font-size: 26px;
      font-weight: 600;
      letter-spacing: 1px;
    }

    .logo-text-main span {
      color: #4ade80;
    }

    .logo-text-sub {
      font-size: 14px;
      opacity: 0.7;
      margin-top: 4px;
    }

    /* ✅ Botones principales */
    .buttons-container {
      display: flex;
      flex-direction: column;
      gap: 14px;
      width: 100%;
      max-width: 400px;
    }

    .main-btn {
      padding: 16px 20px;
      border-radius: 14px;
      border: none;
      background: rgba(255,255,255,0.08);
      color: white;
      font-size: 18px;
      cursor: pointer;
      transition: background 0.2s;
    }

    .main-btn:hover {
      background: rgba(255,255,255,0.15);
    }

    /* ✅ Pie de página */
    .footer {
      position: fixed;
      bottom: 12px;
      left: 0;
      right: 0;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 15px;
      font-size: 11px;
      opacity: 0.7;
      z-index: 100;
    }

    .lira-btn {
      width: 32px;
      height: 32px;
      background: #6b7280;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 16px;
      color: white;
      border: none;
      border-radius: 8px;
      clip-path: polygon(15% 0%, 85% 0%, 100% 15%, 100% 85%, 50% 100%, 0% 85%, 0% 15%);
      cursor: pointer;
      flex-shrink: 0;
    }

    .lira-btn:hover {
      background: #4b5563;
    }

    .footer-middle {
      text-align: center;
      flex: 1;
      padding: 0 10px;
      line-height: 1.5;
    }

    .footer-middle a {
      color: white;
      text-decoration: none;
      margin: 0 4px;
    }

    .footer-middle a:hover {
      text-decoration: underline;
    }

    .download-btn {
      padding: 6px 12px;
      background: #16a34a;
      color: white;
      font-size: 11px;
      border: none;
      border-radius: 12px;
      cursor: pointer;
      white-space: nowrap;
    }

    .download-btn:hover {
      background: #15803d;
    }

    #selector-idioma {
      display: none;
    }
  </style>
</head>
<body>

  <!-- ✅ Idioma arriba derecha -->
  <div class="top-lang">
    <select id="selector-idioma" onchange="cambiarIdioma(this.value)">
      <option value="es">Español</option>
      <option value="en">English</option>
      <option value="pt">Português</option>
      <option value="zh">中文</option>
      <option value="ar">العربية</option>
    </select>
    <button class="lang-link" onclick="document.getElementById('selector-idioma').click()">
      <span id="idioma-actual">Español</span>
    </button>
  </div>

  <!-- ✅ Buscador ARRIBA del logo -->
  <div class="search-bar">
    <input type="text" data-txt-placeholder="buscarPlaceholder">
  </div>

  <!-- ✅ Logo -->
  <div class="logo-container">
    <div class="logo-text-main">Dimon <span>Connect</span></div>
    <div class="logo-text-sub" data-txt="serviciosAutonomos">Servicios Autónomos</div>
  </div>

  <!-- ✅ Botones principales — TODOS CONECTADOS -->
  <div class="buttons-container">
    <button class="main-btn" onclick="window.location.href='pantallas/oferta-demanda.html'" data-txt="ofertaDemanda"></button>
    <button class="main-btn" onclick="window.location.href='pantallas/brindar-servicio.html'" data-txt="brindarServicio"></button>
    <button class="main-btn" onclick="window.location.href='pantallas/solicitar-servicio.html'" data-txt="solicitarServicio"></button>
  </div>

  <!-- ✅ Pie de página -->
  <div class="footer">
    <button class="lira-btn" onclick="window.location.href='pantallas/lira-chat.html'">✚</button>
    <div class="footer-middle">
      <a href="pantallas/normas-seguridad.html" data-txt="normas"></a> ·
      <a href="pantallas/privacidad.html" data-txt="privacidad"></a> ·
      <a href="pantallas/terminos-servicio.html" data-txt="terminos"></a> ·
      <a href="pantallas/cookies.html" data-txt="cookies"></a>
    </div>
    <button class="download-btn" onclick="window.location.href='pantallas/descarga-app.html'" data-txt="descargarApp"></button>
  </div>

  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const selector = document.getElementById('selector-idioma');
      const indicador = document.getElementById('idioma-actual');
      
      const actualizarIndicadorIdioma = () => {
        const nombres = { es: 'Español', en: 'English', pt: 'Português', zh: '中文', ar: 'العربية' };
        indicador.textContent = nombres[idiomaActual] || 'Español';
      };
      
      setTimeout(actualizarIndicadorIdioma, 100);
      
      const idiomaOriginal = window.cambiarIdioma;
      window.cambiarIdioma = function(nuevoIdioma) {
        if (idiomaOriginal) idiomaOriginal(nuevoIdioma);
        setTimeout(actualizarIndicadorIdioma, 50);
      };
    });
  </script>

</body>
</html>
