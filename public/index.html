    /* Selector de idioma — Arriba izquierda */
    .selector-idioma {
      position: absolute;

      left: 8vw;
      z-index: 25;
    }
    .selector-idioma select {
      padding: 0.6rem 2.5rem 0.6rem 1.2rem;
      border-radius: 10px;

      background-repeat: no-repeat;
      background-position: right 0.8rem center;
      background-size: 1.2rem;
      min-width: 180px;
    }

    /* Botón Lira — Arriba derecha */
    .boton-lira {
      position: absolute;
      top: 4vh;
      right: 8vw;
      width: 56px;
      height: 56px;
      border-radius: 10px;
      border: 3px solid #ffd700;
      background: linear-gradient(135deg, #003366, #0066cc);
      color: #ffd700;
      font-size: 2rem;
      font-weight: bold;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      z-index: 25;
    }

    /* Contenido central — Debajo del logo, sobre el mapa */
    .contenedor {
      position: absolute;
      top: 38vh;
      left: 0;
      width: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 0 6vw;
      gap: 4.5vh;
    }

    /* Buscador */
    .buscador {
      width: 100%;
      max-width: 520px;
      display: flex;
      align-items: center;
    }
    .buscador input {
      flex: 1;
      padding: 1.1rem 1.5rem;
      border: 2px solid rgba(255,255,255,0.25);
      border-radius: 12px 0 0 12px;
      font-size: 1rem;
      color: #fff;
      background: rgba(255,255,255,0.15);
      outline: none;
      backdrop-filter: blur(6px);
    }
    .buscador input::placeholder { color: rgba(255,255,255,0.6); }
    .buscador button {
      padding: 1.1rem 1.4rem;
      border: 2px solid rgba(0,204,255,0.4);
      border-left: none;
      border-radius: 0 12px 12px 0;
      background: rgba(0,204,255,0.3);
      color: #fff;
      font-size: 1.3rem;
      cursor: pointer;
      backdrop-filter: blur(6px);
    }

    /* Botones principales */
    .botones-principales {
      width: 100%;
      max-width: 520px;
      display: flex;
      flex-direction: column;
      gap: 2.5vh;
    }
    .boton {
      padding: 1.25rem 1.5rem;
      border-radius: 14px;
      font-size: 1.1rem;
      font-weight: 600;
      text-align: center;
      text-decoration: none;
      transition: all 0.2s;
      border: 2px solid transparent;
      backdrop-filter: blur(6px);
    }
    .boton-primario {
      background: linear-gradient(135deg, #00cc44, #009933);
      color: #fff;
      box-shadow: 0 4px 15px rgba(0,204,68,0.3);
    }
    .boton-secundario {
      background: rgba(255,255,255,0.12);
      color: #fff;
      border: 2px solid rgba(255,255,255,0.25);
    }
    .boton-terciario {
      background: rgba(0,51,102,0.5);
      color: #00ccff;
      border: 2px solid rgba(0,204,255,0.3);
    }
    .boton:active { transform: scale(0.98); }

    .boton-descarga {
      position: absolute;
      bottom: 12vh;
      left: 6vw;
      padding: 1rem 2.5rem;
      background: linear-gradient(135deg, #ff8800, #cc6600);
      color: #fff;
      border-radius: 50px;
      text-decoration: none;
      font-size: 1.05rem;
      font-weight: 700;
      box-shadow: 0 4px 15px rgba(255,136,0,0.35);
      z-index: 15;
      border: none;
    }
