<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dimon Connect</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><polygon points='50,5 95,50 50,95 5,50' fill='%231E40AF'/></svg>">
</head>
<body>
    <div class="pantalla-inicio">
        <div class="logo-contenedor">
            <svg class="logo-rombo" viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg">
                <defs>
                    <linearGradient id="grad-rombo" x1="0%" y1="0%" x2="100%" y2="100%">
                        <stop offset="0%" stop-color="#1E40AF"/>
                        <stop offset="100%" stop-color="#06B6D4"/>
                    </linearGradient>
                </defs>
                <polygon points="60,10 110,60 60,110 10,60" fill="url(#grad-rombo)" stroke="#0F172A" stroke-width="2"/>
            </svg>
            <h1 class="logo-texto">Dimon Connect</h1>
        </div>

        <p class="mensaje-principal">Acá encontrás la persona justa para lo que necesitás.</p>
        <p class="mensaje-secundario">Personas que saben. Personas que ayudan. Confianza de verdad.</p>

        <div class="botones-principales">
            <a href="buscar.html" class="boton boton-primario">
                Necesito ayuda
            </a>
            <a href="ofrecer.html" class="boton boton-secundario">
                Ofrezco mi trabajo
            </a>
        </div>

        <p class="texto-chico">Sin títulos obligatorios · Sin comisiones ocultas</p>
    </div>
</body>
</html>
