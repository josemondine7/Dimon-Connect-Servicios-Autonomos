<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Dimon Connect - Servicios Autónomos</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            margin: 0;
            padding: 0;
            background: #0D47A1;
        }
        .contenedor-total {
            position: relative;
            width: 100vw;
            height: 100vh;
            overflow: hidden;
        }
        .canva-contenedor {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border: none;
        }
        .canva-contenedor iframe {
            position: absolute;
            width: 100%;
            height: 100%;
            top: 0;
            left: 0;
            border: none;
        }
        .boton-capa {
            position: absolute;
            z-index: 100;
            text-decoration: none;
            display: block;
            cursor: pointer;
            width: 80%;
            height: 75px;
            left: 50%;
            transform: translateX(-50%);
            background: transparent;
            border: none;
        }
        .boton-1 { top: 36%; }
        .boton-2 { top: 48%; }
        .boton-3 { top: 60%; }
    </style>
</head>
<body>

<div class="contenedor-total">

    <div class="canva-contenedor">
        <iframe loading="lazy" 
            src="https://www.canva.com/design/DAHS4hrqMR0/n83vPCgnKMKIMRtbgvcfPg/view?embed" 
            allowfullscreen="allowfullscreen" 
            allow="fullscreen">
        </iframe>
    </div>

    <a href="buscar.html" class="boton-capa boton-1"></a>
    <a href="ofrecer.html" class="boton-capa boton-2"></a>
    <a href="ofertas.html" class="boton-capa boton-3"></a>

</div>

</body>
</html>
