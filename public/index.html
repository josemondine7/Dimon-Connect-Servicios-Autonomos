<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <!-- ✅ ARREGLÓ LO DE TODO GIGANTE — Ajusta bien la pantalla -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Dimon Connect | Servicios Autónomos</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    html, body {
      width: 100%;
      min-height: 100vh;
      margin: 0;
      padding: 0;
      /* ✅ FONDO FIJO — NO SE MUEVE */
      background: url('06f9228d-9ba5-4998-9604-c4432eefaa34_20260825_182353_0000.png') no-repeat center center fixed;
      background-size: cover;
      background-attachment: fixed;
      color: #ffffff;
      text-align: center;
      padding: 1.5rem;
      padding-bottom: 7rem;
      overflow-x: hidden;
    }

    .capa-sombra {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(5, 16, 64, 0.25);
      z-index: -1;
    }

    .contenedor {
      width: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      position: relative;
      z-index: 1;
    }

    /* ✅ ESPACIO JUSTO — NO TAPA EL LOGO NI EL NOMBRE */
    .espacio-superior {
      height: 38vh; /* Deja ver rombo + Dimon Connect completos */
      width: 100%;
    }

    /* --- BARRA DE BÚSQUEDA --- */
    .buscador {
      display: flex;
      justify-content: center;
      gap: 0;
      margin-bottom: 3rem;
      width: 100%;
      max-width: 500px;
    }

    .buscador form {
      display: flex;
      width: 100%;
    }

    .buscador input {
      flex: 1;
      padding: 1rem 1.3rem;
      font-size: 1rem;
      border: none;
      border-radius: 12px 0 0 12px;
      background: rgba(255, 255, 255, 0.95);
      color: #051040;
      outline: none;
    }

    .buscador button {
      padding: 1rem 1.3rem;
      border: none;
      border-radius: 0 12px 12px 0;
      background: #00ccff;
      color: #051040;
      font-size: 1.1rem;
      cursor: pointer;
      transition: background 0.2s;
    }

    .buscador button:hover {
      background: #00b8e6;
    }

    /* --- BOTONES PRINCIPALES --- */
    .botones {
      display: flex;
      flex-direction: column;
      gap: 1.1rem;
      align-items: center;
      margin-bottom: 3rem;
      width: 100%;
    }

    .boton {
      width: 300px;
      max-width: 90%;
      padding: 1.1rem;
      border-radius: 12px;
      font-size: 1rem;
      font-weight: 600;
      text-decoration: none;
      display: block;
      transition: all 0.2s;
      cursor: pointer;
    }

    .boton:hover {
      transform: translateY(-2px);
      box-shadow: 0 4px 12px rgba(0, 204, 255, 0.3);
    }

    .boton-1 {
      background: #00ccff;
      color: #051040;
      border: none;
    }

    .boton-2 {
      background: transparent;
      color: #ffffff;
      border: 2px solid #00ccff;
    }

    .boton-3 {
      background: transparent;
      color: #ffffff;
      border: 2px solid #ffffff;
    }

    /* --- ENLACES DE ABAJO — SIEMPRE VISIBLES --- */
    .pie {
      width: 100%;
      position: relative;
      z-index: 2;
    }

    .enlaces-pie {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 1rem;
      margin-bottom: 0.8rem;
      padding: 0.8rem;
      background: rgba(0, 20, 60, 0.5);
      border-radius: 12px;
    }

    .enlaces-pie a {
      color: #b0e0ff;
      text-decoration: none;
      font-size: 0.85rem;
      border-bottom: 1px solid transparent;
      transition: all 0.2s;
    }

    .enlaces-pie a:hover {
      border-bottom-color: #00ccff;
      color: #ffffff;
    }

    .asistente-lira {
      color: #00ccff;
      font-size: 0.9rem;
      text-decoration: none;
      display: inline-block;
      margin-top: 0.5rem;
      padding: 0.6rem 1.2rem;
      border-radius: 10px;
      background: rgba(0, 204, 255, 0.15);
    }

    .asistente-lira:hover {
      background: rgba(0, 204, 255, 0.25);
      text-shadow: 0 0 8px #00ccff;
    }

    /* --- BOTÓN DE DESCARGA --- */
    .descarga {
      position: fixed;
      left: 1.2rem;
      bottom: 1.2rem;
      padding: 0.7rem 1rem;
      border-radius: 8px;
      background: #ff7700;
      color: #ffffff;
      border: none;
      font-weight: 600;
      font-size: 0.85rem;
      text-decoration: none;
      z-index: 10;
      transition: background 0.2s;
    }

    .descarga:hover {
      background: #e66a00;
    }

    /* ✅ COMPUTADORA — Se ve bien sin achicarse */
    @media (min-width: 768px) {
      .espacio-superior { height: 35vh; }
      .buscador { max-width: 600px; }
      .botones { flex-direction: row; justify-content: center; gap: 1.5rem; flex-wrap: wrap; }
      .boton { width: 240px; }
      .enlaces-pie { gap: 1.5rem; }
    }

    /* ✅ CELULAR — Se adapta perfecto */
    @media (max-width: 480px) {
      .espacio-superior { height: 30vh; }
      .descarga { position: static; margin: 1rem auto; display: block; width: fit-content; }
      .enlaces-pie { gap: 0.7rem; }
    }
  </style>
</head>
<body>

  <div class="capa-sombra"></div>

  <div class="contenedor">

    <!-- Espacio para que NO tape el logo ni el nombre -->
    <div class="espacio-superior"></div>

    <!-- 🔍 BUSCADOR -->
    <div class="buscador">
      <form action="buscar.html" method="get">
        <input type="search" name="q" placeholder="Buscar servicios, personas..." required>
        <button type="submit">🔍</button>
      </form>
    </div>

    <!-- 🟢 BOTONES PRINCIPALES -->
    <div class="botones">
      <a href="ofrecer.html" class="boton boton-1">Ofrecer mis servicios</a>
      <a href="solicitar.html" class="boton boton-2">Solicitar un servicio</a>
      <a href="login.html" class="boton boton-3">Iniciar sesión</a>
    </div>

    <!-- 🔗 ENLACES DE ABAJO — TODOS VISIBLES -->
    <div class="pie">
      <nav class="enlaces-pie">
        <a href="normas.html">📜 Normas y Seguridad</a>
        <a href="normas.html#privacidad">🔒 Privacidad</a>
        <a href="normas.html#terminos">📄 Términos de Servicio</a>
        <a href="normas.html#cookies">🍪 Cookies</a>
        <a href="normas.html#contacto">📬 Contacto</a>
      </nav>
      <a href="lira.html" class="asistente-lira">🤖 Hablar con el Asistente Lira</a>
    </div>

  </div>

  <!-- 📱 BOTÓN DE DESCARGA -->
  <a href="#" class="descarga">📱 Descargar aplicación</a>

</body>
</html>
