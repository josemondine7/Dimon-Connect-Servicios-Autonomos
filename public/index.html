<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="description" content="Dimon Connect - Servicios autónomos entre personas" />
  <title>Dimon Connect — Servicios Autónomos</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
    html, body { width: 100%; height: 100vh; overflow: hidden; position: fixed; }
    body {
      background-color: #0066FF;
      background-image: url('./1788448614792.png');
      background-repeat: no-repeat;
      background-position: center center;
      background-size: cover;
      color: #ffffff;
    }
    .selector-idioma { position: fixed; top: 1.5rem; left: 1.5rem; z-index: 25; }
    .selector-idioma select {
      padding: 0.5rem 0.9rem; border-radius: 8px; border: 2px solid rgba(255,215,0,0.6);
      background: rgba(0,51,102,0.9); color: #fff; font-size: 0.85rem; cursor: pointer; outline: none;
      backdrop-filter: blur(6px);
    }
    .boton-lira {
      position: fixed; top: 1.5rem; right: 1.5rem; width: 56px; height: 56px; border-radius: 12px;
      border: 3px solid #ffd700; background: linear-gradient(135deg, #003366, #0066cc);
      color: #ffd700; font-size: 1.8rem; display: flex; align-items: center; justify-content: center;
      cursor: pointer; z-index: 25;
    }
    .contenedor {
      position: absolute; top: 0; left: 0; width: 100%; height: 100vh; display: flex;
      flex-direction: column; align-items: center; justify-content: center; padding: 1.5rem;
      padding-top: 28vh; padding-bottom: 10rem;
    }
    .buscador {
      width: 100%; max-width: 500px; display: flex; margin-bottom: 2rem; z-index: 10;
    }
    .buscador input {
      flex: 1; padding: 1rem 1.25rem; border: 1px solid rgba(255,255,255,0.35);
      border-radius: 12px 0 0 12px; font-size: 1rem; color: #fff;
      background: rgba(255,255,255,0.15); outline: none;
    }
    .buscador input::placeholder { color: rgba(255,255,255,0.65); }
    .buscador button {
      padding: 0 1.5rem; border: 1px solid rgba(0,204,255,0.5);
      border-radius: 0 12px 12px 0; background: rgba(0,204,255,0.35);
      color: #fff; font-size: 1.2rem; cursor: pointer;
    }
    .botones-principales {
      width: 100%; max-width: 500px; display: flex; flex-direction: column; gap: 1rem;
    }
    .boton {
      padding: 1.1rem 1.5rem; border-radius: 12px; font-size: 1.05rem; font-weight: 600;
      text-align: center; text-decoration: none; transition: all 0.25s; cursor: pointer;
      border: 2px solid transparent;
    }
    .boton-primario {
      background: linear-gradient(135deg, #00cc44, #009933); color: #fff;
      box-shadow: 0 4px 15px rgba(0,204,68,0.35);
    }
    .boton-secundario {
      background: rgba(255,255,255,0.12); color: #fff;
      border: 2px solid rgba(255,255,255,0.25);
    }
    .boton-terciario {
      background: rgba(0,51,102,0.6); color: #00ccff;
      border: 2px solid rgba(0,204,255,0.3);
    }
    .boton:hover { transform: translateY(-2px); }
    .boton-descarga {
      position: fixed; bottom: 4.5rem; left: 1.5rem; padding: 0.8rem 1.2rem;
      background: linear-gradient(135deg, #ff8800, #cc6600); color: #fff;
      border-radius: 50px; text-decoration: none; font-size: 0.9rem; font-weight: 700;
      box-shadow: 0 4px 15px rgba(255,136,0,0.35); z-index: 15;
    }
    .pie {
      position: fixed; bottom: 0; left: 0; width: 100%; padding: 1rem 1.5rem;
      background: rgba(0,30,60,0.85); backdrop-filter: blur(10px);
      display: flex; flex-wrap: wrap; justify-content: center; gap: 1.2rem;
      border-top: 1px solid rgba(255,255,255,0.1);
    }
    .enlace-pie {
      color: #b0e0ff; font-size: 0.85rem; text-decoration: none;
      border-bottom: 1px solid transparent; transition: all 0.2s;
    }
    .enlace-pie:hover { color: #ffd700; border-bottom-color: #ffd700; }
    .modal-contraseña {
      position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.85);
      display: none; align-items: center; justify-content: center; z-index: 100; padding: 1.5rem;
    }
    .modal-contraseña.activo { display: flex; }
    .caja-contraseña {
      background: linear-gradient(135deg, #003366, #0055aa); border: 3px solid #ffd700; border-radius: 16px;
      padding: 2.5rem 2rem; width: 100%; max-width: 400px; text-align: center;
    }
    .caja-contraseña h3 { color: #ffd700; margin-bottom: 1.5rem; }
    .caja-contraseña input {
      width: 100%; padding: 1rem; border-radius: 8px; border: 2px solid #ffd700;
      background: rgba(255,255,255,0.1); color: #fff; font-size: 1rem;
      text-align: center; margin-bottom: 1rem; outline: none;
    }
    .botones-modal { display: flex; gap: 1rem; justify-content: center; margin-top: 0.5rem; }
    .boton-modal { padding: 0.75rem 1.5rem; border-radius: 8px; border: none; font-size: 1rem; font-weight: 600; cursor: pointer; }
    .boton-confirmar { background: #ffd700; color: #000; }
    .boton-cancelar { background: transparent; color: #fff; border: 2px solid rgba(255,255,255,0.4); }
    @media (max-width: 768px) {
      .botones-principales { max-width: 90%; }
      .boton { font-size: 1rem; padding: 1rem 1.2rem; }
      .pie { gap: 0.8rem; }
      .enlace-pie { font-size: 0.78rem; }
    }
  </style>
</head>
<body>

  <div class="selector-idioma">
    <select id="idioma">
      <option value="es">Español</option>
      <option value="en">English</option>
      <option value="pt">Português</option>
      <option value="fr">Français</option>
      <option value="it">Italiano</option>
      <option value="de">Deutsch</option>
      <option value="zh">中文</option>
      <option value="ru">Русский</option>
      <option value="ar">العربية</option>
      <option value="ja">日本語</option>
      <option value="ko">한국어</option>
      <option value="nl">Nederlands</option>
      <option value="pl">Polski</option>
      <option value="tr">Türkçe</option>
    </select>
  </div>

  <button class="boton-lira" onclick="abrirLira()"></button>

  <div class="modal-contraseña" id="modal-lira">
    <div class="caja-contraseña">
      <h3>Acceso interno</h3>
      <input type="password" id="clave-lira" placeholder="Escribir contraseña" />
      <div class="botones-modal">
        <button class="boton-modal boton-cancelar" onclick="cerrarLira()">Cancelar</button>
        <button class="boton-modal boton-confirmar" onclick="verificarLira()">Ingresar</button>
      </div>
    </div>
  </div>

  <div class="contenedor">
    <div class="buscador">
      <input type="text" id="buscador" placeholder="Buscar servicios, personas, categorías..." />
      <button onclick="buscar()">🔍</button>
    </div>

    <div class="botones-principales">
      <a href="ofrecer.html" class="boton boton-primario">Ofrecer mi servicio</a>
      <a href="oferta-demanda.html" class="boton boton-secundario">Oferta y Demanda de Servicios</a>
      <a href="login.html" class="boton boton-terciario">Iniciar sesión</a>
    </div>
  </div>

  <a href="descarga.html" class="boton-descarga">Descargar aplicación</a>

  <div class="pie">
    <a href="normas-seguridad.html" class="enlace-pie">Normas y Seguridad</a>
    <a href="privacidad.html" class="enlace-pie">Política de Privacidad</a>
    <a href="politica-cookies.html" class="enlace-pie">Política de Cookies</a>
    <a href="terminos-servicio.html" class="enlace-pie">Términos de Servicio</a>
    <a href="contacto.html" class="enlace-pie">Contacto</a>
  </div>

<script>
  function abrirLira() { document.getElementById('modal-lira').classList.add('activo'); }
  function cerrarLira() { document.getElementById('modal-lira').classList.remove('activo'); }
  function verificarLira() {
    const clave = document.getElementById('clave-lira').value;
    if (clave === 'LiraAdmin2026') {
      window.location.href = 'chat-lira.html';
    } else {
      alert('Contraseña incorrecta');
    }
  }
  function buscar() {
    const texto = document.getElementById('buscador').value;
    if (texto.trim() !== '') {
      window.location.href = 'oferta-demanda.html?buscar=' + encodeURIComponent(texto);
    }
  }
  document.getElementById('buscador').addEventListener('keydown', function(e) {
    if (e.key === 'Enter') buscar();
  });
</script>

</body>
</html>
