<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Dimon Connect — Servicios Autónomos</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Segoe UI', sans-serif;
    }

    html, body {
      width: 100%;
      height: 100vh;
      overflow: hidden;
      position: fixed;
    }

    /* ===== TU FONDO — YA APUNTA A TU ARCHIVO ===== */
    body {
      background: url('Fondo-pantalla-Dimon.png') no-repeat center center fixed;
      background-size: cover;
      background-position: center center;
      color: #ffffff;
    }

    /* ===== SELECTOR DE IDIOMAS — ARRIBA IZQUIERDA ===== */
    .selector-idioma {
      position: fixed;
      top: 1.5rem;
      left: 1.5rem;
      z-index: 25;
    }
    .selector-idioma select {
      padding: 0.5rem 0.9rem;
      border-radius: 8px;
      border: 2px solid rgba(255,215,0,0.6);
      background: rgba(0,51,102,0.9);
      color: #fff;
      font-size: 0.85rem;
      cursor: pointer;
      outline: none;
      backdrop-filter: blur(6px);
      transition: all 0.2s;
    }
    .selector-idioma select:hover {
      border-color: #ffd700;
      box-shadow: 0 0 15px rgba(255,215,0,0.4);
    }

    /* ===== ESCUDO LIRA — ARRIBA DERECHA ===== */
    .boton-lira {
      position: fixed;
      top: 1.5rem;
      right: 1.5rem;
      width: 56px;
      height: 56px;
      border-radius: 12px;
      border: 3px solid #ffd700;
      background: linear-gradient(135deg, #003366, #0066cc);
      color: #ffd700;
      font-size: 1.8rem;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      z-index: 25;
      transition: all 0.3s;
    }
    .boton-lira::before { content: "✚"; }
    .boton-lira:hover { transform: scale(1.08); }

    /* ===== VENTANA DE CONTRASEÑA ===== */
    .modal-contraseña {
      position: fixed;
      top: 0; left: 0;
      width: 100%; height: 100%;
      background: rgba(0,0,0,0.85);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 100;
      padding: 1.5rem;
    }
    .modal-contraseña.activo { display: flex; }
    .caja-contraseña {
      background: linear-gradient(135deg, #003366, #0055aa);
      border: 3px solid #ffd700;
      border-radius: 16px;
      padding: 2.5rem 2rem;
      width: 100%; max-width: 400px;
      text-align: center;
    }
    .caja-contraseña h3 { color: #ffd700; margin-bottom: 1.5rem; }
    .caja-contraseña input {
      width: 100%; padding: 1rem;
      border-radius: 8px;
      border: 2px solid #ffd700;
      background: rgba(255,255,255,0.1);
      color: #fff;
      font-size: 1rem;
      text-align: center;
      margin-bottom: 1rem;
      outline: none;
    }
    .botones-modal { display: flex; gap: 1rem; justify-content: center; margin-top: 0.5rem; }
    .boton-modal {
      padding: 0.75rem 1.5rem;
      border-radius: 8px;
      border: none;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
    }
    .boton-confirmar { background: #ffd700; color: #000; }
    .boton-cancelar { background: transparent; color: #fff; border: 2px solid rgba(255,255,255,0.4); }
    .error-contraseña { color: #ff6b6b; margin-top: 1rem; display: none; }

    /* ===== CONTENEDOR PRINCIPAL ===== */
    .contenedor {
      position: absolute;
      top: 0; left: 0;
      width: 100%; height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 1.5rem;
      padding-top: 32vh;
      padding-bottom: 8rem;
    }

    /* ===== BUSCADOR ===== */
    .buscador {
      width: 100%; max-width: 500px;
      display: flex;
      margin-bottom: 2rem;
      z-index: 10;
    }
    .buscador input {
      flex: 1;
      padding: 1rem 1.25rem;
      border: 1px solid rgba(255,255,255,0.35);
      border-radius: 12px 0 0 12px;
      font-size: 1rem;
      color: #fff;
      background: rgba(255,255,255,0.15);
      outline: none;
    }
    .buscador input::placeholder { color: rgba(255,255,255,0.65); }
    .buscador button {
      padding: 0 1.5rem;
      border: 1px solid rgba(0,204,255,0.5);
      border-radius: 0 12px 12px 0;
      background: rgba(0,204,255,0.35);
      color: #fff;
      font-size: 1.2rem;
      cursor: pointer;
      transition: all 0.25s;
    }
    .buscador button:hover { background: rgba(0,204,255,0.55); }

    /* ===== BOTONES PRINCIPALES ===== */
    .botones-principales {
      width: 100%; max-width: 500px;
      display: flex;
      flex-direction: column;
      gap: 1rem;
      z-index: 10;
    }
    .boton {
      padding: 1.15rem 1.5rem;
      border-radius: 12px;
      border: 2px solid rgba(255,255,255,0.4);
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      text-decoration: none;
      text-align: center;
      transition: all 0.25s ease;
      background: rgba(255,255,255,0.1);
      color: #fff;
      width: 100%;
    }
    .boton:hover { background: rgba(255,255,255,0.25); transform: translateY(-2px); }
    .boton-primario { border-color: rgba(0,204,255,0.6); background: rgba(0,204,255,0.25); }
    .boton-primario:hover { background: rgba(0,204,255,0.45); }

    /* ===== BOTÓN DESCARGA — ABAJO IZQUIERDA ===== */
    .boton-descarga {
      position: fixed;
      bottom: 1.5rem;
      left: 1.5rem;
      padding: 0.8rem 1.2rem;
      border-radius: 10px;
      border: 2px solid rgba(255,153,0,0.6);
      background: rgba(255,153,0,0.35);
      color: #fff;
      font-size: 0.85rem;
      font-weight: 700;
      text-decoration: none;
      z-index: 15;
      transition: all 0.2s;
    }
    .boton-descarga:hover { background: rgba(255,153,0,0.55); }

    /* ===== ENLACES INFERIORES — ABAJO CENTRO ===== */
    .enlaces-inferiores {
      position: fixed;
      bottom: 1.5rem;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      flex-direction: row;
      gap: 1rem;
      justify-content: center;
      z-index: 15;
      font-size: 0.8rem;
      white-space: nowrap;
    }
    .enlaces-inferiores a {
      color: rgba(176,224,255,0.9);
      text-decoration: none;
      border-bottom: 1px solid transparent;
      transition: all 0.2s;
    }
    .enlaces-inferiores a:hover { color: #fff; border-bottom-color: rgba(0,204,255,0.6); }

    /* ===== RESPONSIVE ===== */
    @media (max-width: 480px) {
      .contenedor { padding: 1rem; padding-top: 25vh; padding-bottom: 7rem; }
      .buscador input { font-size: 0.95rem; padding: 0.9rem 1rem; }
      .boton { padding: 1rem 1.25rem; font-size: 0.95rem; }
      .enlaces-inferiores { font-size: 0.6rem; gap: 0.4rem; }
      .boton-descarga { bottom: 4.5rem; left: 1rem; padding: 0.7rem 1rem; font-size: 0.75rem; }
      .boton-lira { top: 1rem; right: 1rem; width: 48px; height: 48px; font-size: 1.5rem; }
      .selector-idioma { top: 1rem; left: 1rem; }
    }
  </style>
</head>
<body>

  <!-- 🌐 SELECTOR DE IDIOMAS -->
  <div class="selector-idioma">
    <select id="idioma">
      <option value="es">🇪🇸 Español</option>
      <option value="zh">🇨🇳 中文</option>
      <option value="en">🇺🇸 English</option>
      <option value="pt">🇧🇷 Português</option>
      <option value="ru">🇷🇺 Русский</option>
      <option value="fr">🇫🇷 Français</option>
      <option value="de">🇩🇪 Deutsch</option>
      <option value="ja">🇯🇵 日本語</option>
      <option value="ar">🇸🇦 العربية</option>
      <option value="hi">🇮🇳 हिन्दी</option>
      <option value="bn">🇧🇩 বাংলা</option>
      <option value="ur">🇵🇰 اردو</option>
      <option value="id">🇮🇩 Bahasa Indonesia</option>
      <option value="tr">🇹🇷 Türkçe</option>
    </select>
  </div>

  <!-- 🛡️ ESCUDO LIRA → CONTRASEÑA -->
  <div class="boton-lira" id="botonLira" title="Hablar con Lira"></div>

  <!-- 🔒 VENTANA DE CONTRASEÑA -->
  <div class="modal-contraseña" id="modalContraseña">
    <div class="caja-contraseña">
      <h3>🔐 Acceso a Lira</h3>
      <input type="password" id="inputContraseña" placeholder="Escribir contraseña..." />
      <div class="botones-modal">
        <button class="boton-modal boton-cancelar" id="btnCancelar">Cancelar</button>
        <button class="boton-modal boton-confirmar" id="btnConfirmar">Entrar</button>
      </div>
      <div class="error-contraseña" id="errorContraseña">❌ Contraseña incorrecta</div>
    </div>
  </div>

  <!-- CONTENIDO PRINCIPAL -->
  <main class="contenedor">
    <!-- 🔍 BUSCADOR -->
    <div class="buscador">
      <input type="text" placeholder="Buscar servicios, personas, ayuda..." />
      <button type="submit">🔍</button>
    </div>

    <!-- 🟦 BOTONES PRINCIPALES -->
    <div class="botones-principales">
      <a href="ofrecer.html" class="boton boton-primario">Ofrecer mis servicios</a>
      <a href="solicitar.html" class="boton">Solicitar un servicio</a>
      <a href="login.html" class="boton">Iniciar sesión</a>
    </div>
  </main>

  <!-- 🟧 BOTÓN DESCARGA -->
  <a href="descargar.html" class="boton-descarga">Descargar aplicación</a>

  <!-- 📄 ENLACES INFERIORES -->
  <nav class="enlaces-inferiores">
    <a href="normas.html#normas">Normas y Seguridad</a>
    <a href="normas.html#privacidad">Privacidad</a>
    <a href="normas.html#terminos">Términos de Servicio</a>
    <a href="normas.html#cookies">Cookies</a>
    <a href="normas.html#contacto">Contacto</a>
  </nav>

  <!-- ===== JAVASCRIPT — CONTRASEÑA ===== -->
  <script>
    const botonLira = document.getElementById('botonLira');
    const modalContraseña = document.getElementById('modalContraseña');
    const inputContraseña = document.getElementById('inputContraseña');
    const btnConfirmar = document.getElementById('btnConfirmar');
    const btnCancelar = document.getElementById('btnCancelar');
    const errorContraseña = document.getElementById('errorContraseña');
    const CONTRASEÑA_CORRECTA = 'Mondine5781Lira';

    botonLira.addEventListener('click', () => {
      modalContraseña.classList.add('activo');
      inputContraseña.value = '';
      errorContraseña.style.display = 'none';
      inputContraseña.focus();
    });

    btnCancelar.addEventListener('click', () => {
      modalContraseña.classList.remove('activo');
      inputContraseña.value = '';
      errorContraseña.style.display = 'none';
    });

    btnConfirmar.addEventListener('click', verificarContraseña);
    inputContraseña.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') verificarContraseña();
    });

    function verificarContraseña() {
      if (inputContraseña.value === CONTRASEÑA_CORRECTA) {
        window.location.href = 'lira.html';
      } else {
        errorContraseña.style.display = 'block';
        inputContraseña.value = '';
        inputContraseña.focus();
      }
    }
  </script>

</body>
</html>
