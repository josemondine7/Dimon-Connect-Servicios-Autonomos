<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Dimon Connect — Servicios Autónomos</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Segoe UI', sans-serif;
    }

    html, body {
      width: 100%;
      min-height: 100vh;
      overflow-x: hidden;
    }

    /* ===== TU FONDO COMPLETO — YA TRAE ROMBO, DIMON CONNECT Y EL MAPA ===== */
    body {
      background: url('06f9228d-9ba5-4998-9604-c4432eefaa34_20260825_182353_0000.png') no-repeat center center fixed;
      background-size: cover;
      background-position: center center;
      color: #ffffff;
    }

    /* Sombra MUY LEVE para que se lean los botones SIN tapar el fondo */
    .capa-sombra {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(5, 16, 64, 0.15); /* Muy suave, no tapa nada */
      z-index: 0;
      pointer-events: none;
    }

    /* ===== CONTENIDO — TODO ABAJO DEL LOGO, NO LO TAPA ===== */
    .contenedor {
      position: relative;
      z-index: 1;
      width: 100%;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: flex-end; /* Empuja todo hacia abajo */
      align-items: center;
      padding: 1.5rem;
      padding-top: 50vh; /* DEJA ESPACIO ARRIBA — ROMBO Y NOMBRE QUEDAN LIBRES */
      padding-bottom: 8rem;
    }

    /* ===== BUSCADOR ===== */
    .buscador {
      width: 100%;
      max-width: 500px;
      display: flex;
      margin-bottom: 2rem;
    }

    .buscador input {
      flex: 1;
      padding: 1rem 1.25rem;
      border: none;
      border-radius: 12px 0 0 12px;
      font-size: 1rem;
      color: #051040;
      background: rgba(255, 255, 255, 0.95);
      outline: none;
    }

    .buscador button {
      padding: 0 1.5rem;
      border: none;
      border-radius: 0 12px 12px 0;
      background: #00ccff;
      color: #051040;
      font-size: 1.2rem;
      cursor: pointer;
      transition: background 0.2s;
    }

    .buscador button:hover {
      background: #00f2fe;
    }

    /* ===== BOTONES PRINCIPALES ===== */
    .botones-principales {
      width: 100%;
      max-width: 520px;
      display: flex;
      flex-direction: column;
      gap: 1rem;
    }

    .boton {
      padding: 1.15rem 1.5rem;
      border-radius: 12px;
      border: none;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      text-decoration: none;
      text-align: center;
      transition: all 0.25s ease;
    }

    .boton-primario {
      background: #00ccff;
      color: #051040;
    }

    .boton-primario:hover {
      background: #00f2fe;
      transform: translateY(-2px);
    }

    .boton-secundario {
      background: rgba(0, 204, 255, 0.15);
      color: #ffffff;
      border: 2px solid #00ccff;
    }

    .boton-secundario:hover {
      background: rgba(0, 204, 255, 0.3);
      transform: translateY(-2px);
    }

    .boton-terciario {
      background: rgba(255, 255, 255, 0.1);
      color: #ffffff;
      border: 2px solid rgba(255, 255, 255, 0.3);
    }

    .boton-terciario:hover {
      background: rgba(255, 255, 255, 0.2);
      transform: translateY(-2px);
    }

    /* ===== BOTÓN DESCARGA — ABAJO IZQUIERDA ===== */
    .boton-descarga {
      position: fixed;
      bottom: 1.5rem;
      left: 1.5rem;
      padding: 0.85rem 1.25rem;
      border-radius: 10px;
      border: none;
      background: #ff9900;
      color: #000000;
      font-size: 0.9rem;
      font-weight: 700;
      cursor: pointer;
      text-decoration: none;
      z-index: 2;
      transition: all 0.2s;
    }

    .boton-descarga:hover {
      background: #ffb347;
      transform: translateY(-2px);
    }

    /* ===== ENLACES INFERIORES ===== */
    .enlaces-inferiores {
      position: fixed;
      bottom: 1.5rem;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      flex-wrap: wrap;
      gap: 1.25rem;
      justify-content: center;
      z-index: 2;
      font-size: 0.85rem;
    }

    .enlaces-inferiores a {
      color: #b0e0ff;
      text-decoration: none;
      border-bottom: 1px solid transparent;
      transition: all 0.2s;
    }

    .enlaces-inferiores a:hover {
      color: #ffffff;
      border-bottom-color: #00ccff;
    }

    /* ===== RESPONSIVE — SE ADAPTA A CELULAR Y COMPUTADORA ===== */
    @media (min-width: 768px) {
      .botones-principales {
        flex-direction: row;
        flex-wrap: wrap;
        justify-content: center;
      }
      .boton {
        flex: 1 1 auto;
        min-width: 160px;
      }
      .contenedor {
        padding-top: 55vh; /* Más espacio en pantalla grande */
      }
    }

    @media (max-width: 480px) {
      .contenedor {
        padding: 1rem;
        padding-top: 45vh; /* Espacio justo en celular */
        padding-bottom: 7rem;
      }
      .buscador input {
        font-size: 0.95rem;
        padding: 0.9rem 1rem;
      }
      .boton {
        padding: 1rem 1.25rem;
        font-size: 0.95rem;
      }
      .enlaces-inferiores {
        font-size: 0.75rem;
        gap: 0.85rem;
        bottom: 5rem;
      }
    }
  </style>
</head>
<body>

  <div class="capa-sombra"></div>

  <main class="contenedor">
    <!-- BUSCADOR -->
    <div class="buscador">
      <input type="text" placeholder="Buscar servicios, personas..." />
      <button type="submit">🔍</button>
    </div>

    <!-- BOTONES PRINCIPALES -->
    <div class="botones-principales">
      <a href="ofrecer.html" class="boton boton-primario">Ofrecer mis servicios</a>
      <a href="solicitar.html" class="boton boton-secundario">Solicitar un servicio</a>
      <a href="login.html" class="boton boton-terciario">Iniciar sesión</a>
    </div>
  </main>

  <!-- BOTÓN DESCARGA -->
  <a href="#" class="boton-descarga">Descargar aplicación</a>

  <!-- ENLACES INFERIORES -->
  <nav class="enlaces-inferiores">
    <a href="normas.html">Normas y Seguridad</a>
    <a href="privacidad.html">Privacidad</a>
    <a href="terminos.html">Términos de Servicio</a>
    <a href="cookies.html">Cookies</a>
    <a href="contacto.html">Contacto</a>
  </nav>

</body>
</html>
