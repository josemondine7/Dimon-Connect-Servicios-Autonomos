<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dimon Connect — Servicios Autónomos</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', sans-serif;
        }

        body {
            background: linear-gradient(180deg, #3b82f6 0%, #1e40af 100%);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            color: white;
            padding: 2rem;
            position: relative;
            overflow: hidden;
        }

        /* Mapa de puntos de fondo */
        .mapa-fondo {
            position: absolute;
            width: 100%;
            height: 100%;
            opacity: 0.3;
            background-image: radial-gradient(2px 2px at 20% 30%, #a7f3d0, transparent),
                              radial-gradient(2px 2px at 60% 20%, #a7f3d0, transparent),
                              radial-gradient(2px 2px at 80% 40%, #a7f3d0, transparent),
                              radial-gradient(2px 2px at 30% 60%, #a7f3d0, transparent),
                              radial-gradient(2px 2px at 70% 70%, #a7f3d0, transparent),
                              radial-gradient(2px 2px at 50% 85%, #a7f3d0, transparent),
                              radial-gradient(2px 2px at 85% 80%, #a7f3d0, transparent);
            background-size: 100% 100%;
        }

        .contenedor {
            position: relative;
            z-index: 1;
            text-align: center;
            max-width: 480px;
            width: 100%;
        }

        /* Logo Rombo */
        .logo {
            width: 110px;
            height: 110px;
            margin: 0 auto 0.8rem;
        }

        h1 {
            font-size: 2.4rem;
            margin-bottom: 0.2rem;
            letter-spacing: 0.5px;
        }

        h1 span {
            color: #5eead4;
        }

        .subtitulo {
            font-size: 1.15rem;
            opacity: 0.92;
            margin-bottom: 1.4rem;
        }

        .frase {
            font-size: 1.05rem;
            line-height: 1.6;
            margin-bottom: 2rem;
            opacity: 0.95;
        }

        /* Barra de Búsqueda */
        .barra-busqueda {
            width: 100%;
            padding: 0.85rem 1.2rem;
            border-radius: 50px;
            border: 2px solid rgba(255,255,255,0.55);
            background: rgba(30, 64, 175, 0.4);
            color: white;
            font-size: 1rem;
            margin-bottom: 2rem;
            text-align: center;
            outline: none;
        }

        .barra-busqueda::placeholder {
            color: rgba(255,255,255,0.7);
        }

        /* Fila de los dos botones de arriba */
        .fila-doble {
            display: flex;
            gap: 1.2rem;
            margin-bottom: 1.2rem;
        }

        .boton-medio {
            flex: 1;
            padding: 0.75rem 1rem;
            border-radius: 14px;
            border: 2px solid rgba(255,255,255,0.55);
            background: rgba(30, 64, 175, 0.4);
            color: white;
            font-size: 1rem;
            cursor: pointer;
            transition: 0.2s;
        }

        .boton-medio:hover {
            background: rgba(30, 64, 175, 0.6);
        }

        /* Botón de abajo — MISMA ALTURA */
        .boton-grande {
            width: 100%;
            padding: 0.75rem 1rem;
            border-radius: 14px;
            border: 2px solid rgba(255,255,255,0.55);
            background: rgba(30, 64, 175, 0.4);
            color: white;
            font-size: 1rem;
            cursor: pointer;
            margin-bottom: 2.2rem;
            transition: 0.2s;
        }

        .boton-grande:hover {
            background: rgba(30, 64, 175, 0.6);
        }

        /* Pie de página */
        .pie {
            font-size: 0.9rem;
            opacity: 0.88;
            line-height: 1.7;
        }

        .pie a {
            color: white;
            text-decoration: none;
            margin: 0 0.4rem;
        }

        .pie a:hover {
            text-decoration: underline;
        }

        .descarga {
            display: inline-block;
            margin-top: 0.3rem;
        }
    </style>
</head>
<body>

    <div class="mapa-fondo"></div>
    <div class="contenedor">

        <!-- Logo Rombo Dimon Connect -->
        <svg class="logo" viewBox="0 0 120 120">
            <polygon points="60,6 114,60 60,114 6,60" fill="#0f1740" stroke="#5eead4" stroke-width="2"/>
            <polygon points="60,20 100,60 60,100 20,60" fill="#1e3a8a" stroke="#99f6e4" stroke-width="1.5"/>
            <polygon points="60,34 86,60 60,86 34,60" fill="#3b82f6" stroke="#cbfaf1" stroke-width="1"/>
            <polygon points="60,46 74,60 60,74 46,60" fill="#5eead4"/>
        </svg>

        <h1>Dimon <span>Connect</span></h1>
        <p class="subtitulo">Servicios Autónomos</p>

        <p class="frase">
            El puente entre quien necesita un servicio y quien tiene la solución.<br>
            No hay trabajo ni habilidad pequeña o grande: cualquiera es valioso.
        </p>

        <input type="text" class="barra-busqueda" placeholder="Buscar servicios...">

        <div class="fila-doble">
            <button class="boton-medio" onclick="window.location.href='ofrecer.html'">Oferta de servicios</button>
            <button class="boton-medio" onclick="window.location.href='trabajar.html'">¿Querés trabajar con nosotros?</button>
        </div>

        <button class="boton-grande" onclick="window.location.href='buscar.html'">💬 Solicitud de servicios</button>

        <div class="pie">
            <a href="normas.html">Normas y Seguridad</a> |
            <a href="actualizaciones.html">Actualizaciones</a> |
            <a href="privacidad.html">Política de Privacidad</a>
            <br>
            <a href="descarga.html" class="descarga">⬇️ Descargar la aplicación Dimon Connect</a>
        </div>

    </div>

</body>
</html>
