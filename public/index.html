<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Dimon Connect — Servicios Autónomos</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      margin: 0;
      padding: 0;
      background: #2f74ff;
      min-height: 100vh;
      overflow-x: hidden;
    }
    .container {
      width: 100%;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 0;
    }
    .canva-embed {
      position: relative;
      width: 100%;
      height: 0;
      padding-top: 181.7214%;
      box-shadow: 0 2px 8px 0 rgba(63,69,81,0.16);
      margin: 0;
      overflow: hidden;
      border-radius: 0;
    }
    .canva-embed iframe {
      position: absolute;
      width: 100%;
      height: 100%;
      top: 0;
      left: 0;
      border: none;
      padding: 0;
      margin: 0;
    }
    .footer-link {
      display: none; /* Ocultamos el enlace extra de Canva */
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="canva-embed">
      <iframe loading="lazy" src="https://www.canva.com/design/DAHS8rnEpDE/GqUUO2CP1b7fRF3DGf8OBQ/view?embed" allowfullscreen="allowfullscreen" allow="fullscreen"></iframe>
    </div>
  </div>
</body>
</html>
