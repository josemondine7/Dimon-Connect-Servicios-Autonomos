<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Dimon Connect — Servicios Autónomos</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Segoe UI', sans-serif;
    }

    html, body {
      width: 100%;
      min-height: 100vh;
      overflow-x: hidden;
    }

    /* ===== TU FONDO — SIEMPRE COMPLETO Y ARRIBA ===== */
    body {
      background: url('06f9228d-9ba5-4998-9604-c4432eefaa34_20260825_182353_0000.png') no-repeat center top fixed;
      background-size: cover;
      background-position: center top; /* ROMBO Y NOMBRE SIEMPRE VISIBLES */
      color: #ffffff;
    }

    /* ===== CONTENEDOR — TODO CENTRADO SIN TAPAR LOGO ===== */
    .contenedor {
      position: relative;
      z-index: 1;
      width: 100%;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: 1.5rem;
      padding-top: 38vh; /* ESPACIO SUFICIENTE ARRIBA PARA EL ROMBO */
      padding-bottom: 8rem;
    }

    /* ===== BUSCADOR — TOTALMENTE TRASLÚCIDO ===== */
    .buscador {
      width: 100%;
      max-width: 500px;
      display: flex;
      margin-bottom: 2.5rem;
    }

    .buscador input {
      flex: 1;
      padding: 1rem 1.25rem;
      border: 1px solid rgba(255, 255, 255, 0.35);
      border-radius: 12px 0 0 12px;
      font-size: 1rem;
      color: #ffffff;
      background: rgba(255, 255, 255, 0.12); /* TRASLÚCIDO */
      outline: none;
      backdrop-filter: blur(6px);
    }

    .buscador input::placeholder {
      color: rgba(255, 255, 255, 0.65);
    }

    .buscador button {
      padding: 0 1.5rem;
      border: 1px solid rgba(0, 204, 255, 0.5);
      border-radius: 0 12px 12px 0;
      background: rgba(0, 204, 255, 0.35); /* TRASLÚCIDO */
      color: #ffffff;
      font-size: 1.2rem;
      cursor: pointer;
      transition: all 0.25s ease;
      backdrop-filter: blur(6px);
    }

    .buscador button:hover {
      background: rgba(0, 204, 255, 0.55);
      border-color: rgba(0, 204, 255, 0.8);
    }

    /* ===== BOTONES — TODOS TRASLÚCIDOS CON BORDE ===== */
    .botones-principales {
      width: 100%;
      max-width: 520px;
      display: flex;
      flex-direction: column;
      gap: 1rem;
    }

    .boton {
      padding: 1.15rem 1.5rem;
      border-radius: 12px;
      border: 2px solid rgba(255, 255, 255, 0.4);
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      text-decoration: none;
      text-align: center;
      transition: all 0.25s ease;
      background: rgba(255, 255, 255, 0.1); /* TRASLÚCIDO — SE VE EL FONDO ATRÁS */
      color: #ffffff;
      backdrop-filter: blur(6px);
    }

    .boton:hover {
      background: rgba(255, 255, 255, 0.25);
      border-color: rgba(0, 204, 255, 0.7);
      transform: translateY(-2px);
    }

    .boton-primario {
      border-color: rgba(0, 204, 255, 0.6);
      background: rgba(0, 204, 255, 0.25);
    }

    .boton-primario:hover {
      background: rgba(0, 204, 255, 0.45);
      border-color: rgba(0, 204, 255, 1);
    }

    /* ===== BOTÓN DESCARGA — TRASLÚCIDO NARANJA ===== */
    .boton-descarga {
      position: fixed;
      bottom: 1.5rem;
      left: 1.5rem;
      padding: 0.85rem 1.25rem;
      border-radius: 10px;
      border: 2px solid rgba(255, 153, 0, 0.6);
      background: rgba(255, 153, 0, 0.35); /* TRASLÚCIDO NARANJA */
      color: #ffffff;
      font-size: 0.9rem;
      font-weight: 700;
      cursor: pointer;
      text-decoration: none;
      z-index: 2;
      transition: all 0.2s;
      backdrop-filter: blur(6px);
    }

    .boton-descarga:hover {
      background: rgba(255, 153, 0, 0.55);
      border-color: rgba(255, 153, 0, 0.9);
      transform: translateY(-2px);
    }

    /* ===== ENLACES INFERIORES — TRASLÚCIDOS ===== */
    .enlaces-inferiores {
      position: fixed;
      bottom: 1.5rem;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      flex-wrap: wrap;
      gap: 1.25rem;
      justify-content: center;
      z-index: 2;
      font-size: 0.85rem;
      background: rgba(0, 16, 64, 0.25);
      padding: 0.5rem 1.25rem;
      border-radius: 8px;
      border: 1px solid rgba(255, 255, 255, 0.15);
      backdrop-filter: blur(6px);
    }

    .enlaces-inferiores a {
      color: rgba(176, 224, 255, 0.9);
      text-decoration: none;
      border-bottom: 1px solid transparent;
      transition: all 0.2s;
    }

    .enlaces-inferiores a:hover {
      color: #ffffff;
      border-bottom-color: rgba(0, 204, 255, 0.6);
    }

    /* ===== RESPONSIVE — SE ADAPTA SOLO ===== */
    @media (min-width: 768px) {
      .botones-principales {
        flex-direction: row;
        flex-wrap: wrap;
        justify-content: center;
      }
      .boton {
        flex: 1 1 auto;
        min-width: 160px;
      }
      .contenedor {
        padding-top: 42vh; /* Más espacio en pantalla grande */
      }
    }

    @media (max-width: 480px) {
      .contenedor {
        padding: 1rem;
        padding-top: 32vh;
        padding-bottom: 7rem;
      }
      .buscador input {
        font-size: 0.95rem;
        padding: 0.9rem 1rem;
      }
      .boton {
        padding: 1rem 1.25rem;
        font-size: 0.95rem;
      }
      .enlaces-inferiores {
        font-size: 0.75rem;
        gap: 0.85rem;
        bottom: 5rem;
      }
    }
  </style>
</head>
<body>

  <main class="contenedor">
    <!-- BUSCADOR TRASLÚCIDO -->
    <div class="buscador">
      <input type="text" placeholder="Buscar servicios, personas..." />
      <button type="submit">🔍</button>
    </div>

    <!-- BOTONES TODOS TRASLÚCIDOS -->
    <div class="botones-principales">
      <a href="ofrecer.html" class="boton boton-primario">Ofrecer mis servicios</a>
      <a href="solicitar.html" class="boton">Solicitar un servicio</a>
      <a href="login.html" class="boton">Iniciar sesión</a>
    </div>
  </main>

  <!-- BOTÓN DESCARGA TRASLÚCIDO -->
  <a href="#" class="boton-descarga">Descargar aplicación</a>

  <!-- ENLACES INFERIORES TRASLÚCIDOS -->
  <nav class="enlaces-inferiores">
    <a href="normas.html">Normas y Seguridad</a>
    <a href="privacidad.html">Privacidad</a>
    <a href="terminos.html">Términos de Servicio</a>
    <a href="cookies.html">Cookies</a>
    <a href="contacto.html">Contacto</a>
  </nav>

</body>
</html>
