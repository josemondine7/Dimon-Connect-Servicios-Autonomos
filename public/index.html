<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Dimon Connect — Servicios Autónomos</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
    html, body { 
      width: 100%; 
      height: 100vh; 
      overflow: hidden; 
      position: fixed;
    }
    body {
      background: url('1788448614792.png') no-repeat center center;
      background-size: cover;
      background-attachment: fixed;
      background-color: #0066FF;
      color: #ffffff;
    }
    .selector-idioma { position: fixed; top: 1.5rem; left: 1.5rem; z-index: 25; }
    .selector-idioma select {
      padding: 0.75rem 1.25rem; border-radius: 12px; border: 3px solid #ffd700;
      background: rgba(0,51,102,0.9); color: #fff; font-size: 1rem; cursor: pointer; outline: none;
      backdrop-filter: blur(6px); transition: all 0.2s; min-width: 200px;
    }
    .selector-idioma select:hover { border-color: #fff; box-shadow: 0 0 15px rgba(255,215,0,0.4); }
    .boton-lira {
      position: fixed; top: 1.5rem; right: 1.5rem; width: 56px; height: 56px; border-radius: 12px;
      border: 3px solid #ffd700; background: linear-gradient(135deg, #003366, #0066cc);
      color: #ffd700; font-size: 1.8rem; display: flex; align-items: center; justify-content: center;
      cursor: pointer; z-index: 25; transition: all 0.3s;
    }
    .boton-lira::before { content: "+"; font-weight: bold; }
    .boton-lira:hover { transform: scale(1.08); }
    .modal-contraseña {
      position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.85);
      display: none; align-items: center; justify-content: center; z-index: 100; padding: 1.5rem;
    }
    .modal-contraseña.activo { display: flex; }
    .caja-contraseña {
      background: linear-gradient(135deg, #003366, #0055aa); border: 3px solid #ffd700; border-radius: 16px;
      padding: 2.5rem 2rem; width: 100%; max-width: 400px; text-align: center;
    }
    .caja-contraseña h3 { color: #ffd700; margin-bottom: 1.5rem; }
    .caja-contraseña input {
      width: 100%; padding: 1rem; border-radius: 8px; border: 2px solid #ffd700;
      background: rgba(255,255,255,0.1); color: #fff; font-size: 1rem;
      text-align: center; margin-bottom: 1rem; outline: none;
    }
    .botones-modal { display: flex; gap: 1rem; justify-content: center; margin-top: 0.5rem; }
    .boton-modal { padding: 0.75rem 1.5rem; border-radius: 8px; border: none; font-size: 1rem; font-weight: 600; cursor: pointer; }
    .boton-confirmar { background: #ffd700; color: #000; }
    .boton-cancelar { background: transparent; color: #fff; border: 2px solid rgba(255,255,255,0.4); }
    .error-contraseña { color: #ff6b6b; margin-top: 1rem; display: none; }

    /* ===== BARRA DE BÚSQUEDA → ARRIBA, CENTRADA, MÁS CHICA Y FINA ===== */
    .buscador {
      position: fixed; top: 7rem; left: 50%; transform: translateX(-50%);
      width: 90%; max-width: 280px; height: 44px;
      display: flex; z-index: 20;
      background: rgba(255,255,255,0.15); border-radius: 10px;
      border: 1px solid rgba(255,255,255,0.3);
      overflow: hidden;
    }
    .buscador input {
      flex: 1; padding: 0 1rem; border: none;
      font-size: 0.95rem; color: #fff;
      background: transparent; outline: none;
    }
    .buscador input::placeholder { color: rgba(255,255,255,0.6); }
    .buscador button {
      padding: 0 1rem; border: none;
      background: transparent;
      color: #fff; font-size: 1.1rem; cursor: pointer; transition: all 0.25s;
    }
    .buscador button:hover { background: rgba(255,255,255,0.1); }

    .contenedor {
      position: absolute; top: 0; left: 0; width: 100%; height: 100vh; display: flex;
      flex-direction: column; align-items: center; justify-content: center; padding: 1.5rem;
      padding-top: 38vh; padding-bottom: 9rem;
    }

    /* ===== BOTONES PRINCIPALES → SOLO TEXTO, SIN BORDE NI FONDO ===== */
    .botones-principales {
      width: 100%; max-width: 500px; display: flex; flex-direction: column; gap: 1.5rem; z-index: 10;
      align-items: center;
    }
    .boton {
      padding: 0.5rem 1rem; border: none;
      font-size: 1.3rem; font-weight: 500; cursor: pointer; text-decoration: none;
      text-align: center; transition: all 0.2s ease;
      background: transparent; color: #ffffff; width: auto;
      text-shadow: 0 1px 3px rgba(0,0,0,0.4);
    }
    .boton:hover { color: #ffd700; transform: scale(1.05); }

    /* ===== BOTÓN DESCARGA → MÁS CHICO Y VERDE ===== */
    .boton-descarga {
      position: fixed; bottom: 5rem; left: 2rem; padding: 0.65rem 1.2rem;
      border-radius: 8px; border: 2px solid #00cc44;
      background: rgba(0,204,68,0.25); color: #e6ffe6; font-size: 0.9rem;
      font-weight: 500; text-decoration: none; z-index: 15; transition: all 0.2s;
    }
    .boton-descarga:hover { background: rgba(0,204,68,0.4); color: #fff; }

    .enlaces-inferiores {
      position: fixed; bottom: 1.5rem; left: 50%; transform: translateX(-50%);
      display: flex; flex-direction: row; gap: 1rem; justify-content: center;
      z-index: 15; font-size: 0.85rem; white-space: nowrap;
    }
    .enlaces-inferiores a {
      color: rgba(255,255,255,0.9); text-decoration: none;
      transition: all 0.2s;
    }
    .enlaces-inferiores a:hover { color: #ffd700; text-decoration: underline; }

    @media (max-width: 480px) {
      .buscador { top: 6rem; max-width: 240px; height: 40px; }
      .buscador input { font-size: 0.9rem; padding: 0 0.8rem; }
      .contenedor { padding: 1rem; padding-top: 35vh; padding-bottom: 8rem; }
      .boton { font-size: 1.15rem; }
      .boton-descarga { bottom: 5rem; left: 1.5rem; padding: 0.55rem 1rem; font-size: 0.8rem; }
      .enlaces-inferiores { font-size: 0.7rem; gap: 0.5rem; }
      .boton-lira { top: 1rem; right: 1rem; width: 48px; height: 48px; font-size: 1.5rem; }
      .selector-idioma { top: 1rem; left: 1rem; }
      .selector-idioma select { padding: 0.6rem 1rem; font-size: 0.9rem; min-width: 160px; }
    }
  </style>
</head>

  </div>

  <main class="contenedor">
    <div class="botones-principales">

  function cambiarIdioma(idioma) {
    const t = traducciones[idioma] || traducciones.es;
    document.getElementById('btn-oferta-demanda').textContent = t.ofertaDemanda;
    document.getElementById('btn-solicitar').textContent = t.solicitar;
    document.getElementById('btn-login').textContent = t.iniciarSesion;
    document.getElementById('btn-descargar').textContent = t.descargar;
    document.getElementById('input-buscar').placeholder = t.buscarPlaceholder;
    document.getElementById('link-normas').textContent = t.normas;
    document.getElementById('link-privacidad').textContent = t.privacidad;
    document.getElementById('link-terminos').textContent = t.terminos;
    document.getElementById('link-cookies').textContent = t.cookies;
    document.getElementById('link-contacto').textContent = t.contacto;
    document.getElementById('botonLira').setAttribute('title', t.liralt);
    localStorage.setItem('idiomaDimon', idioma);
    document.documentElement.lang = idioma;
  }

  window.addEventListener('load', () => {
    const idiomaGuardado = localStorage.getItem('idiomaDimon') || 'es';
    document.getElementById('selector-idioma').value = idiomaGuardado;
    cambiarIdioma(idiomaGuardado);
  });

  document.getElementById('selector-idioma').addEventListener('change', (e) => {
    cambiarIdioma(e.target.value);
  });

  // === BOTÓN LIRA + CONTRASEÑA ===
  const botonLira = document.getElementById('botonLira');
  const modalContraseña = document.getElementById('modalContraseña');
  const inputContraseña = document.getElementById('inputContraseña');
  const btnConfirmar = document.getElementById('btnConfirmar');
  const btnCancelar = document.getElementById('btnCancelar');
  const errorContraseña = document.getElementById('errorContraseña');
  const CONTRASEÑA_CORRECTA = 'Mondine5781Lira';

  botonLira.addEventListener('click', () => {
    modalContraseña.classList.add('activo');
    inputContraseña.value = '';
    errorContraseña.style.display = 'none';
    inputContraseña.focus();
  });

  btnCancelar.addEventListener('click', () => {
    modalContraseña.classList.remove('activo');
    inputContraseña.value = '';
    errorContraseña.style.display = 'none';
  });

  btnConfirmar.addEventListener('click', verificarContraseña);
  inputContraseña.addEventListener('keydown', (e) => { if (e.key === 'Enter') verificarContraseña(); });

  function verificarContraseña() {
    if (inputContraseña.value === CONTRASEÑA_CORRECTA) {
      window.location.href = 'acceso-lira.html';
    } else {
      errorContraseña.style.display = 'block';
      inputContraseña.value = '';
      inputContraseña.focus();
    }
  }

  // === BUSCADOR FUNCIONAL ===
  document.getElementById('btn-buscar').addEventListener('click', ejecutarBusqueda);
  document.getElementById('input-buscar').addEventListener('keydown', (e) => { if (e.key === 'Enter') ejecutarBusqueda(); });

  function ejecutarBusqueda() {
    const termino = document.getElementById('input-buscar').value.toLowerCase().trim();
    if (!termino) return;
    
    const rutas = {
      'oferta': 'oferta-demanda.html', 'demanda': 'oferta-demanda.html',
      'solicitar': 'solicitar-servicio.html', 'servicio': 'solicitar-servicio.html',
      'login': 'login.html', 'iniciar': 'login.html', 'inscribirse': 'login.html', 'registro': 'login.html',
      'descargar': 'descarga.html', 'app': 'descarga.html', 'aplicación': 'descarga.html',
      'normas': 'normas-seguridad.html', 'seguridad': 'normas-seguridad.html',
      'privacidad': 'politica-privacidad.html', 'terminos': 'terminos-servicio.html',
      'cookies': 'politica-cookies.html', 'contacto': 'contacto.html',
      'lira': 'acceso-lira.html', 'admin': 'acceso-lira.html', 'administración': 'acceso-lira.html'
    };

    for (const [palabra, ruta] of Object.entries(rutas)) {
      if (termino.includes(palabra)) {
        window.location.href = ruta;
        return;
      }
    }
    
    alert('🔍 Buscando: "' + termino + '" — Redirigiendo a Oferta y Demanda...');
    window.location.href = 'oferta-demanda.html?busqueda=' + encodeURIComponent(termino);
  }
