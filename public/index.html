<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Dimon Connect — Servicios Autónomos</title>

  <!-- Font similar to the screenshot -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">

  <style>
    :root{
      --bg1:#2f74ff;
      --bg2:#2d6cef;
      --bg3:#245ee0;
      --bg4:#214fcd;

      --panel1:#354bb9;
      --panel2:#3044b7;
      --panel3:#2639ad;

      --text-dark:#10205e;
      --cyan:#5cecff;
      --cyan2:#bffcff;
      --white:#ffffff;

      --stroke:rgba(255,255,255,.78);
      --shadow:0 16px 40px rgba(0,0,0,.24);
      --maxw:430px;
    }

    *{ box-sizing:border-box; }

    html, body{
      margin:0;
      min-height:100%;
      background:
        radial-gradient(circle at 50% 8%, rgba(255,255,255,.12), transparent 28%),
        linear-gradient(180deg, var(--bg1) 0%, var(--bg2) 30%, var(--bg3) 70%, var(--bg4) 100%);
      font-family:"Montserrat", system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      -webkit-font-smoothing:antialiased;
      text-rendering:geometricPrecision;
      color:var(--white);
      overflow-x:hidden;
    }

    a{
      color:inherit;
      text-decoration:none;
    }

    .app{
      min-height:100dvh;
      width:100%;
      display:flex;
      justify-content:center;
      align-items:stretch;
      background:
        radial-gradient(circle at 50% 10%, rgba(255,255,255,.10), transparent 32%),
        linear-gradient(180deg, #2f74ff 0%, #2d6cef 30%, #245ee0 72%, #214fcd 100%);
    }

    .screen{
      width:100%;
      max-width:min(100vw, var(--maxw));
      min-height:100dvh;
      position:relative;
      overflow:hidden;
      display:flex;
      flex-direction:column;
      padding:14px 16px 18px;
      background:
        radial-gradient(circle at 50% 6%, rgba(255,255,255,.12), transparent 28%),
        linear-gradient(180deg, #2f74ff 0%, #2d6cef 30%, #245ee0 72%, #214fcd 100%);
    }

    @media (min-width:700px){
      .app{
        align-items:center;
        padding:24px 0;
      }
      .screen{
        min-height:calc(100dvh - 48px);
        border-radius:28px;
        box-shadow:var(--shadow);
      }
    }

    .main{
      flex:1;
      display:flex;
      flex-direction:column;
    }

    /* TOP MAP */
    .world{
      height:305px;
      margin:2px 0 -16px;
      opacity:.96;
      filter:drop-shadow(0 0 8px rgba(118,255,255,.20));
      pointer-events:none;
      user-select:none;
    }

    .world svg{
      width:100%;
      height:100%;
      display:block;
    }

    /* BRAND */
    .brand{
      position:relative;
      z-index:2;
      text-align:center;
      margin-top:-18px;
    }

    .logo{
      width:84px;
      height:84px;
      margin:0 auto 6px;
      display:grid;
      place-items:center;
      filter:drop-shadow(0 8px 18px rgba(0,0,0,.26));
    }

    .brand h1{
      margin:0;
      font-size:clamp(30px, 7.5vw, 36px);
      line-height:1;
      font-weight:800;
      letter-spacing:-.06em;
      color:var(--text-dark);
      text-shadow:0 1px 0 rgba(255,255,255,.08);
    }

    .brand h1 .cyan{
      color:var(--cyan);
    }

    .brand p{
      margin:6px 0 0;
      font-size:clamp(13px, 3.6vw, 16px);
      font-weight:500;
      color:rgba(255,255,255,.92);
      text-shadow:0 1px 0 rgba(0,0,0,.12);
    }

    /* SEARCH */
    .search{
      margin-top:18px;
      height:52px;
      border-radius:999px;
      border:2px solid rgba(255,255,255,.74);
      background:rgba(26,72,196,.28);
      display:flex;
      align-items:center;
      gap:10px;
      padding:0 16px;
      box-shadow:
        0 0 18px rgba(110,249,255,.08),
        inset 0 0 0 1px rgba(255,255,255,.03);
    }

    .search .icon{
      width:18px;
      height:18px;
      border:2px solid #fff;
      border-radius:50%;
      position:relative;
      flex:0 0 auto;
      opacity:.98;
    }

    .search .icon::after{
      content:"";
      position:absolute;
      width:9px;
      height:2px;
      background:#fff;
      border-radius:2px;
      right:-6px;
      bottom:-4px;
      transform:rotate(45deg);
    }

    .search input{
      width:100%;
      border:none;
      outline:none;
      background:transparent;
      color:#fff;
      font-size:clamp(14px, 3.8vw, 16px);
      font-weight:600;
      letter-spacing:-.01em;
      -webkit-appearance:none;
      appearance:none;
    }

    .search input::placeholder{
      color:rgba(255,255,255,.96);
    }

    /* ACTIONS */
    .actions{
      margin-top:14px;
      display:grid;
      gap:10px;
    }

    .cta{
      position:relative;
      display:block;
      width:100%;
      border-radius:22px;
      border:2px solid rgba(255,255,255,.75);
      overflow:hidden;
      text-align:center;
      box-shadow:
        inset 0 0 0 1px rgba(255,255,255,.08),
        0 12px 28px rgba(0,0,0,.18);
      transition:transform .16s ease, filter .16s ease, box-shadow .16s ease;
      -webkit-tap-highlight-color:transparent;
      isolation:isolate;
    }

    .cta:hover{
      transform:translateY(-1px);
      filter:brightness(1.03);
    }

    .cta:active{
      transform:translateY(1px) scale(.996);
      filter:brightness(.98);
    }

    .cta::before{
      content:"";
      position:absolute;
      left:0;
      right:0;
      top:0;
      height:14px;
      background:linear-gradient(180deg, rgba(124,255,255,.98), rgba(124,255,255,.18));
      opacity:.95;
      z-index:0;
      pointer-events:none;
    }

    .cta > *{
      position:relative;
      z-index:1;
    }

    .cta.primary{
      min-height:78px;
      background:linear-gradient(180deg, #354bb9 0%, #293eb0 100%);
    }

    .cta.secondary{
      min-height:52px;
      background:linear-gradient(180deg, #3652ca 0%, #3044b7 100%);
    }

    .cta.demand{
      min-height:88px;
      background:linear-gradient(180deg, #314bc2 0%, #2639ad 100%);
      display:flex;
      align-items:center;
      justify-content:flex-start;
      text-align:left;
      padding:14px 14px 14px 13px;
      gap:12px;
    }

    .cta-content{
      width:100%;
      padding:18px 12px 14px;
    }

    .cta.primary .cta-content{
      padding-top:20px;
    }

    .cta.secondary .cta-content{
      padding-top:12px;
      padding-bottom:12px;
    }

    .cta strong{
      display:block;
      font-size:clamp(16px, 4.3vw, 20px);
      line-height:1.05;
      font-weight:800;
      color:#fff;
      letter-spacing:-.02em;
    }

    .cta.primary strong{
      text-transform:uppercase;
    }

    .cta.secondary strong{
      text-transform:none;
      font-size:clamp(15px, 4vw, 18px);
    }

    .cta span{
      display:block;
      margin-top:7px;
      font-size:clamp(12px, 3.4vw, 15px);
      font-weight:500;
      color:rgba(255,255,255,.95);
    }

    /* MIC ICON */
    .mic-circle{
      flex:0 0 auto;
      width:52px;
      height:52px;
      border-radius:50%;
      position:relative;
      display:grid;
      place-items:center;
      background:
        radial-gradient(circle at 50% 50%, rgba(119,255,255,.80) 0%, rgba(119,255,255,.27) 47%, rgba(255,255,255,.06) 69%, rgba(255,255,255,.03) 100%);
      box-shadow:
        0 0 18px rgba(111,249,255,.42),
        inset 0 0 0 2px rgba(255,255,255,.72);
      filter:drop-shadow(0 0 10px rgba(122,255,255,.18));
    }

    .mic-circle::before{
      content:"";
      position:absolute;
      inset:-1px;
      border-radius:50%;
      border:8px solid rgba(115,246,255,.14);
      filter:blur(1px);
    }

    .mic{
      width:16px;
      height:22px;
      border:2.5px solid #fff;
      border-top-width:3px;
      border-bottom-left-radius:10px;
      border-bottom-right-radius:10px;
      border-top-left-radius:8px;
      border-top-right-radius:8px;
      position:relative;
      background:transparent;
    }

    .mic-stem{
      position:absolute;
      left:50%;
      bottom:-6px;
      transform:translateX(-50%);
      width:2px;
      height:6px;
      background:#fff;
      border-radius:2px;
    }

    .mic-base{
      position:absolute;
      left:50%;
      bottom:-10px;
      transform:translateX(-50%);
      width:14px;
      height:2.5px;
      background:#fff;
      border-radius:999px;
    }

    .cta.demand .cta-content{
      padding:0;
    }

    .cta.demand .title{
      margin:0;
      font-size:clamp(16px, 4.3vw, 20px);
      font-weight:800;
      line-height:1.05;
      color:#fff;
      letter-spacing:-.02em;
    }

    .cta.demand .desc{
      margin-top:7px;
      font-size:clamp(12px, 3.4vw, 15px);
      font-weight:500;
      color:rgba(255,255,255,.95);
    }

    /* FOOTER */
    .footer{
      margin-top:auto;
      padding-top:16px;
      text-align:center;
      z-index:2;
    }

    .footer-links{
      display:flex;
      justify-content:space-between;
      gap:8px;
      align-items:center;
      font-size:10px;
      line-height:1.2;
      color:rgba(255,255,255,.92);
      white-space:nowrap;
    }

    .footer-links a{
      flex:1 1 auto;
      text-align:center;
      opacity:.95;
    }

    .download{
      display:block;
      margin-top:8px;
      font-size:10px;
      color:rgba(255,255,255,.92);
    }

    .brandmark{
      margin-top:6px;
      text-align:right;
      font-size:12px;
      font-weight:700;
      opacity:.98;
      color:#fff;
    }

    .home-indicator{
      margin:10px auto 0;
      width:186px;
      height:3px;
      border-radius:999px;
      background:rgba(255,255,255,.28);
    }

    @media (max-width:360px){
      .screen{
        padding-left:14px;
        padding-right:14px;
      }
      .footer-links{
        font-size:9px;
      }
    }
  </style>
</head>

<body>

        </div>

        <!-- BRAND -->
        <section class="brand" aria-label="Marca Dimon Connect">
          <div class="logo" aria-hidden="true">
            <svg width="84" height="84" viewBox="0 0 84 84" fill="none" xmlns="http://www.w3.org/2000/svg">
              <defs>
                <linearGradient id="outerGrad" x1="14" y1="14" x2="70" y2="70" gradientUnits="userSpaceOnUse">
                  <stop stop-color="#0d1f5f"/>
                  <stop offset="0.45" stop-color="#234ab3"/>
                  <stop offset="1" stop-color="#6af2ff"/>
                </linearGradient>
                <linearGradient id="innerGrad" x1="26" y1="26" x2="58" y2="58" gradientUnits="userSpaceOnUse">
                  <stop stop-color="#101b58"/>
                  <stop offset="0.45" stop-color="#1d7fff"/>
                  <stop offset="1" stop-color="#9af8ff"/>
                </linearGradient>
              </defs>

              <g transform="translate(42 42) rotate(45)">
                <rect x="-24" y="-24" width="48" height="48" rx="8" fill="url(#outerGrad)"/>
                <rect x="-15" y="-15" width="30" height="30" rx="6" fill="url(#innerGrad)"/>
                <path d="M0 -18L18 0L0 18L-18 0Z" fill="#0b1d54" opacity=".35"/>
                <path d="M0 -11L11 0L0 11L-11 0Z" fill="#68f3ff" opacity=".86"/>
              </g>
            </svg>
          </div>

          <h1>Dimon <span class="cyan">Connect</span></h1>
          <p>Servicios Autónomos</p>
        </section>

        <!-- SEARCH -->
        <form class="search" role="search" onsubmit="return false" aria-label="Buscar servicio">
          <span class="icon" aria-hidden="true"></span>
          <input type="text" placeholder="¿Qué servicio necesitas hoy?" aria-label="¿Qué servicio necesitas hoy?" />
        </form>

        <!-- BUTTONS -->
        <section class="actions" aria-label="Acciones principales">
          <a class="cta primary" href="#servicios" aria-label="Necesitás un servicio">
            <div class="cta-content">
              <strong>¿NECESITÁS UN SERVICIO?</strong>
              <span>Encontrá ayuda cerca tuyo</span>
            </div>
          </a>

          <a class="cta secondary" href="#ofrecer" aria-label="Querés ofrecer tus servicios">
            <div class="cta-content">
              <strong>¿Querés ofrecer tus servicios?</strong>

          <a class="cta demand" href="#ofertas-demandas" aria-label="Ofertas y Demandas">

              <svg class="mic" viewBox="0 0 24 32" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
                <rect x="6.25" y="3.5" width="11.5" height="18" rx="5.75" stroke="white" stroke-width="2.5"/>
                <path d="M12 21.5V26.5" stroke="white" stroke-width="2.5" stroke-linecap="round"/>
                <path d="M8 28.5H16" stroke="white" stroke-width="2.5" stroke-linecap="round"/>
              </svg>
            </div>
            <div class="cta-content">
              <div class="title">Ofertas y Demandas</div>
              <div class="desc">Buscá servicios o publicá tu oferta</div>
            </div>
          </a>
        </section>
      </div>

      <!-- FOOTER -->
      <footer class="footer" aria-label="Pie de página">
        <nav class="footer-links" aria-label="Enlaces informativos">
          <a href="#normas">Normas y Seguridad</a>
          <a href="#actualizaciones">Actualizaciones</a>
          <a href="#privacidad">Política de Privacidad</a>
        </nav>
        <a class="download" href="#descargar">Descargar la aplicación Dimon Connect</a>
        <div class="brandmark">Dola AI</div>
        <div class="home-indicator" aria-hidden="true"></div>
      </footer>

      <!-- Hidden anchors for click targets -->
      <section id="servicios" style="height:1px;"></section>
      <section id="ofrecer" style="height:1px;"></section>
      <section id="ofertas-demandas" style="height:1px;"></section>
      <section id="normas" style="height:1px;"></section>
      <section id="actualizaciones" style="height:1px;"></section>
      <section id="privacidad" style="height:1px;"></section>
      <section id="descargar" style="height:1px;"></section>
    </section>
  </main>
</body>
</html>
