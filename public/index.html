<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Dimon Connect — Servicios Autónomos</title>

  <!-- ✅ SISTEMA DE IDIOMA y MONEDAS — RUTAS CORRECTAS -->
  <script src="js/idioma.js"></script>
  <script src="js/monedas.js"></script>

  <!-- ✅ ESTILOS — Todo acá, no falta nada -->
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
    html, body { 
      width: 100%; 
      height: 100vh; 
      overflow: hidden; 
      position: fixed;
    }
    body {
      /* ✅ Imagen de fondo con ruta correcta + color de respaldo */
      background: url('assets/1788448614792.png') no-repeat center center;
      background-size: cover;
      background-attachment: fixed;
      background-color: #1a2a6c;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 20px;
      color: white;
    }

    .top-bar-right {
      position: fixed;
      top: 20px;
      right: 20px;
      z-index: 100;
    }

    .top-bar-left {
      position: fixed;
      top: 20px;
      left: 20px;
      z-index: 100;
    }

    .lang-btn, .lira-btn, .main-btn, .download-btn {
      border-radius: 50px;
      border: none;
      cursor: pointer;
      transition: background 0.2s;
    }

    .lang-btn {
      padding: 10px 24px;
      background: rgba(255,255,255,0.2);
      color: white;
      font-size: 16px;
      font-weight: 500;
    }

    /* ✅ Botón Lira: escudo gris con cruz, arriba a la izquierda */
    .lira-btn {
      width: 46px;
      height: 46px;
      background: #6b7280;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 22px;
      color: white;
      border-radius: 12px;
      clip-path: polygon(15% 0%, 85% 0%, 100% 15%, 100% 85%, 50% 100%, 0% 85%, 0% 15%);
    }

    .lira-btn:hover {
      background: #4b5563;
    }

    .search-bar {
      width: 100%;
      max-width: 500px;
      margin: 60px 0 50px 0;
    }

    .search-bar input {
      width: 100%;
      padding: 16px 24px;
      border-radius: 30px;
      border: none;
      background: rgba(255,255,255,0.15);
      color: white;
      font-size: 16px;
      outline: none;
    }

    .search-bar input::placeholder {
      color: rgba(255,255,255,0.6);
    }

    .buttons-container {
      display: flex;
      flex-direction: column;
      gap: 16px;
      width: 100%;
      max-width: 450px;
    }

    .main-btn {
      padding: 22px;
      background: rgba(255,255,255,0.15);
      color: white;
      font-size: 20px;
    }

    .main-btn:hover {
      background: rgba(255,255,255,0.25);
    }

    /* ✅ Botón Descargar Aplicación */
    .download-btn {
      padding: 16px 22px;
      background: rgba(37, 99, 235, 0.7);
      color: white;
      font-size: 17px;
      margin-top: 10px;
    }

    .download-btn:hover {
      background: rgba(37, 99, 235, 0.9);
    }

    .footer-links {
      position: fixed;
      bottom: 15px;
      left: 0;
      right: 0;
      text-align: center;
      font-size: 12px;
      opacity: 0.75;
    }

    .footer-links a {
      color: white;
      text-decoration: none;
      margin: 0 6px;
    }

    .footer-links a:hover {
      text-decoration: underline;
    }

    #selector-idioma {
      display: none;
    }
  </style>
</head>
<body>

  <!-- ✅ Botón Lira — arriba izquierda -->
  <div class="top-bar-left">
    <button class="lira-btn" onclick="window.location.href='pantallas/lira-chat.html'">✚</button>
  </div>

  <!-- ✅ Botón de idioma — arriba derecha -->
  <div class="top-bar-right">
    <select id="selector-idioma" onchange="cambiarIdioma(this.value)">
      <option value="es">ES</option>
      <option value="en">EN</option>
      <option value="pt">PT</option>
      <option value="zh">中文</option>
      <option value="ar">العربية</option>
    </select>
    <button class="lang-btn" onclick="document.getElementById('selector-idioma').click()">
      <span id="idioma-actual">ES</span>
    </button>
  </div>

  <!-- ✅ Barra de búsqueda -->
  <div class="search-bar">
    <input type="text" data-txt-placeholder="buscarPlaceholder">
  </div>

  <!-- ✅ Botones principales -->
  <div class="buttons-container">
    <button class="main-btn" onclick="window.location.href='pantallas/oferta-demanda.html'" data-txt="ofertaDemanda"></button>
    <button class="main-btn" onclick="window.location.href='pantallas/brindar-servicio.html'" data-txt="brindarServicio"></button>
    <button class="main-btn" onclick="window.location.href='pantallas/solicitar-servicio.html'" data-txt="solicitarServicio"></button>
    
    <!-- ✅ Botón Descargar Aplicación -->
    <button class="download-btn" onclick="window.location.href='pantallas/descarga-app.html'" data-txt="descargarApp"></button>
  </div>

  <!-- ✅ Links legales al pie -->
  <div class="footer-links">
    <a href="pantallas/normas-seguridad.html" data-txt="normas"></a> ·
    <a href="pantallas/privacidad.html" data-txt="privacidad"></a> ·
    <a href="pantallas/terminos-servicio.html" data-txt="terminos"></a> ·
    <a href="pantallas/cookies.html" data-txt="cookies"></a>
  </div>

  <!-- ✅ Actualizar indicador de idioma -->
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const selector = document.getElementById('selector-idioma');
      const indicador = document.getElementById('idioma-actual');
      
      const actualizarIndicadorIdioma = () => {
        const abreviaturas = { es: 'ES', en: 'EN', pt: 'PT', zh: '中文', ar: 'عربي' };
        indicador.textContent = abreviaturas[idiomaActual] || 'ES';
      };
      
      setTimeout(actualizarIndicadorIdioma, 100);
      
      const idiomaOriginal = window.cambiarIdioma;
      window.cambiarIdioma = function(nuevoIdioma) {
        if (idiomaOriginal) idiomaOriginal(nuevoIdioma);
        setTimeout(actualizarIndicadorIdioma, 50);
      };
    });
  </script>

</body>
</html>
