<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Dimon Connect — Servicios Autónomos</title>
  <style>
    :root{
      --bg1:#2d73ff;
      --bg2:#2f6df0;
      --bg3:#245ddf;
      --bg4:#1f51cf;
      --panel:#2d45b8;
      --panel2:#314fca;
      --panel3:#2740b3;
      --cyan:#73f6ff;
      --cyan2:#b5fdff;
      --white:#ffffff;
      --text:#10205e;
      --stroke:rgba(255,255,255,.78);
      --soft:rgba(255,255,255,.14);
      --shadow:0 16px 40px rgba(0,0,0,.24);
      --radius:28px;
      --maxw:420px;
    }

    *{ box-sizing:border-box; }
    html,body{
      margin:0;
      min-height:100%;
      background: linear-gradient(180deg, var(--bg1) 0%, var(--bg2) 30%, var(--bg3) 68%, var(--bg4) 100%);
      font-family: Inter, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
      color:var(--white);
      -webkit-font-smoothing: antialiased;
      text-rendering: geometricPrecision;
    }

    body{
      min-height:100vh;
    }

    a{
      color:inherit;
      text-decoration:none;
    }

    .app{
      min-height:100vh;
      width:100%;
      display:flex;
      justify-content:center;
      align-items:stretch;
      overflow-x:hidden;
      background:
        radial-gradient(circle at 50% 10%, rgba(255,255,255,.12), transparent 32%),
        linear-gradient(180deg, #2f73ff 0%, #2d68ee 28%, #2358d8 72%, #1f4ecd 100%);
    }

    .screen{
      width:100%;
      max-width: min(100vw, var(--maxw));
      min-height:100vh;
      position:relative;
      padding: 14px 16px 18px;
      overflow:hidden;
      background:
        radial-gradient(circle at 50% 8%, rgba(255,255,255,.10), transparent 28%),
        linear-gradient(180deg, #2f74ff 0%, #2d6cef 30%, #245ee0 72%, #214fcd 100%);
    }

    @media (min-width: 700px){
      .app{
        align-items:center;
        padding: 24px 0;
      }
      .screen{
        min-height: calc(100vh - 48px);
        border-radius: 28px;
        box-shadow: var(--shadow);
      }
    }

    .world{
      position:relative;
      height: 300px;
      margin-top: 2px;
      margin-bottom: -18px;
      filter: drop-shadow(0 0 8px rgba(118, 255, 255, .22));
    }

    .world svg{
      width:100%;
      height:100%;
      display:block;
      opacity:.96;
    }

    .brand{
      position:relative;
      z-index:3;
      text-align:center;
      margin-top:-20px;
      margin-bottom: 8px;
    }

    .logo{
      width: 82px;
      height: 82px;
      margin: 0 auto 8px;
      position:relative;
      filter: drop-shadow(0 8px 18px rgba(0,0,0,.26));
    }

    .diamond{
      position:absolute;
      inset:0;
      margin:auto;
      width: 62px;
      height: 62px;
      transform: rotate(45deg);
      border-radius: 10px;
      background: linear-gradient(135deg, #101f63 0%, #2148b0 42%, #6af0ff 100%);
      box-shadow: inset 0 0 0 2px rgba(255,255,255,.1);
    }

    .diamond::before{
      content:"";
      position:absolute;
      inset:11px;
      border-radius: 8px;
      background: linear-gradient(135deg, #111d56 0%, #1d7fff 48%, #9af8ff 100%);
      transform: rotate(0deg);
    }

    .diamond::after{
      content:"";
      position:absolute;
      inset: 24px;
      background: #0e225d;
      clip-path: polygon(50% 0%, 100% 50%, 50% 100%, 0% 50%);
      box-shadow: 0 0 0 1px rgba(255,255,255,.08);
    }

    .brand h1{
      margin:0;
      font-size: clamp(28px, 7.5vw, 36px);
      line-height:1;
      font-weight: 800;
      letter-spacing: -0.06em;
      color: var(--text);
      text-shadow: 0 1px 0 rgba(255,255,255,.15);
    }
    .brand h1 .cyan{
      color:#5ef0ff;
    }

    .brand p{
      margin: 6px 0 0;
      font-size: clamp(13px, 3.6vw, 16px);
      font-weight: 500;
      color: rgba(255,255,255,.92);
      text-shadow: 0 1px 0 rgba(0,0,0,.12);
    }

    .search{
      margin-top: 18px;
      height: 52px;
      border-radius: 999px;
      border: 2px solid rgba(255,255,255,.75);
      background: rgba(26,72,196,.28);
      display:flex;
      align-items:center;
      gap: 10px;
      padding: 0 16px;
      box-shadow:
        0 0 18px rgba(110, 249, 255, .08),
        inset 0 0 0 1px rgba(255,255,255,.04);
    }

    .search .icon{
      width: 18px;
      height: 18px;
      border: 2px solid #fff;
      border-radius: 50%;
      position:relative;
      flex:0 0 auto;
      opacity:.97;
    }
    .search .icon::after{
      content:"";
      position:absolute;
      width: 9px;
      height: 2px;
      background:#fff;
      border-radius:2px;
      right:-6px;
      bottom:-4px;
      transform: rotate(45deg);
      transform-origin:center;
    }

    .search input{
      width:100%;
      border:none;
      outline:none;
      background:transparent;
      color:#fff;
      font-size: clamp(14px, 3.8vw, 16px);
      font-weight:600;
      letter-spacing: -.01em;
    }
    .search input::placeholder{
      color: rgba(255,255,255,.96);
    }

    .actions{
      margin-top: 14px;
      display:grid;
      gap: 10px;
    }

    .cta{
      position:relative;
      display:block;
      width:100%;
      border-radius: 22px;
      border: 2px solid rgba(255,255,255,.75);
      overflow:hidden;
      text-align:center;
      box-shadow:
        inset 0 0 0 1px rgba(255,255,255,.08),
        0 12px 28px rgba(0,0,0,.18);
      transition: transform .16s ease, filter .16s ease, box-shadow .16s ease;
      user-select:none;
      -webkit-tap-highlight-color: transparent;
    }

    .cta:hover{
      transform: translateY(-1px);
      filter: brightness(1.03);
    }

    .cta:active{
      transform: translateY(1px) scale(.995);
      filter: brightness(.98);
    }

    .cta::before{
      content:"";
      position:absolute;
      left:0;
      right:0;
      top:0;
      height: 14px;
      background: linear-gradient(180deg, rgba(125,255,255,.98), rgba(125,255,255,.15));
      opacity:.95;
      filter: blur(.2px);
    }

    .cta.primary{
      min-height: 78px;
      background: linear-gradient(180deg, #354bb9 0%, #293eb0 100%);
    }

    .cta.secondary{
      min-height: 52px;
      background: linear-gradient(180deg, #3652ca 0%, #3044b7 100%);
    }

    .cta.demand{
      min-height: 88px;
      background: linear-gradient(180deg, #314bc2 0%, #2639ad 100%);
      display:flex;
      align-items:center;
      justify-content:flex-start;
      text-align:left;
      padding: 14px 14px 14px 13px;
      gap: 12px;
    }

    .cta-content{
      position:relative;
      z-index:1;
      width:100%;
      padding: 18px 12px 14px;
    }

    .cta.primary .cta-content{
      padding-top: 20px;
    }

    .cta.secondary .cta-content{
      padding-top: 12px;
      padding-bottom: 12px;
    }

    .cta strong{
      display:block;
      font-size: clamp(16px, 4.3vw, 20px);
      line-height: 1.05;
      font-weight: 800;
      color: #fff;
      letter-spacing: -0.02em;
      text-transform: uppercase;
    }

    .cta.secondary strong{
      font-size: clamp(15px, 4vw, 18px);
      text-transform:none;
    }

    .cta span{
      display:block;
      margin-top: 7px;
      font-size: clamp(12px, 3.4vw, 15px);
      font-weight:500;
      color: rgba(255,255,255,.95);
    }

    .mic-circle{
      flex:0 0 auto;
      width: 52px;
      height: 52px;
      border-radius: 50%;
      position:relative;
      display:grid;
      place-items:center;
      background:
        radial-gradient(circle at 50% 50%, rgba(119,255,255,.8) 0%, rgba(119,255,255,.26) 47%, rgba(255,255,255,.05) 68%, rgba(255,255,255,.03) 100%);
      box-shadow:
        0 0 18px rgba(111,249,255,.42),
        inset 0 0 0 2px rgba(255,255,255,.72);
      z-index:1;
    }
    .mic-circle::before{
      content:"";
      position:absolute;
      inset: -1px;
      border-radius:50%;
      border: 8px solid rgba(115,246,255,.15);
      filter: blur(1px);
    }
    .mic{
      position:relative;
      width: 16px;
      height: 22px;
      border: 2.5px solid #fff;
      border-top-width: 3px;
      border-bottom-left-radius: 10px;
      border-bottom-right-radius: 10px;
      border-top-left-radius: 8px;
      border-top-right-radius: 8px;
      background: transparent;
    }
    .mic::before{
      content:"";
      position:absolute;
      left:50%;
      top:-7px;
      transform:translateX(-50%);
      width: 9px;
      height: 14px;
      border: 2.5px solid #fff;
      border-bottom:none;
      border-top-left-radius: 999px;
      border-top-right-radius: 999px;
      clip-path: inset(0 0 50% 0);
      display:none;
    }
    .mic-stem{
      position:absolute;
      left:50%;
      bottom:-6px;
      transform:translateX(-50%);
      width: 2px;
      height: 6px;
      background:#fff;
      border-radius: 2px;
    }
    .mic-base{
      position:absolute;
      left:50%;
      bottom:-10px;
      transform:translateX(-50%);
      width: 14px;
      height: 2.5px;
      background:#fff;
      border-radius:999px;
    }

    .cta.demand .cta-content{
      padding:0;
    }
    .cta.demand .title{
      font-size: clamp(16px, 4.3vw, 20px);
      font-weight: 800;
      line-height: 1.05;
      color:#fff;
      margin: 0;
      letter-spacing:-.02em;
    }
    .cta.demand .desc{
      margin-top: 7px;
      font-size: clamp(12px, 3.4vw, 15px);
      font-weight:500;
      color: rgba(255,255,255,.95);
    }

    .footer{
      margin-top: 16px;
      text-align:center;
      padding-bottom: 2px;
      position:relative;
      z-index:2;
    }

    .footer-links{
      display:flex;
      justify-content:space-between;
      gap: 8px;
      align-items:center;
      font-size: 10px;
      line-height: 1.2;
      color: rgba(255,255,255,.92);
      white-space:nowrap;
    }

    .footer-links a{
      flex:1 1 auto;
      text-align:center;
      opacity:.95;
    }

    .download{
      display:block;
      margin-top: 8px;
      font-size: 10px;
      color: rgba(255,255,255,.92);
    }

    .brandmark{
      margin-top: 6px;
      text-align:right;
      font-size: 12px;
      font-weight: 700;
      opacity:.98;
      color:#fff;
    }

    .home-indicator{
      margin: 10px auto 0;
      width: 186px;
      height: 3px;
      border-radius:999px;
      background: rgba(255,255,255,.28);
    }

    .section-target{
      scroll-margin-top: 20px;
      padding: 22px 16px;
      max-width: 900px;
      margin: 0 auto;
      color:#fff;
    }

    .section-target h2{
      margin: 0 0 8px;
      font-size: 22px;
      font-weight: 800;
    }
    .section-target p{
      margin: 0;
      opacity:.92;
      line-height:1.5;
    }

    .viewport-fit{
      min-height: 100dvh;
      display:flex;
      flex-direction:column;
    }

    .grow{
      flex:1 1 auto;
    }

    @media (min-width: 430px){
      .world{ height: 320px; }
      .cta.demand{ min-height: 92px; }
    }

    @media (min-width: 700px){
      :root{ --maxw: 430px; }
      .screen{
        padding: 16px 18px 18px;
      }
    }

    @media (min-width: 900px){
      .app{
        padding: 0 18px;
      }
      .screen{
        width: min(100%, 450px);
      }
    }

    @media (max-width: 360px){
      .footer-links{
        font-size: 9px;
      }
    }
  </style>
</head>

            <g filter="url(#dotGlow)" fill="#b8fbff" opacity="0.95">

          </svg>
        </div>

        <section class="brand" aria-label="Marca">
          <div class="logo" aria-hidden="true">
            <div class="diamond"></div>
          </div>
          <h1>Dimon <span class="cyan">Connect</span></h1>
          <p>Servicios Autónomos</p>
        </section>

        <form class="search" onsubmit="return false" role="search" aria-label="Buscar servicio">
          <span class="icon" aria-hidden="true"></span>
          <input type="text" placeholder="¿Qué servicio necesitas hoy?" aria-label="¿Qué servicio necesitas hoy?" />
        </form>

        <section class="actions" aria-label="Acciones principales">
          <a class="cta primary" href="#servicios" aria-label="Necesitás un servicio">
            <div class="cta-content">
              <strong>¿NECESITÁS UN SERVICIO?</strong>
              <span>Encontrá ayuda cerca tuyo</span>
            </div>
          </a>

          <a class="cta secondary" href="#ofrecer" aria-label="Querés ofrecer tus servicios">
            <div class="cta-content">
              <strong>¿Querés ofrecer tus servicios?</strong>
            </div>
          </a>

          <a class="cta demand" href="#ofertas-demandas" aria-label="Ofertas y Demandas">
            <div class="mic-circle" aria-hidden="true">
              <div class="mic">
                <div class="mic-stem"></div>
                <div class="mic-base"></div>
              </div>
            </div>
            <div class="cta-content">
              <div class="title">Ofertas y Demandas</div>
              <div class="desc">Buscá servicios o publicá tu oferta</div>
            </div>
          </a>
        </section>

        <footer class="footer" aria-label="Pie de página">
          <nav class="footer-links" aria-label="Enlaces de información">
            <a href="#normas">Normas y Seguridad</a>
            <a href="#actualizaciones">Actualizaciones</a>
            <a href="#privacidad">Política de Privacidad</a>
          </nav>
          <a class="download" href="#descargar">Descargar la aplicación Dimon Connect</a>
          <div class="brandmark">Dola AI</div>
          <div class="home-indicator" aria-hidden="true"></div>
        </footer>
      </div>

      <section id="servicios" class="section-target" style="display:none;"></section>
      <section id="ofrecer" class="section-target" style="display:none;"></section>
      <section id="ofertas-demandas" class="section-target" style="display:none;"></section>
      <section id="normas" class="section-target" style="display:none;"></section>
      <section id="actualizaciones" class="section-target" style="display:none;"></section>
      <section id="privacidad" class="section-target" style="display:none;"></section>
      <section id="descargar" class="section-target" style="display:none;"></section>
    </main>
  </div>

  <script>
    document.querySelectorAll('a[href^="#"]').forEach(link => {
      link.addEventListener('click', (e) => {
        const target = document.querySelector(link.getAttribute('href'));
        if (target) {
          e.preventDefault();
          target.scrollIntoView({ behavior: 'smooth', block: 'start' });
        }
      });
    });
  </script>
</body>
</html>
