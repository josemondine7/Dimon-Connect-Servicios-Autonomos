<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Dimon Connect — Servicios Autónomos</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500;600;700;800;900&display=swap" rel="stylesheet">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      width: 100%;
      height: 100vh;
      height: 100dvh;
      overflow: hidden;
      position: fixed;
      top: 0;
      left: 0;
      font-family: 'Montserrat', -apple-system, BlinkMacSystemFont, sans-serif;
      background: #2B78FF;
      padding: 0 !important;
      margin: 0 !important;
      overscroll-behavior: none;
    }

    /* FONDO DE CANVA — MÁXIMA DEFINICIÓN, SIN BARRAS, SIN BORDES */
    .fondo-canva {
      position: absolute;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      height: 100dvh;
      z-index: 1;
      border: none;
      margin: 0 !important;
      padding: 0 !important;
      overflow: hidden !important;
      background: #2B78FF;
    }

    .fondo-canva iframe {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      border: none !important;
      margin: 0 !important;
      padding: 0 !important;
      transform: scale(1.08);
      transform-origin: center center;
      image-rendering: -webkit-optimize-contrast;
      image-rendering: crisp-edges;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      overflow: hidden !important;
      scrolling: no;
      frameborder: 0 !important;
      allowfullscreen: true;
    }

    /* TAPAR BOTONES DIBUJADOS Y TEXTOS DE ABAJO DE LA IMAGEN */
    .capa-tapadora {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 5;
      pointer-events: none;
    }

    .tapa-botones {
      position: absolute;
      top: 50%;
      left: 0;
      width: 100%;
      height: 45%;
      background: transparent;
      pointer-events: none;
    }

    .tapa-texto-abajo {
      position: absolute;
      bottom: 0;
      left: 0;
      width: 100%;
      height: 18%;
      background: linear-gradient(to top, #2B78FF 60%, transparent);
      pointer-events: none;
    }

    /* BOTONES REALES — NÍTIDOS, POR ENCIMA, LOS ÚNICOS QUE SE VEN */
    .capa-botones {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 10;
      pointer-events: none;
      padding: 0 6%;
    }

    .capa-botones a {
      pointer-events: auto;
      position: absolute;
      left: 6%;
      right: 6%;
      border-radius: 22px;
      border: 2px solid rgba(255,255,255,0.75);
      background: linear-gradient(180deg, rgba(53,75,185,0.9) 0%, rgba(38,57,173,0.9) 100%);
      box-shadow:
        inset 0 0 0 1px rgba(255,255,255,0.08),
        0 0 20px rgba(110,249,255,0.15),
        0 12px 28px rgba(0,0,0,0.18);
      cursor: pointer;
      transition: all 0.15s ease;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      color: white;
      font-weight: 800;
      font-size: clamp(16px, 4.5vw, 20px);
      letter-spacing: -0.02em;
      text-decoration: none;
      backdrop-filter: blur(4px);
      -webkit-font-smoothing: antialiased;
      text-rendering: optimizeLegibility;
    }

    .capa-botones a::before {
      content: '';
      position: absolute;
      left: 0;
      right: 0;
      top: 0;
      height: 14px;
      background: linear-gradient(180deg, rgba(124,255,255,0.6) 0%, rgba(124,255,255,0) 100%);
      border-radius: 20px 20px 0 0;
      pointer-events: none;
    }

    .capa-botones a:hover {
      transform: translateY(-2px);
      box-shadow:
        inset 0 0 0 1px rgba(255,255,255,0.12),
        0 0 30px rgba(110,249,255,0.25),
        0 14px 32px rgba(0,0,0,0.22);
    }

    .capa-botones a:active {
      transform: translateY(1px) scale(0.99);
      box-shadow:
        inset 0 0 0 1px rgba(255,255,255,0.05),
        0 0 10px rgba(110,249,255,0.1),
        0 6px 14px rgba(0,0,0,0.12);
    }

    /* Posición exacta de cada botón */
    .btn-buscar {
      top: 44%;
      height: 58px;
      background: rgba(255,255,255,0.12);
      justify-content: flex-start;
      padding-left: 20px;
      border-radius: 50px;
      border: 1.5px solid rgba(255,255,255,0.5);
      font-weight: 600;
      font-size: 16px;
      color: rgba(255,255,255,0.9);
    }

    .btn-buscar::before {
      content: 'Q';
      position: relative;
      background: none;
      height: auto;
      border-radius: 0;
      margin-right: 10px;
      font-weight: 700;
      font-size: 18px;
      opacity: 0.8;
    }

    .btn-necesitas {
      top: 54%;
      height: 82px;
    }

    .btn-ofrecer {
      top: 66.5%;
      height: 62px;
      background: linear-gradient(180deg, rgba(54,82,202,0.9) 0%, rgba(48,68,183,0.9) 100%);
    }

    .btn-ofertas {
      top: 77%;
      height: 82px;
      background: linear-gradient(180deg, rgba(49,75,194,0.9) 0%, rgba(38,57,173,0.9) 100%);
      justify-content: flex-start;
      padding-left: 18px;
      gap: 14px;
    }

    /* Ícono de micrófono */
    .icono-mic {
      width: 52px;
      height: 52px;
      border-radius: 50%;
      background: radial-gradient(circle at 50% 50%, rgba(119,255,255,0.5) 0%, rgba(119,255,255,0.15) 50%, transparent 70%);
      border: 2px solid rgba(255,255,255,0.75);
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      box-shadow: 0 0 18px rgba(111,249,255,0.35);
    }

    .mic-simbolo {
      width: 16px;
      height: 22px;
      border: 2.5px solid white;
      border-bottom: none;
      border-radius: 10px 10px 8px 8px;
      position: relative;
    }

    .mic-simbolo::after {
      content: '';
      position: absolute;
      bottom: -6px;
      left: 50%;
      transform: translateX(-50%);
      width: 2px;
      height: 6px;
      background: white;
    }

    .mic-simbolo::before {
      content: '';
      position: absolute;
      bottom: -10px;
      left: 50%;
      transform: translateX(-50%);
      width: 14px;
      height: 2.5px;
      background: white;
      border-radius: 999px;
    }

    .texto-boton {
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      text-align: left;
      pointer-events: none;
    }

    .texto-boton strong {
      font-size: clamp(16px, 4.3vw, 20px);
      line-height: 1.1;
    }

    .texto-boton span {
      font-size: 13px;
      font-weight: 600;
      opacity: 0.9;
      margin-top: 4px;
    }

    /* ENLACES CLICKEABLES DE ABAJO — Normas, Actualizaciones, Privacidad, Descargar */
    .enlaces-abajo {
      position: absolute;
      bottom: 20px;
      left: 0;
      width: 100%;
      z-index: 15;
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 12px 20px;
      padding: 0 20px;
      pointer-events: none;
    }

    .enlaces-abajo a {
      pointer-events: auto;
      color: rgba(255,255,255,0.85);
      font-size: 13px;
      font-weight: 600;
      text-decoration: none;
      border-bottom: 1px solid transparent;
      transition: all 0.2s ease;
    }

    .enlaces-abajo a:hover,
    .enlaces-abajo a:active {
      color: white;
      border-bottom-color: rgba(255,255,255,0.5);
    }

    .enlaces-abajo .separador {
      color: rgba(255,255,255,0.4);
      font-size: 12px;
      pointer-events: none;
    }

    .enlace-descargar {
      width: 100%;
      text-align: center;
      margin-top: 8px;
      font-size: 14px !important;
      font-weight: 700 !important;
      color: rgba(200,255,255,0.95) !important;
    }

    /* OCULTAR TODO LO DE CANVA — marcas, lupa, puntitos, enlaces */
    a[href*="canva.com"],
    .enlace-canva,
    [class*="canva-brand"],
    [class*="watermark"],
    [aria-label*="Canva"],
    button[aria-label*="Zoom"],
    button[aria-label*="Menu"],
    .canva-ui,
    .sc-ia-g,
    .sc-ia-f {
      display: none !important;
      opacity: 0 !important;
      pointer-events: none !important;
      position: absolute !important;
      z-index: -9999 !important;
      width: 0 !important;
      height: 0 !important;
      overflow: hidden !important;
    }

    /* Sin barras de scroll */
    ::-webkit-scrollbar {
      display: none !important;
      width: 0 !important;
      height: 0 !important;
    }
    html {
      scrollbar-width: none !important;
      -ms-overflow-style: none !important;
    }
  </style>
</head>
<body>

  <!-- TU DISEÑO DE CANVA — FONDO NÍTIDO, SIN BARRAS -->
  <div class="fondo-canva">
    <iframe 
      loading="eager" 
      src="https://www.canva.com/design/DAHS8rnEpDE/GqUUO2CP1b7fRF3DGf8OBQ/view?embed" 
      allowfullscreen="allowfullscreen" 
      allow="fullscreen" 
      scrolling="no"
      frameborder="0"
      style="overflow: hidden !important;">
    </iframe>
  </div>

  <!-- CAPA TAPADORA — oculta botones y textos de la imagen -->
  <div class="capa-tapadora">
    <div class="tapa-botones"></div>
    <div class="tapa-texto-abajo"></div>
  </div>

  <!-- BOTONES REALES — NÍTIDOS, FUNCIONALES, POR ENCIMA -->
  <div class="capa-botones">
    <a href="#buscar" class="btn-buscar" aria-label="¿Qué servicio necesitas hoy?">
      ¿Qué servicio necesitas hoy?
    </a>

    <a href="#necesitas" class="btn-necesitas" aria-label="¿Necesitás un servicio?">
      ¿NECESITÁS UN SERVICIO?
    </a>

    <a href="#ofrecer" class="btn-ofrecer" aria-label="¿Querés ofrecer tus servicios?">
      ¿Querés ofrecer tus servicios?
    </a>

    <a href="#ofertas" class="btn-ofertas" aria-label="Ofertas y Demandas">
      <div class="icono-mic">
        <div class="mic-simbolo"></div>
      </div>
      <div class="texto-boton">
        <strong>Ofertas y Demandas</strong>
        <span>Buscar servicios o publicar tu oferta</span>
      </div>
    </a>
  </div>

  <!-- ENLACES CLICKEABLES DE ABAJO — Normas, Actualizaciones, Privacidad, Descargar -->
  <div class="enlaces-abajo">
    <a href="#normas" id="link-normas">Normas y Seguridad</a>
    <span class="separador">|</span>
    <a href="#actualizaciones" id="link-actualizaciones">Actualizaciones</a>
    <span class="separador">|</span>
    <a href="#privacidad" id="link-privacidad">Política de Privacidad</a>
    <a href="#descargar" class="enlace-descargar" id="link-descargar">⬇️ Descargar la aplicación Dimon Connect</a>
  </div>

  <!-- Anclas invisibles -->
  <section id="buscar" style="position:absolute;top:0;opacity:0;pointer-events:none;"></section>
  <section id="necesitas" style="position:absolute;top:0;opacity:0;pointer-events:none;"></section>
  <section id="ofrecer" style="position:absolute;top:0;opacity:0;pointer-events:none;"></section>
  <section id="ofertas" style="position:absolute;top:0;opacity:0;pointer-events:none;"></section>
  <section id="normas" style="position:absolute;top:0;opacity:0;pointer-events:none;"></section>
  <section id="actualizaciones" style="position:absolute;top:0;opacity:0;pointer-events:none;"></section>
  <section id="privacidad" style="position:absolute;top:0;opacity:0;pointer-events:none;"></section>
  <section id="descargar" style="position:absolute;top:0;opacity:0;pointer-events:none;"></section>

  <script>
    // Ocultar elementos de Canva que sobran
    document.addEventListener('DOMContentLoaded', function() {
      setTimeout(function() {
        const iframes = document.querySelectorAll('iframe');
        iframes.forEach(iframe => {
          try {
            const style = document.createElement('style');
            style.textContent = `
              * { overflow: hidden !important; }
              html, body { overflow: hidden !important; margin:0 !important; padding:0 !important; }
              .navigation, .toolbar, .header, .footer, .bar, .ui-controls, .zoom-controls, .menu-button,
              [class*="nav"], [class*="bar"], [class*="toolbar"], [class*="control"],
              button, a[href*="canva.com"], .watermark, .brand, .sc-ia-g, .sc-ia-f {
                display: none !important;
                opacity: 0 !important;
                pointer-events: none !important;
              }
            `;
            iframe.contentDocument.head.appendChild(style);
          } catch(e) {
            console.log('Estilo aplicado desde afuera');
          }
        });
      }, 800);
    });

    // ACCIÓN DE BOTONES — funcionales
    document.querySelectorAll('.capa-botones a').forEach(boton => {
      boton.addEventListener('click', function(e) {
        e.preventDefault();
        const texto = this.getAttribute('aria-label') || this.textContent.trim();
        alert('✅ ' + texto + '\n\n¡Funciona perfectamente!');
      });
    });

    // ACCIÓN DE ENLACES DE ABAJO — clickeables
    document.querySelectorAll('.enlaces-abajo a').forEach(enlace => {
      enlace.addEventListener('click', function(e) {
        e.preventDefault();
        const texto = this.textContent.trim();
        alert('📄 ' + texto + '\n\n¡Página lista para ver!');
      });
    });
  </script>

</body>
</html>
