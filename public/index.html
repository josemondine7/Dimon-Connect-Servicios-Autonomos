<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Dimon Connect — Servicios Autónomos</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Segoe UI', sans-serif;
    }

    html, body {
      width: 100%;
      height: 100vh;
      overflow: hidden;
    }

    /* ===== TU IMAGEN DE FONDO — COMPLETA, ARRIBA, SIN CORTAR ===== */
    body {
      background: url('06f9228d-9ba5-4998-9604-c4432eefaa34_20260825_182353_0000.png') no-repeat center top fixed;
      background-size: cover;
      background-position: center top;
      color: #ffffff;
    }

    /* ===== CONTENEDOR — TODO CENTRADO SIN TAPAR EL LOGO ===== */
    .contenedor {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      padding: 1.5rem;
      padding-top: 48vh; /* Espacio arriba → NO tapa rombo ni nombre */
      padding-bottom: 8rem;
    }

    /* ===== BUSCADOR — TRASLÚCIDO, CENTRADO ===== */
    .buscador {
      width: 100%;
      max-width: 500px;
      display: flex;
      margin-bottom: 2rem;
    }

    .buscador input {
      flex: 1;
      padding: 1rem 1.25rem;
      border: 1px solid rgba(255, 255, 255, 0.35);
      border-radius: 12px 0 0 12px;
      font-size: 1rem;
      color: #ffffff;
      background: rgba(255, 255, 255, 0.15);
      backdrop-filter: blur(6px);
      outline: none;
    }

    .buscador input::placeholder {
      color: rgba(255, 255, 255, 0.65);
    }

    .buscador button {
      padding: 0 1.5rem;
      border: 1px solid rgba(0, 204, 255, 0.5);
      border-radius: 0 12px 12px 0;
      background: rgba(0, 204, 255, 0.35);
      color: #ffffff;
      font-size: 1.2rem;
      cursor: pointer;
      backdrop-filter: blur(6px);
      transition: all 0.25s;
    }

    .buscador button:hover {
      background: rgba(0, 204, 255, 0.55);
    }

    /* ===== BOTONES PRINCIPALES — TRASLÚCIDOS, ORDENADOS ===== */
    .botones-principales {
      width: 100%;
      max-width: 500px;
      display: flex;
      flex-direction: column;
      gap: 1rem;
    }

    .boton {
      padding: 1.15rem 1.5rem;
      border-radius: 12px;
      border: 2px solid rgba(255, 255, 255, 0.4);
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      text-decoration: none;
      text-align: center;
      transition: all 0.25s ease;
      background: rgba(255, 255, 255, 0.1);
      color: #ffffff;
      backdrop-filter: blur(6px);
      width: 100%;
    }

    .boton:hover {
      background: rgba(255, 255, 255, 0.25);
      border-color: rgba(0, 204, 255, 0.7);
      transform: translateY(-2px);
    }

    .boton-primario {
      border-color: rgba(0, 204, 255, 0.6);
      background: rgba(0, 204, 255, 0.25);
    }

    .boton-primario:hover {
      background: rgba(0, 204, 255, 0.45);
      border-color: rgba(0, 204, 255, 1);
    }

    /* ===== BOTÓN DESCARGA — ESQUINA IZQUIERDA ABAJO ===== */
    .boton-descarga {
      position: fixed;
      bottom: 1.5rem;
      left: 1.5rem;
      padding: 0.85rem 1.25rem;
      border-radius: 10px;
      border: 2px solid rgba(255, 153, 0, 0.6);
      background: rgba(255, 153, 0, 0.35);
      color: #ffffff;
      font-size: 0.9rem;
      font-weight: 700;
      cursor: pointer;
      text-decoration: none;
      z-index: 10;
      backdrop-filter: blur(6px);
      transition: all 0.2s;
    }

    .boton-descarga:hover {
      background: rgba(255, 153, 0, 0.55);
      border-color: rgba(255, 153, 0, 0.9);
    }

    /* ===== ENLACES INFERIORES — UNA LÍNEA, CENTRADOS, SIN FONDO ===== */
    .enlaces-inferiores {
      position: fixed;
      bottom: 1.5rem;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      flex-direction: row;
      flex-wrap: nowrap;
      gap: 1rem;
      justify-content: center;
      z-index: 10;
      font-size: 0.8rem;
      white-space: nowrap;
      background: transparent;
      border: none;
      padding: 0;
    }

    .enlaces-inferiores a {
      color: rgba(176, 224, 255, 0.9);
      text-decoration: none;
      border-bottom: 1px solid transparent;
      transition: all 0.2s;
    }

    .enlaces-inferiores a:hover {
      color: #ffffff;
      border-bottom-color: rgba(0, 204, 255, 0.6);
    }

    /* ===== COMPUTADORA ===== */
    @media (min-width: 768px) {
      .contenedor { padding-top: 50vh; }
      .enlaces-inferiores { font-size: 0.85rem; gap: 1.25rem; }
    }

    /* ===== CELULAR ===== */
    @media (max-width: 480px) {
      .contenedor { padding: 1rem; padding-top: 45vh; padding-bottom: 7rem; }
      .buscador input { font-size: 0.95rem; padding: 0.9rem 1rem; }
      .boton { padding: 1rem 1.25rem; font-size: 0.95rem; }
      .enlaces-inferiores { font-size: 0.65rem; gap: 0.5rem; bottom: 1.2rem; }
      .boton-descarga { bottom: 4rem; left: 1rem; padding: 0.7rem 1rem; font-size: 0.8rem; }
    }
  </style>
</head>
<body>

  <main class="contenedor">
    <!-- BUSCADOR -->
    <div class="buscador">
      <input type="text" placeholder="Buscar servicios, personas..." />
      <button type="submit">🔍</button>
    </div>

    <!-- BOTONES PRINCIPALES -->
    <div class="botones-principales">
      <a href="ofrecer.html" class="boton boton-primario">Ofrecer mis servicios</a>
      <a href="solicitar.html" class="boton">Solicitar un servicio</a>
      <a href="login.html" class="boton">Iniciar sesión</a>
    </div>
  </main>

  <!-- BOTÓN DESCARGA -->
  <a href="#" class="boton-descarga">Descargar aplicación</a>

  <!-- ENLACES INFERIORES -->
  <nav class="enlaces-inferiores">
    <a href="normas.html">Normas y Seguridad</a>
    <a href="privacidad.html">Privacidad</a>
    <a href="terminos.html">Términos de Servicio</a>
    <a href="cookies.html">Cookies</a>
    <a href="contacto.html">Contacto</a>
  </nav>

</body>
</html>
