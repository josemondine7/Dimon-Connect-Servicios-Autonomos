<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Dimon Connect — Servicios Autónomos</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      margin: 0 !important;
      padding: 0 !important;
      width: 100% !important;
      height: 100vh !important;
      height: 100dvh !important;
      overflow: hidden !important;
      background: #2f74ff !important;
      position: fixed;
      top: 0;
      left: 0;
    }
    .fullscreen-container {
      width: 100vw !important;
      height: 100vh !important;
      height: 100dvh !important;
      position: absolute;
      top: 0;
      left: 0;
      border: none !important;
      margin: 0 !important;
      padding: 0 !important;
      overflow: hidden !important;
    }
    .fullscreen-container iframe {
      width: 100% !important;
      height: 100% !important;
      border: none !important;
      margin: 0 !important;
      padding: 0 !important;
      position: absolute;
      top: 0;
      left: 0;
      transform: scale(1.01);
      transform-origin: center center;
    }
    /* Capa invisible con botones funcionales */
    .botones-capa {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 10;
      pointer-events: none;
    }
    .botones-capa a {
      pointer-events: auto;
      position: absolute;
      width: 85%;
      left: 7.5%;
      cursor: pointer;
      border-radius: 20px;
    }
    .btn-buscar { top: 44%; height: 55px; }
    .btn-necesitas { top: 54%; height: 85px; }
    .btn-queres { top: 66.5%; height: 65px; }
    .btn-ofertas { top: 75.5%; height: 85px; }
  </style>
</head>
<body>
  <div class="fullscreen-container">
    <iframe loading="lazy" src="https://www.canva.com/design/DAHS8rnEpDE/GqUUO2CP1b7fRF3DGf8OBQ/view?embed" allowfullscreen="allowfullscreen" allow="fullscreen" scrolling="no" frameborder="0"></iframe>
    
    <div class="botones-capa">
      <a href="#buscar" class="btn-buscar" aria-label="Buscar servicio"></a>
      <a href="#necesitas" class="btn-necesitas" aria-label="¿Necesitás un servicio?"></a>
      <a href="#ofrecer" class="btn-queres" aria-label="¿Querés ofrecer tus servicios?"></a>
      <a href="#ofertas" class="btn-ofertas" aria-label="Ofertas y Demandas"></a>
    </div>
  </div>

  <section id="buscar" style="height:1px;"></section>
  <section id="necesitas" style="height:1px;"></section>
  <section id="ofrecer" style="height:1px;"></section>
  <section id="ofertas" style="height:1px;"></section>

  <script>
    document.querySelectorAll('.botones-capa a').forEach(btn => {
      btn.addEventListener('click', function(e) {
        e.preventDefault();
        const etiqueta = this.getAttribute('aria-label');
        alert('✅ ' + etiqueta + ' — ¡Funciona!');
      });
    });
  </script>
</body>
</html>
