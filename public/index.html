<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Dimon Connect — Servicios Autónomos</title>
  
  <link rel="stylesheet" href="css/variables.css">
  <link rel="stylesheet" href="css/global.css">
  <link rel="stylesheet" href="css/componentes.css">
  <link rel="stylesheet" href="css/responsivo.css">
  
  <script>
    const traducciones = {
      es: { 
        volver:"Volver", inicio:"Inicio", buscarPlaceholder:"Buscar servicios...", 
        ofertaDemanda:"Oferta y Demanda", brindarServicio:"Brindar mi Servicio", 
        solicitarServicio:"Solicitar un Servicio", normas:"Normas y Seguridad", 
        privacidad:"Privacidad", terminos:"Términos de Servicio", 
        descargarApp:"Descargar Aplicación", contacto:"Contacto"
      },
      en: { 
        volver:"Back", inicio:"Home", buscarPlaceholder:"Search services...", 
        ofertaDemanda:"Offer & Demand", brindarServicio:"Offer my Service", 
        solicitarServicio:"Request a Service", normas:"Rules & Security", 
        privacidad:"Privacy", terminos:"Terms of Service", 
        descargarApp:"Download App", contacto:"Contact"
      }
    };
    let idiomaActual = localStorage.getItem('idioma') || 'es';
    
    function cambiarIdioma(codigo) {
      idiomaActual = codigo;
      localStorage.setItem('idioma', codigo);
      aplicarTraducciones();
      document.getElementById('boton-idioma').textContent = codigo.toUpperCase();
    }
    
    function aplicarTraducciones() {
      document.querySelectorAll('[data-txt]').forEach(el => {
        const clave = el.getAttribute('data-txt');
        if (traducciones[idiomaActual][clave]) {
          el.textContent = traducciones[idiomaActual][clave];
        }
      });
      document.querySelectorAll('[data-placeholder]').forEach(el => {
        const clave = el.getAttribute('data-placeholder');
        if (traducciones[idiomaActual][clave]) {
          el.placeholder = traducciones[idiomaActual][clave];
        }
      });
    }
  </script>
  
  <style>
    :root {
      --color-oscuro: #0a192f;
      --color-azul: #2563eb;
      --color-azul-claro: #60a5fa;
      --color-blanco: #ffffff;
      --sombra: 0 18px 45px rgba(0, 0, 0, 0.35);
      --borde: 16px;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Segoe UI', Roboto, Oxygen, Ubuntu, sans-serif;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      position: fixed;
    }

    body {
      background: url('1788448614792.png') no-repeat center center;
      background-size: cover;
      background-attachment: fixed;
      margin: 0;
    }

    body::before {
      content: "";
      position: fixed;
      inset: 0;
      background: linear-gradient(to bottom, rgba(10, 25, 47, 0.70), rgba(10, 25, 47, 0.82));
      z-index: 0;
    }

    .app-header {
      position: relative;
      z-index: 3;
      width: 100%;
      padding: 16px 20px;
      display: flex;
      justify-content: flex-end;
      align-items: center;
      gap: 12px;
    }

    .idioma-boton {
      background: rgba(255,255,255,0.08);
      color: var(--color-blanco);
      border: 1px solid rgba(255,255,255,0.15);
      border-radius: 999px;
      padding: 10px 16px;
      font-size: 14px;
      cursor: pointer;
      transition: 0.22s ease;
      backdrop-filter: blur(10px);
    }

    .idioma-boton:hover {
      background: var(--color-azul);
      border-color: var(--color-azul);
    }

    .lira-boton {
      background: var(--color-azul);
      color: var(--color-blanco);
      border: none;
      border-radius: 999px;
      padding: 10px 20px;
      font-size: 14px;
      font-weight: 600;
      text-decoration: none;
      transition: 0.22s ease;
      box-shadow: 0 4px 15px rgba(37, 99, 235, 0.35);
    }

    .lira-boton:hover {
      background: var(--color-azul-claro);
      transform: translateY(-1px);
    }

    .buscador {
      position: relative;
      z-index: 3;
      max-width: 520px;
      margin: 0 auto 32px;
      padding: 0 24px;
    }

    .buscador input {
      width: 100%;
      border: 1px solid rgba(255,255,255,0.15);
      border-radius: 999px;
      padding: 14px 20px;
      background: rgba(255,255,255,0.06);
      color: var(--color-blanco);
      outline: none;
      font-size: 15px;
      backdrop-filter: blur(10px);
      transition: 0.22s ease;
    }

    .buscador input::placeholder {
      color: rgba(255,255,255,0.5);
    }

    .buscador input:focus {
      border-color: var(--color-azul);
      background: rgba(255,255,255,0.1);
      box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.15);
    }

    main {
      position: relative;
      z-index: 2;
      height: calc(100vh - 120px);
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: 24px;
    }

    .logo {
      width: 90px;
      height: 90px;
      margin-bottom: 18px;
      background: var(--color-azul);
      border-radius: 22px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--color-blanco);
      font-size: 42px;
      font-weight: bold;
      box-shadow: var(--sombra);
    }

    .titulo {
      color: var(--color-blanco);
      font-size: 28px;
      font-weight: 800;
      letter-spacing: 0.5px;
      margin-bottom: 8px;
      text-align: center;
    }

    .subtitulo {
      color: rgba(255,255,255,0.72);
      font-size: 15px;
      margin-bottom: 38px;
      text-align: center;
    }

    .botones-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 18px;
      width: 100%;
      max-width: 900px;
      margin-bottom: 40px;
    }

    .boton-principal {
      background: rgba(255,255,255,0.08);
      color: var(--color-blanco);
      border: 1px solid rgba(255,255,255,0.12);
      border-radius: var(--borde);
      padding: 20px 12px;
      text-align: center;
      text-decoration: none;
      font-size: 15px;
      font-weight: 700;
      transition: 0.25s ease;
      box-shadow: var(--sombra);
      backdrop-filter: blur(10px);
    }

    .boton-principal:hover {
      transform: translateY(-5px);
      background: var(--color-azul);
      border-color: var(--color-azul);
    }

    .footer-enlaces {
      position: absolute;
      bottom: 24px;
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 18px;
      z-index: 3;
    }

    .footer-enlaces a {
      color: rgba(255,255,255,0.65);
      text-decoration: none;
      font-size: 13px;
      transition: 0.2s ease;
    }

    .footer-enlaces a:hover {
      color: var(--color-blanco);
    }

    @media (max-width: 768px) {
      .botones-grid {
        grid-template-columns: 1fr;
        max-width: 320px;
      }
      .titulo { font-size: 22px; }
      .subtitulo { font-size: 14px; margin-bottom: 28px; }
      .app-header { padding: 14px 18px; }
      main { padding: 18px; }
      .logo { width: 70px; height: 70px; font-size: 32px; }
    }
  </style>
</head>
<body>

  <div class="app-header">
    <button class="idioma-boton" id="boton-idioma" onclick="cambiarIdioma(idiomaActual === 'es' ? 'en' : 'es')">ES</button>
    <a href="acceso-lira.html" class="lira-boton">Lira</a>
  </div>

  <div class="buscador">
    <input type="text" data-placeholder="buscarPlaceholder" placeholder="Buscar servicios...">
  </div>

  <main>
    <div class="logo">D</div>
    <h1 class="titulo">Dimon Connect</h1>
    <p class="subtitulo">Servicios Autónomos</p>

    <div class="botones-grid">
      <a href="oferta-demanda.html" class="boton-principal" data-txt="ofertaDemanda">Oferta y Demanda</a>
      <a href="ofrecer-servicio.html" class="boton-principal" data-txt="brindarServicio">Brindar mi Servicio</a>
      <a href="solicitar-servicio.html" class="boton-principal" data-txt="solicitarServicio">Solicitar un Servicio</a>
    </div>

    <div class="footer-enlaces">
      <a href="normas.html" data-txt="normas">Normas y Seguridad</a>
      <a href="politica-privacidad.html" data-txt="privacidad">Privacidad</a>
      <a href="terminos-servicio.html" data-txt="terminos">Términos de Servicio</a>
      <a href="descarga.html" data-txt="descargarApp">Descargar Aplicación</a>
      <a href="contacto.html" data-txt="contacto">Contacto</a>
    </div>
  </main>

  <script>
    aplicarTraducciones();
    document.getElementById('boton-idioma').textContent = idiomaActual.toUpperCase();
  </script>

  <script src="js/idioma.js"></script>
  <script src="js/almacenamiento.js"></script>
  <script src="js/flujos.js"></script>
</body>
</html>
