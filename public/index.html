<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Dimon Connect — Servicios Autónomos</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500;600;700;800;900&display=swap" rel="stylesheet">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      width: 100%;
      height: 100vh;
      height: 100dvh;
      overflow: hidden;
      position: fixed;
      top: 0;
      left: 0;
      font-family: 'Montserrat', -apple-system, BlinkMacSystemFont, sans-serif;
      background: #2B78FF;
      padding: 0 !important;
      margin: 0 !important;
    }

    /* FONDO — SOLO EL MAPA, LOGO Y TÍTULO */
    .fondo {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 1;
      background: #2B78FF;
    }

    .fondo iframe {
      width: 100%;
      height: 100%;
      border: none;
      transform: scale(1.05);
      transform-origin: center top;
      /* CORTAMOS TODO LO QUE ESTÁ ABAJO DEL TÍTULO en la imagen */
      clip-path: inset(0 0 45% 0);
      image-rendering: -webkit-optimize-contrast;
      image-rendering: crisp-edges;
    }

    /* CAPA AZUL QUE TAPA TODO LO QUE SOBRA DE LA IMAGEN */
    .tapa-inferior {
      position: absolute;
      bottom: 0;
      left: 0;
      width: 100%;
      height: 50%;
      background: #2B78FF;
      z-index: 2;
    }

    /* BOTONES REALES — ÚNICOS, NÍTIDOS, POR ENCIMA DE TODO */
    .contenedor-botones {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 10;
      padding: 0 5%;
      pointer-events: none;
    }

    .contenedor-botones a {
      pointer-events: auto;
      position: absolute;
      left: 5%;
      right: 5%;
      border-radius: 20px;
      border: 2px solid rgba(255,255,255,0.7);
      background: linear-gradient(180deg, rgba(52,78,196,0.95) 0%, rgba(35,54,168,0.95) 100%);
      box-shadow:
        inset 0 0 0 1px rgba(255,255,255,0.1),
        0 0 25px rgba(100,255,255,0.18),
        0 10px 30px rgba(0,0,0,0.2);
      cursor: pointer;
      transition: all 0.15s ease;
      display: flex;
      align-items: center;
      justify-content: center;
      color: white;
      font-weight: 800;
      font-size: clamp(15px, 4vw, 19px);
      text-align: center;
      text-decoration: none;
      backdrop-filter: blur(4px);
    }

    .contenedor-botones a::before {
      content: '';
      position: absolute;
      left: 0;
      right: 0;
      top: 0;
      height: 12px;
      background: linear-gradient(180deg, rgba(120,255,255,0.5) 0%, transparent 100%);
      border-radius: 18px 18px 0 0;
    }

    .contenedor-botones a:active {
      transform: scale(0.985);
      box-shadow:
        inset 0 0 0 1px rgba(255,255,255,0.05),
        0 0 10px rgba(100,255,255,0.1);
    }

    /* Posición exacta — SIN DUPLICADOS */
    .btn-buscar {
      top: 46%;
      height: 54px;
      background: rgba(255,255,255,0.15);
      justify-content: flex-start;
      padding-left: 20px;
      border-radius: 50px;
      border: 1.5px solid rgba(255,255,255,0.5);
      font-weight: 500;
      font-size: 16px;
    }

    .btn-buscar::before {
      content: 'Q';
      background: none;
      height: auto;
      border-radius: 0;
      margin-right: 10px;
      font-weight: 700;
      opacity: 0.8;
    }

    .btn-necesitas { top: 54%; height: 78px; }
    .btn-ofrecer { top: 65%; height: 58px; background: linear-gradient(180deg, rgba(58,86,210,0.95) 0%, rgba(45,65,190,0.95) 100%); }

    .btn-ofertas {
      top: 74%;
      height: 78px;
      background: linear-gradient(180deg, rgba(48,72,190,0.95) 0%, rgba(30,48,155,0.95) 100%);
      justify-content: flex-start;
      padding-left: 16px;
      gap: 12px;
    }

    /* Ícono micrófono */
    .mic-icon {
      width: 48px;
      height: 48px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(120,255,255,0.4) 0%, rgba(80,200,255,0.1) 60%, transparent 70%);
      border: 2px solid rgba(255,255,255,0.7);
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      box-shadow: 0 0 15px rgba(100,255,255,0.3);
    }

    .mic-icon span {
      width: 14px;
      height: 20px;
      border: 2px solid white;
      border-bottom: none;
      border-radius: 8px 8px 6px 6px;
      position: relative;
    }

    .mic-icon span::after {
      content: '';
      position: absolute;
      bottom: -5px;
      left: 50%;
      transform: translateX(-50%);
      width: 2px;
      height: 5px;
      background: white;
    }

    .btn-texto {
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      line-height: 1.2;
    }

    .btn-texto strong { font-size: 18px; }
    .btn-texto small { font-size: 12px; font-weight: 500; opacity: 0.85; }

    /* ENLACES DE ABAJO — ÚNICOS, CLICKEABLES, SIN DUPLICADOS */
    .pie-pagina {
      position: absolute;
      bottom: 12px;
      left: 0;
      width: 100%;
      z-index: 15;
      text-align: center;
      padding: 0 15px;
    }

    .enlaces-superiores {
      display: flex;
      justify-content: center;
      flex-wrap: wrap;
      gap: 0 15px;
      margin-bottom: 10px;
    }

    .enlaces-superiores a {
      color: rgba(255,255,255,0.8);
      font-size: 13px;
      text-decoration: none;
      transition: color 0.2s;
    }

    .enlaces-superiores a:hover { color: white; text-decoration: underline; }

    .enlaces-superiores span {
      color: rgba(255,255,255,0.4);
      font-size: 12px;
    }

    .enlace-descargar {
      color: rgba(180,255,255,0.95);
      font-size: 15px;
      font-weight: 700;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      transition: all 0.2s;
    }

    .enlace-descargar:hover { color: white; transform: scale(1.02); }

    /* OCULTAR TODO LO DE CANVA */
    iframe { display: block; }
    ::-webkit-scrollbar { display: none; }
  </style>
</head>
<body>

  <!-- FONDO SOLO — mapa, logo, título → SIN botones ni textos de abajo -->
  <div class="fondo">
    <iframe 
      loading="eager" 
      src="https://www.canva.com/design/DAHS8rnEpDE/GqUUO2CP1b7fRF3DGf8OBQ/view?embed" 
      allowfullscreen 
      scrolling="no"
      frameborder="0">
    </iframe>
  </div>

  <!-- TAPA AZUL QUE OCULTA TODO LO DE ABAJO DE LA IMAGEN -->
  <div class="tapa-inferior"></div>

  <!-- BOTONES REALES — ÚNICOS, NÍTIDOS, SIN DUPLICADOS -->
  <div class="contenedor-botones">
    <a href="#buscar" class="btn-buscar">¿Qué servicio necesitas hoy?</a>
    <a href="#necesitas" class="btn-necesitas">¿NECESITÁS UN SERVICIO?</a>
    <a href="#ofrecer" class="btn-ofrecer">¿Querés ofrecer tus servicios?</a>
    <a href="#ofertas" class="btn-ofertas">
      <div class="mic-icon"><span></span></div>
      <div class="btn-texto">
        <strong>Ofertas y Demandas</strong>
        <small>Buscar servicios o publicar tu oferta</small>
      </div>
    </a>
  </div>

  <!-- ENLACES DE ABAJO — ÚNICOS, CLICKEABLES -->
  <div class="pie-pagina">
    <div class="enlaces-superiores">
      <a href="#normas">Normas y Seguridad</a>
      <span>|</span>
      <a href="#actualizaciones">Actualizaciones</a>
      <span>|</span>
      <a href="#privacidad">Política de Privacidad</a>
    </div>
    <a href="#descargar" class="enlace-descargar">⬇️ Descargar la aplicación Dimon Connect</a>
  </div>

  <!-- Anclas invisibles -->
  <section id="buscar" style="display:none;"></section>
  <section id="necesitas" style="display:none;"></section>
  <section id="ofrecer" style="display:none;"></section>
  <section id="ofertas" style="display:none;"></section>
  <section id="normas" style="display:none;"></section>
  <section id="actualizaciones" style="display:none;"></section>
  <section id="privacidad" style="display:none;"></section>
  <section id="descargar" style="display:none;"></section>

  <script>
    // Acción de botones
    document.querySelectorAll('.contenedor-botones a').forEach(btn => {
      btn.addEventListener('click', e => {
        e.preventDefault();
        alert('✅ ' + btn.textContent.trim() + '\n\n¡Funciona perfectamente!');
      });
    });

    // Acción de enlaces de abajo
    document.querySelectorAll('.pie-pagina a').forEach(link => {
      link.addEventListener('click', e => {
        e.preventDefault();
        alert('📄 ' + link.textContent.trim() + '\n\n¡Página lista!');
      });
    });
  </script>

</body>
</html>
