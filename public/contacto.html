<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Contacto — Dimon Connect</title>
  <style>
    * {margin:0; padding:0; box-sizing:border-box; font-family:'Segoe UI',sans-serif;}
    html,body {
      width:100%; min-height:100vh; background:#0066FF;
      background-image:url('./1788448614792.png'); background-repeat:no-repeat;
      background-position:center; background-size:cover; color:#fff; padding:1.5rem; padding-bottom:3rem;
    }
    .volver {margin-bottom:1.5rem;}
    .volver a {color:#00ccff; text-decoration:none; font-weight:600;}
    h1 {font-size:1.8rem; color:#ffd700; margin-bottom:2rem; text-align:center;}
    .caja {
      background:rgba(0,51,102,0.7); border:2px solid #00ccff; border-radius:12px;
      padding:2rem; max-width:500px; margin:0 auto; backdrop-filter:blur(8px);
    }
    label {display:block; margin-bottom:0.5rem; color:#b0e0ff; font-weight:500;}
    input, textarea {
      width:100%; padding:1rem; margin-bottom:1.2rem; border-radius:8px; border:2px solid rgba(255,255,255,0.2);
      background:rgba(255,255,255,0.1); color:#fff; font-size:1rem; outline:none;
    }
    input:focus, textarea:focus {border-color:#00ccff;}
    button {
      width:100%; padding:1.1rem; border:none; border-radius:8px;
      background:linear-gradient(135deg, #ffd700, #ff8800); color:#000;
      font-size:1.05rem; font-weight:700; cursor:pointer; transition:all 0.25s;
    }
    button:hover {transform:translateY(-2px);}
    .info-contacto {margin-top:1.5rem; line-height:1.7; color:#e0f0ff; text-align:center;}
    .info-contacto p {margin-bottom:0.5rem;}
  </style>
</head>
<body>
  <div class="volver"><a href="index.html">← Volver al inicio</a></div>
  <h1>Contacto</h1>

  <div class="caja">
    <form onsubmit="event.preventDefault(); alert('Mensaje enviado. Gracias por contactarnos.');">
      <label for="nombre">Nombre completo</label>
      <input type="text" id="nombre" required />

      <label for="correo">Correo electrónico</label>
      <input type="email" id="correo" required />

      <label for="asunto">Asunto</label>
      <input type="text" id="asunto" required />

      <label for="mensaje">Mensaje</label>
      <textarea id="mensaje" rows="5" required></textarea>

      <button type="submit">Enviar mensaje</button>
    </form>

    <div class="info-contacto">
      <p><strong>Correo electrónico:</strong> contacto@dimonconnect.com</p>
      <p>Respondemos de lunes a viernes dentro de las 48 horas.</p>
    </div>
  </div>

</body>
</html>
