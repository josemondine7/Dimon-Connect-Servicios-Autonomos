function aplicarIdioma() {
  const idioma = localStorage.getItem('idiomaDimon') || 'es';
  const t = traducciones[idioma] || traducciones.es;
  document.documentElement.lang = idioma;
  document.querySelectorAll('[data-txt]').forEach(el => { const c=el.dataset.txt; if(t[c])el.textContent=t[c]; });
  document.querySelectorAll('[data-txt-ph]').forEach(el => { const c=el.dataset.txtPh; if(t[c])el.placeholder=t[c]; });
}

      color: #fff; font-size: 1rem; outline: none;
      transition: border 0.2s;
    }
    input:focus, textarea:focus, select:focus { border-color: #38bdf8; }
    textarea { min-height: 140px; resize: vertical; }
    .boton {
      width: 100%; padding: 1rem;
      background: linear-gradient(135deg, #f97316, #ea580c);
      color: #fff; border: none; border-radius: 10px;
      font-size: 1.1rem; font-weight: 600; cursor: pointer;
      transition: transform 0.2s, box-shadow 0.2s;
    }
    .boton:hover { transform: translateY(-2px); box-shadow: 0 6px 20px rgba(249, 115, 22, 0.35); }
    .info {
      margin-top: 2.5rem; padding: 1.5rem;
      background: rgba(255,255,255,0.05); border-radius: 12px;
      border: 1px solid rgba(255,255,255,0.1);
    }
    .info h3 { color: #fcd34d; margin-bottom: 1rem; }
    .info p { margin-bottom: 0.5rem; color: #bae6fd; }
  </style>
</head>
<body>
  <div class="contenedor">
    <a href="index.html" class="volver" data-txt="volverInicio">← Volver al inicio</a>

    <h1 data-txt="tituloContacto">📬 Contacto</h1>

    <form id="form-contacto" onsubmit="enviarContacto(event)">
      <div class="form-grupo">
        <label for="nombre" data-txt="tuNombre">Tu Nombre</label>
        <input type="text" id="nombre" required />
      </div>
      <div class="form-grupo">
        <label for="correo" data-txt="correoElectronico">Correo Electrónico</label>
        <input type="email" id="correo" required />
      </div>
      <div class="form-grupo">
        <label for="asunto" data-txt="asunto">Asunto</label>
        <select id="asunto" required>
          <option value="" data-txt="seleccionarMotivo">Seleccioná un motivo</option>
          <option data-txt="consultaGeneral">Consulta general</option>
          <option data-txt="problemaServicio">Problema con el servicio</option>
          <option data-txt="consultaLegal">Consulta legal o normativa</option>
          <option data-txt="sugerencia">Sugerencia</option>
          <option data-txt="otro">Otro</option>
        </select>
      </div>
      <div class="form-grupo">
        <label for="mensaje" data-txt="tuMensaje">Tu Mensaje</label>
        <textarea id="mensaje" required data-txt-ph="placeholderMensaje" placeholder="Escribinos tu consulta. Te respondemos a la brevedad."></textarea>
      </div>
      <button type="submit" class="boton" data-txt="enviarMensaje">✅ Enviar Mensaje</button>
    </form>

    <div class="info">
      <h3 data-txt="infoContacto">Información de Contacto</h3>
      <p>📧 <span data-txt="correoLabel">Correo:</span> contacto@dimonconnect.com</p>
      <p>🌐 <span data-txt="sitioLabel">Sitio:</span> www.dimonconnect.com</p>
      <p>📍 <span data-txt="ubicacion">República Oriental del Uruguay</span></p>
      <p>🕒 <span data-txt="horarioRespuesta">Horario de respuesta: Lunes a Viernes, 9:00 a 18:00 (UTC-3)</span></p>
    </div>
  </div>

  <script>
    function enviarContacto(e) {
      e.preventDefault();
      const idioma = localStorage.getItem('idiomaDimon') || 'es';
      const t = traducciones[idioma]?.mensajeExito || traducciones.es.mensajeExito;
      alert(t);
      e.target.reset();
    }
  </script>
</body>
</html>
