<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Contacto — Dimon Connect</title>
  
  <link rel="stylesheet" href="css/variables.css">
  <link rel="stylesheet" href="css/masglobal.css">
  <link rel="stylesheet" href="css/componentes.css">
  <link rel="stylesheet" href="css/responsivo.css">
</head>
<body>

  <header>
    <button class="boton-volver" onclick="window.location.href='index.html'" data-txt="volver">← Volver</button>
    <h2 data-txt="contacto">Contacto</h2>
  </header>

  <main class="contenedor-formulario">
    <div class="info-contacto">
      <h3>📬 Escribinos</h3>
      <p>¿Tenés alguna duda, sugerencia o necesitás ayuda? Estamos acá para vos.</p>
    </div>

    <form id="formulario-contacto" class="formulario">
      <div class="grupo-formulario">
        <label>Tu Nombre</label>
        <input type="text" id="contacto-nombre" required>
      </div>

      <div class="grupo-formulario">
        <label>Tu Correo Electrónico</label>
        <input type="email" id="contacto-correo" required>
      </div>

      <div class="grupo-formulario">
        <label>Asunto</label>
        <select id="contacto-asunto" required>
          <option value="">Seleccionar...</option>
          <option value="consulta">Consulta General</option>
          <option value="soporte">Soporte Técnico</option>
          <option value="reportar">Reportar un Problema</option>
          <option value="sugerencia">Sugerencia</option>
          <option value="otro">Otro</option>
        </select>
      </div>

      <div class="grupo-formulario">
        <label>Tu Mensaje</label>
        <textarea id="contacto-mensaje" rows="5" required></textarea>
      </div>

      <button type="submit" class="boton-principal">Enviar Mensaje</button>
    </form>

    <div class="correo-directo">
      <p>O escribinos directamente a:</p>
      <a href="mailto:contacto@dimonconnect.com" class="enlace-correo">📧 contacto@dimonconnect.com</a>
    </div>
  </main>

  <script src="js/idioma.js"></script>
  <script src="js/almacenamiento.js"></script>
  <script src="js/validacion.js"></script>
  <script src="js/trato.js"></script>
  <script src="js/flujos.js"></script>
</body>
</html>
