<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Chat — Dimon Connect</title>
  <link rel="stylesheet" href="styles.css" />
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', sans-serif; }
    html, body {
      width: 100%; height: 100vh;
      background: linear-gradient(135deg, #1a2a6c, #0f4c81);
      color: #fff;
      display: flex; flex-direction: column;
      overflow: hidden;
    }
    .cabecera-chat {
      display: flex; align-items: center; padding: 1rem 1.5rem;
      background: rgba(0,0,0,0.25); border-bottom: 1px solid rgba(255,255,255,0.1);
      gap: 1rem;
    }
    .volver { color: #93c5fd; text-decoration: none; font-size: 0.9rem; }
    .usuario-info h2 { font-size: 1.1rem; color: #fcd34d; }
    .usuario-info p { font-size: 0.85rem; color: #93c5fd; }
    .resumen-trato {
      padding: 0.75rem 1.5rem; background: rgba(16, 185, 129, 0.1);
      border-bottom: 1px solid rgba(16, 185, 129, 0.25);
      font-size: 0.9rem; color: #bbf7d0;
    }
    .mensajes {
      flex: 1; padding: 1.5rem; overflow-y: auto; display: flex; flex-direction: column; gap: 1rem;
    }
    .mensaje {
      max-width: 75%; padding: 0.85rem 1.1rem; border-radius: 18px; line-height: 1.5;
      position: relative;
    }
    .mensaje-enviado {
      background: linear-gradient(135deg, #3b82f6, #2563eb);
      align-self: flex-end; border-bottom-right-radius: 4px;
    }
    .mensaje-recibido {
      background: rgba(255,255,255,0.1);
      align-self: flex-start; border-bottom-left-radius: 4px;
    }
    .hora { font-size: 0.7rem; opacity: 0.6; margin-top: 0.3rem; text-align: right; }
    .entrada {
      display: flex; gap: 0.75rem; padding: 1rem 1.5rem;
      border-top: 1px solid rgba(255,255,255,0.1);
      background: rgba(0,0,0,0.2);
    }
    .entrada input {
      flex: 1; padding: 0.9rem 1.2rem; border-radius: 25px;
      border: 1px solid rgba(255,255,255,0.2);
      background: rgba(255,255,255,0.08);
      color: #fff; font-size: 1rem; outline: none;
    }
    .boton-enviar {
      padding: 0.9rem 1.5rem; border-radius: 25px; border: none;
      background: linear-gradient(135deg, #f97316, #ea580c);
      color: #fff; font-weight: 600; cursor: pointer;
    }
    .boton-confirmar {
      margin: 0.5rem 1.5rem; padding: 0.85rem; border-radius: 10px; border: none;
      background: linear-gradient(135deg, #10b981, #059669);
      color: #fff; font-weight: 600; cursor: pointer;
    }
  </style>
</head>
<body>
  <div class="cabecera-chat">
    <a href="oferta-demanda.html" class="volver">←</a>
    <div class="usuario-info">
      <h2>Nombre del Usuario</h2>
      <p>En línea · Trato en curso</p>
    </div>
  </div>

  <div class="resumen-trato">
    📋 <strong>Trato acordado:</strong> $[Precio] · [Fecha] · 5% + 5% de comisión · <a href="acuerdo-trato.html" style="color:#fcd34d;">Ver detalle</a>
  </div>

  <div class="mensajes" id="caja-mensajes">
    <div class="mensaje mensaje-recibido">
      ¡Hola! Vi tu servicio y me interesa. ¿Podemos coordinar?
      <div class="hora">14:30</div>
    </div>
    <div class="mensaje mensaje-enviado">
      ¡Claro que sí! Estoy disponible. ¿Te sirve el precio y la fecha?
      <div class="hora">14:32</div>
    </div>
  </div>

  <button class="boton-confirmar" onclick="confirmarServicio()">✅ Servicio Realizado — Confirmar Pago</button>

  <div class="entrada">
    <input type="text" id="texto-mensaje" placeholder="Escribí tu mensaje..." onkeydown="if(event.key==='Enter')enviarMensaje()" />
    <button class="boton-enviar" onclick="enviarMensaje()">Enviar</button>
  </div>

  <script>
    function enviarMensaje() {
      const texto = document.getElementById('texto-mensaje').value.trim();
      if (!texto) return;
      const caja = document.getElementById('caja-mensajes');
      const hora = new Date().toLocaleTimeString([], {hour:'2-digit', minute:'2-digit'});
      caja.innerHTML += `
        <div class="mensaje mensaje-enviado">
          ${texto.replace(/</g, '&lt;')}
          <div class="hora">${hora}</div>
        </div>
      `;
      document.getElementById('texto-mensaje').value = '';
      caja.scrollTop = caja.scrollHeight;
    }
    function confirmarServicio() {
      if (confirm('¿Confirmás que el servicio fue realizado y estás conforme con el trabajo?\n\nAl confirmar se libera el pago al prestador.')) {
        alert('✅ ¡Servicio confirmado!\n\nEl pago se libera descontando las comisiones correspondientes.\n\n¡Gracias por usar Dimon Connect!');
        window.location.href = 'index.html';
      }
    }
  </script>
</body>
</html>
