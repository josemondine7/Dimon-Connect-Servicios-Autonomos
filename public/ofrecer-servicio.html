<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Brindar un Servicio — Dimon Connect</title>
  
  <link rel="stylesheet" href="css/variables.css">
  <link rel="stylesheet" href="css/global.css">
  <link rel="stylesheet" href="css/componentes.css">
  <link rel="stylesheet" href="css/responsivo.css">
</head>
<body>

  <header>
    <button class="boton-volver" onclick="window.location.href='oferta-demanda.html'" data-txt="volver">← Volver</button>
    <h2 data-txt="brindarServicio">Brindar mi Servicio</h2>
  </header>

  <main class="contenedor-formulario">
    <form id="formulario-oferente" class="formulario">
      <div class="grupo-formulario">
        <label data-txt="nombreCompleto">Nombre Completo</label>
        <input type="text" id="oferente-nombre" required>
      </div>

      <div class="grupo-formulario">
        <label data-txt="correo">Correo Electrónico</label>
        <input type="email" id="oferente-correo" required>
      </div>

      <div class="grupo-formulario">
        <label data-txt="telefono">Teléfono / WhatsApp</label>
        <input type="tel" id="oferente-telefono" required>
      </div>

      <div class="grupo-formulario">
        <label data-txt="tipoServicio">Tipo de Servicio</label>
        <select id="oferente-servicio" required>
          <option value="" data-txt="seleccionarOpcion">Seleccionar...</option>
          <!-- Se llena dinámicamente -->
        </select>
      </div>

      <div class="grupo-formulario">
        <label data-txt="descripcionServicio">Descripción del Servicio</label>
        <textarea id="oferente-descripcion" rows="4" required></textarea>
      </div>

      <div class="grupo-formulario">
        <label data-txt="precioEstimado">Precio Estimado</label>
        <input type="number" id="oferente-precio" step="0.01" min="0">
        <select id="oferente-moneda">
          <option value="USD">USD $</option>
          <option value="UYU">UYU $</option>
          <option value="ARS">ARS $</option>
          <option value="EUR">EUR €</option>
        </select>
      </div>

      <div class="grupo-formulario">
        <label data-txt="ubicacion">Ubicación / Zona</label>
        <input type="text" id="oferente-ubicacion">
      </div>

      <div class="grupo-formulario checkbox">
        <input type="checkbox" id="acepto-normas" required>
        <label for="acepto-normas" data-txt="aceptoNormas">Acepto las Normas y el Acuerdo del Trato</label>
      </div>

      <button type="submit" class="boton-principal" data-txt="registrarOferta">Registrar mi Servicio</button>
    </form>
  </main>

  <script src="js/idioma.js"></script>
  <script src="js/almacenamiento.js"></script>
  <script src="js/validacion.js"></script>
  <script src="js/trato.js"></script>
  <script src="js/flujos.js"></script>
</body>
</html>
