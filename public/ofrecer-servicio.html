<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Ofrecer Tus Servicios — Dimon Connect</title>
  <link rel="stylesheet" href="styles.css" />
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', sans-serif; }
    html, body {
      width: 100%; min-height: 100vh;
      background: linear-gradient(135deg, #1a2a6c, #0f4c81);
      color: #fff;
      padding: 2rem 1.5rem;
      line-height: 1.7;
    }
    .contenedor { max-width: 600px; margin: 0 auto; }
    .volver {
      display: inline-block; color: #93c5fd; text-decoration: none;
      margin-bottom: 1.5rem; padding: 0.5rem 1rem;
      background: rgba(59, 130, 246, 0.15); border-radius: 8px;
      border: 1px solid rgba(96, 165, 250, 0.3);
    }
    h1 { font-size: 1.8rem; margin-bottom: 0.5rem; color: #93c5fd; text-align: center; }
    .subtitulo { text-align: center; color: #bae6fd; margin-bottom: 2rem; }
    .caja {
      background: rgba(255,255,255,0.05); padding: 1.5rem; border-radius: 12px;
      margin-bottom: 1.5rem; border: 1px solid rgba(255,255,255,0.1);
    }
    .form-grupo { margin-bottom: 1.25rem; }
    label { display: block; margin-bottom: 0.5rem; color: #bae6fd; font-weight: 500; font-size: 0.95rem; }
    input, select, textarea {
      width: 100%; padding: 0.85rem 1rem; border-radius: 8px;
      border: 1px solid rgba(255,255,255,0.2);
      background: rgba(255,255,255,0.08);
      color: #fff; font-size: 1rem; outline: none;
      transition: border 0.2s;
    }
    input:focus, select:focus, textarea:focus { border-color: #38bdf8; }
    textarea { min-height: 100px; resize: vertical; }
    .boton {
      width: 100%; padding: 1rem;
      background: linear-gradient(135deg, #f97316, #ea580c);
      color: #fff; border: none; border-radius: 10px;
      font-size: 1.1rem; font-weight: 600; cursor: pointer;
      transition: transform 0.2s, box-shadow 0.2s;
      margin-top: 0.5rem;
    }
    .boton:hover { transform: translateY(-2px); box-shadow: 0 6px 20px rgba(249, 115, 22, 0.35); }
    .aviso {
      background: rgba(252, 211, 77, 0.1); padding: 1rem; border-radius: 10px;
      border: 1px solid rgba(252, 211, 77, 0.3); margin-top: 1.5rem;
      color: #fef3c7; font-size: 0.9rem; line-height: 1.6;
    }
    .check { display: flex; align-items: flex-start; gap: 0.75rem; margin: 1.5rem 0; }
    .check input { width: auto; margin-top: 0.25rem; }
  </style>
</head>
<body>
  <div class="contenedor">
    <a href="index.html" class="volver">← Volver al inicio</a>

    <h1>Ofrece Tus Servicios</h1>
    <p class="subtitulo">Completá los datos para que te encuentren y te contacten</p>

    <form onsubmit="enviarOferta(event)">
      <div class="caja">
        <div class="form-grupo">
          <label>Título del Servicio</label>
          <input type="text" id="titulo" placeholder="Ej: Limpieza de casa, Reparación eléctrica..." required />
        </div>
        <div class="form-grupo">
          <label>Descripción del Trabajo</label>
          <textarea id="descripcion" placeholder="Detallá qué hacés, experiencia, materiales incluidos, tiempos de realización..." required></textarea>
        </div>
        <div class="form-grupo">
          <label>País</label>
          <select id="pais" required>
            <option value="">Seleccioná tu país</option>
            <option>Uruguay</option>
            <option>Argentina</option>
            <option>Brasil</option>
            <option>Chile</option>
            <option>Estados Unidos</option>
            <option>España</option>
            <option>México</option>
            <option>Otro</option>
          </select>
        </div>
        <div class="form-grupo">
          <label>Ciudad</label>
          <input type="text" id="ciudad" placeholder="Tu ciudad" required />
        </div>
        <div class="form-grupo">
          <label>Correo Electrónico de Contacto</label>
          <input type="email" id="correo" placeholder="tu@email.com" required />
        </div>
        <div class="form-grupo">
          <label>Precio Estimado (moneda según tu país)</label>
          <input type="number" id="precio" placeholder="0.00" min="0" step="0.01" required />
        </div>

        <!-- 🔵 CAMPO NUEVO: MÉTODO DE COBRO -->
        <div class="form-grupo">
          <label>💳 Método de Cobro Preferido</label>
          <select id="metodo-cobro" required>
            <option value="">Seleccioná cómo querés cobrar</option>
            <option>PayPal — Pago internacional rápido</option>
            <option>Cuenta Bancaria — Transferencia directa</option>
            <option>PayPal + Cuenta Bancaria — Ambas opciones</option>
            <option>Efectivo — Pago presencial al entregar el trabajo</option>
            <option>A convenir — Definir al acordar el trato</option>
          </select>
        </div>
      </div>

      <label class="check">
        <input type="checkbox" required />
        <span>Me comprometo a realizar el servicio con responsabilidad y buena fe. No ofrezco tareas que no sé realizar.</span>
      </label>

      <div class="aviso">
        ⚠️ <strong>Comisiones al concretar el trato:</strong><br>
        • Se descuenta el 5% del valor total al prestador del servicio<br>
        • Se suma el 5% al solicitante del servicio<br>
        • Total: 10% sobre el valor de la transacción
      </div>

      <button type="submit" class="boton">✅ Publicar Servicio</button>
    </form>
  </div>

  <script>
    function enviarOferta(e) {
      e.preventDefault();
      alert('✅ ¡Servicio publicado con éxito!\n\nYa aparece en el listado de ofertas.\nMétodo de cobro seleccionado: ' + document.getElementById('metodo-cobro').value);
      window.location.href = 'oferta-demanda.html';
    }
  </script>
</body>
</html>
