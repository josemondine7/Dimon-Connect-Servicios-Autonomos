<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Iniciar Sesión — Dimon Connect</title>
  <style>
    *{margin:0;padding:0;box-sizing:border-box;font-family:'Segoe UI',sans-serif}
    html,body{width:100%;min-height:100vh;background:url('fondo-Dimon.png') no-repeat center center fixed;background-size:cover;color:#fff;display:flex;align-items:center;justify-content:center;padding:1.5rem}
    .capa-sombra{position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(5,16,64,.4);z-index:-1}
    .volver{position:absolute;top:1.5rem;left:1.5rem;color:#00ccff;text-decoration:none}
    .tarjeta-login{background:rgba(5,20,60,.85);padding:2.5rem 2rem;border-radius:16px;width:100%;max-width:420px;border:1px solid rgba(0,204,255,.2);text-align:center}
    .logo-sesion{width:180px;height:auto;margin-bottom:1.5rem}
    h2{font-size:1.5rem;color:#00ccff;margin-bottom:2rem}
    .grupo{margin-bottom:1.5rem;text-align:left}
    label{display:block;font-size:1rem;color:#b0e0ff;margin-bottom:.6rem}
    input{width:100%;padding:1.1rem 1.2rem;border:none;border-radius:10px;background:rgba(255,255,255,.9);color:#051040;font-size:1.05rem;outline:none}
    .boton-ingresar{width:100%;padding:1.1rem;border:none;border-radius:10px;background:linear-gradient(90deg,#00ccff,#00f2fe);color:#051040;font-size:1.1rem;font-weight:700;cursor:pointer;margin-top:.5rem;margin-bottom:1.5rem}
    .enlaces-abajo{display:flex;flex-direction:column;gap:.8rem;font-size:.95rem}
    .enlaces-abajo a{color:#b0e0ff;text-decoration:none}
    @media (max-width:480px){.tarjeta-login{padding:2rem 1.5rem};.logo-sesion{width:160px}}
  </style>
</head>
<body>
  <div class="capa-sombra"></div>
  <a href="index.html" class="volver">Volver al inicio</a>
  <div class="tarjeta-login">
    <img src="logo_dimon_connect.png" alt="Dimon Connect" class="logo-sesion" />
    <h2>Iniciar Sesión</h2>
    <form>
      <div class="grupo"><label>Correo electrónico</label><input type="email" placeholder="tu@email.com" required /></div>
      <div class="grupo"><label>Contraseña</label><input type="password" placeholder="••••••••" required /></div>
      <button type="submit" class="boton-ingresar">Iniciar sesión</button>
    </form>
    <div class="enlaces-abajo">
      <a href="registro.html">¿No tenés cuenta? Crear cuenta nueva</a>
      <a href="recuperar.html">Olvidé mi contraseña</a>
    </div>
  </div>
</body>
</html>
