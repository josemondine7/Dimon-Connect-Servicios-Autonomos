<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Iniciar Sesión — Dimon Connect</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', sans-serif; }
    html, body {
      width: 100%; min-height: 100vh;
      background: linear-gradient(135deg, #0f1e5c, #1a3a8c);
      color: #fff; display: flex; align-items: center; justify-content: center; padding: 2rem;
    }
    .caja {
      width: 100%; max-width: 420px; background: rgba(0,0,0,0.3);
      padding: 2.5rem; border-radius: 20px; box-shadow: 0 8px 32px rgba(0,242,254,0.15);
    }
    .volver { color: #00f2fe; text-decoration: none; font-weight: 600; display: inline-block; margin-bottom: 2rem; }
    h1 { color: #00f2fe; text-align: center; margin-bottom: 2rem; font-size: 1.8rem; }
    .logo { text-align: center; font-size: 2.5rem; margin-bottom: 1rem; }
    form { display: flex; flex-direction: column; gap: 1.2rem; }
    label { font-weight: 500; color: #e0ffff; }
    input {
      padding: 1rem 1.2rem; border-radius: 10px; border: none;
      background: rgba(255,255,255,0.9); color: #1a2a6c; font-size: 1rem;
    }
    button {
      padding: 1rem; border-radius: 10px; border: none;
      background: #00f2fe; color: #0a2a4a; font-size: 1.1rem; font-weight: 700;
      cursor: pointer; margin-top: 0.5rem; transition: all 0.2s;
    }
    button:hover { background: #00d4e0; transform: translateY(-2px); }
    .enlaces { margin-top: 1.5rem; text-align: center; font-size: 0.9rem; }
    .enlaces a { color: #00f2fe; text-decoration: none; }
    .separador { margin: 1.5rem 0; text-align: center; color: #88aacc; }
  </style>
</head>
<body>
  <div class="caja">
    <a href="index.html" class="volver">← Volver al inicio</a>
    <div class="logo">💎</div>
    <h1>Dimon Connect</h1>

    <form action="#" method="POST">
      <label>Correo electrónico</label>
      <input type="email" name="email" placeholder="tu@email.com" required>

      <label>Contraseña</label>
      <input type="password" name="clave" placeholder="••••••••" required>

      <button type="submit">🔐 Iniciar sesión</button>
    </form>

    <div class="enlaces">
      <p>¿No tenés cuenta? <a href="#">Crear cuenta nueva</a></p>
      <p><a href="#">Olvidé mi contraseña</a></p>
    </div>
  </div>
</body>
</html>
