<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Iniciar Sesión — Dimon Connect</title>
  
  <link rel="stylesheet" href="css/variables.css">
  <link rel="stylesheet" href="css/global.css">
  <link rel="stylesheet" href="css/componentes.css">
  <link rel="stylesheet" href="css/responsivo.css">
</head>
<body>

  <header>
    <button class="boton-volver" onclick="window.location.href='index.html'" data-txt="volver">← Volver</button>
  </header>

  <main class="contenedor-central">
    <div class="caja-login">
      <h2>🔑 Iniciar Sesión</h2>
      <p class="subtitulo">Ingresá tus datos para acceder</p>

      <form id="formulario-login" class="formulario">
        <div class="grupo-formulario">
          <label>Correo Electrónico</label>
          <input type="email" id="login-correo" required placeholder="tu@email.com">
        </div>

        <div class="grupo-formulario">
          <label>Contraseña</label>
          <input type="password" id="login-clave" required placeholder="••••••••">
        </div>

        <button type="submit" class="boton-principal">Ingresar</button>
      </form>

      <div class="enlaces-auth">
        <p>¿No tenés cuenta aún? <a href="#" id="link-registrarse">Crear cuenta</a></p>
        <p><a href="#" id="link-recuperar">¿Olvidaste tu contraseña?</a></p>
      </div>

      <hr>

      <div class="opcion-anonima">
        <p class="pequeño">O simplemente navegá sin registrarte:</p>
        <button id="boton-continuar-sesion" class="boton-secundario">Continuar sin sesión</button>
      </div>
    </div>
  </main>

  <script>
    document.getElementById('boton-continuar-sesion').addEventListener('click', function() {
      window.location.href = 'index.html';
    });

    document.getElementById('formulario-login').addEventListener('submit', function(e) {
      e.preventDefault();
      const correo = document.getElementById('login-correo').value;
      const clave = document.getElementById('login-clave').value;
      
      // Búsqueda simple en usuarios registrados
      const usuarios = JSON.parse(localStorage.getItem('usuarios-registrados') || '[]');
      const encontrado = usuarios.find(u => u.correo === correo && u.clave === clave);
      
      if (encontrado) {
        localStorage.setItem('usuario-actual', JSON.stringify(encontrado));
        window.location.href = 'perfil-usuario.html';
      } else {
        alert('Correo o contraseña incorrectos. Si no estás registrado, creá una cuenta primero.');
      }
    });

    document.getElementById('link-registrarse').addEventListener('click', function() {
      alert('Función de registro disponible al completar un servicio. Por ahora completá tu primer formulario de oferta o demanda para quedar registrado automáticamente.');
      window.location.href = 'oferta-demanda.html';
    });
  </script>

  <script src="js/idioma.js"></script>
  <script src="js/almacenamiento.js"></script>
  <script src="js/validacion.js"></script>
  <script src="js/trato.js"></script>
  <script src="js/flujos.js"></script>
</body>
</html>
