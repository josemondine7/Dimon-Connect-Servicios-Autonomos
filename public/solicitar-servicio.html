<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Solicitar un Servicio — Dimon Connect</title>
  
  <link rel="stylesheet" href="css/variables.css">
  <link rel="stylesheet" href="css/global.css">
  <link rel="stylesheet" href="css/componentes.css">
  <link rel="stylesheet" href="css/responsivo.css">
</head>
<body>

  <header>
    <button class="boton-volver" onclick="window.location.href='oferta-demanda.html'" data-txt="volver">← Volver</button>
    <h2 data-txt="solicitarServicio">Solicitar un Servicio</h2>
  </header>

  <main class="contenedor-formulario">
    <form id="formulario-demandante" class="formulario">
      <div class="grupo-formulario">
        <label data-txt="nombreCompleto">Nombre Completo</label>
        <input type="text" id="demandante-nombre" required>
      </div>

      <div class="grupo-formulario">
        <label data-txt="correo">Correo Electrónico</label>
        <input type="email" id="demandante-correo" required>
      </div>

      <div class="grupo-formulario">
        <label data-txt="telefono">Teléfono / WhatsApp</label>
        <input type="tel" id="demandante-telefono" required>
      </div>

      <div class="grupo-formulario">
        <label data-txt="servicioRequerido">Servicio que Necesito</label>
        <select id="demandante-servicio" required>
          <option value="" data-txt="seleccionarOpcion">Seleccionar...</option>
        </select>
      </div>

      <div class="grupo-formulario">
        <label data-txt="descripcionServicio">Descripción del Trabajo</label>
        <textarea id="demandante-descripcion" rows="4" required></textarea>
      </div>

      <div class="grupo-formulario">
        <label data-txt="presupuestoMaximo">Presupuesto Máximo</label>
        <input type="number" id="demandante-presupuesto" step="0.01" min="0">
        <select id="demandante-moneda">
          <option value="USD">USD $</option>
          <option value="UYU">UYU $</option>
          <option value="ARS">ARS $</option>
          <option value="EUR">EUR €</option>
        </select>
      </div>

      <div class="grupo-formulario">
        <label data-txt="ubicacion">Ubicación / Dónde se necesita</label>
        <input type="text" id="demandante-ubicacion">
      </div>

      <div class="grupo-formulario checkbox">
        <input type="checkbox" id="acepto-normas-demandante" required>
        <label for="acepto-normas-demandante" data-txt="aceptoNormas">Acepto las Normas y el Acuerdo del Trato</label>
      </div>

      <button type="submit" class="boton-principal" data-txt="registrarDemanda">Publicar Solicitud</button>
    </form>
  </main>

  <script src="js/idioma.js"></script>
  <script src="js/almacenamiento.js"></script>
  <script src="js/validacion.js"></script>
  <script src="js/trato.js"></script>
  <script src="js/flujos.js"></script>
</body>
</html>
