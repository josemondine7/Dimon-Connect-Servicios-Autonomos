<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title data-txt="solicitarServicio">Solicitar un Servicio</title>
  <link rel="stylesheet" href="css/variables.css">
  <link rel="stylesheet" href="css/global.css">
  <link rel="stylesheet" href="css/componentes.css">
  <link rel="stylesheet" href="css/responsivo.css">
  <script src="js/idioma.js"></script>
</head>
<body>

  <div class="barra-superior-pagina">
    <a href="oferta-demanda.html" class="boton-volver" style="margin:0" data-txt="volver">Volver</a>
    <h1 class="titulo-pagina" data-txt="solicitarServicio">Solicitar un Servicio</h1>
    <button class="boton-cambiar-idioma" id="boton-idioma" onclick="cambiarIdioma(idiomaActual === 'es' ? 'en' : 'es')">ES</button>
  </div>

  <main class="pagina-contenedor pagina-centrada">
    <div class="tarjeta">
      <form id="form-solicitar">
        <div class="form-grupo">
          <label data-txt="nombreCompleto">Nombre completo *</label>
          <input type="text" name="nombre" required>
        </div>

        <div class="form-grupo-doble">
          <div class="form-grupo">
            <label data-txt="correoElectronico">Correo electrónico *</label>
            <input type="email" name="correo" required>
          </div>
          <div class="form-grupo">
            <label data-txt="telefono">Teléfono / WhatsApp *</label>
            <input type="tel" name="telefono" required>
          </div>
        </div>

        <div class="form-grupo">
          <label data-txt="tipoServicio">¿Qué servicio necesitás? *</label>
          <input type="text" name="servicioNecesitado" required>
        </div>

        <div class="form-grupo">
          <label data-txt="presupuestoEstimado">Presupuesto estimado</label>
          <input type="text" name="presupuesto" placeholder="Ej: $200 total">
        </div>

        <div class="form-grupo-doble">
          <div class="form-grupo">
            <label data-txt="dondeRealizar">¿Dónde?</label>
            <input type="text" name="ubicacion" placeholder="Barrio / Ciudad">
          </div>
          <div class="form-grupo">
            <label data-txt="cuandoNecesita">¿Cuándo?</label>
            <input type="text" name="fechaNecesidad" placeholder="Ej: Esta semana">
          </div>
        </div>

        <div class="form-grupo">
          <label data-txt="detallesAdicionales">Detalles adicionales</label>
          <textarea name="detalles" rows="4"></textarea>
        </div>

        <div class="checkbox-grupo">
          <input type="checkbox" id="acepto" required>
          <label for="acepto" data-txt="aceptoNormas">Acepto las normas y condiciones *</label>
        </div>

        <div class="contenedor-mensaje"></div>

        <button type="submit" class="boton-enviar" data-txt="enviarRegistro">Enviar registro</button>
      </form>
    </div>
  </main>

  <script src="js/almacenamiento.js"></script>
  <script src="js/flujos.js"></script>
  <script>
    aplicarTraducciones();
  </script>
</body>
</html>
