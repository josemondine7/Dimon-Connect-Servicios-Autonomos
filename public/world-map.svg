  <!-- Líneas de conexión -->
  <g
    fill="none"
    stroke="#5ffaff"
    stroke-width="1"
    stroke-dasharray="3 8"
    opacity=".5"
  >
    <path d="M215 168 C355 110 455 190 604 181" />
    <path d="M604 181 C680 202 730 205 817 218" />
    <path d="M817 218 C864 192 883 192 919 199" />
    <path d="M638 303 C710 280 765 250 817 218" />
    <path d="M638 303 C748 356 844 401 958 431" />
    <path d="M284 188 C305 237 303 279 316 319" />
  </g>

