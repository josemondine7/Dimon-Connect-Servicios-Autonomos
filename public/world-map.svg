      L408 133
      L366 116
      L345 91
      Z
    " />

  </g>

  <!-- Puntos destacados -->
  <g fill="url(#pointGlow)" filter="url(#softGlow)">
    <circle cx="215" cy="168" r="18" />
    <circle cx="284" cy="188" r="15" />
    <circle cx="604" cy="181" r="17" />
    <circle cx="735" cy="194" r="16" />
    <circle cx="817" cy="218" r="20" />
    <circle cx="919" cy="199" r="16" />
    <circle cx="638" cy="303" r="20" />
    <circle cx="958" cy="431" r="18" />
  </g>

  <g fill="#b6ffff">
