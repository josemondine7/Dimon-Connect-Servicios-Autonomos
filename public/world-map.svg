    " />

    <!-- India y sudeste asiático -->
    <path d="
      M782 273
      L819 288
      L842 316
      L823 340
      L797 326
      L773 300
      Z
    " />

    <!-- Australia -->
    <path d="
      M884 399
      C922 378 982 381 1020 404
      L1049 439
      L1022 476
      L977 492
      L928 483
      L896 459
      L876 426
