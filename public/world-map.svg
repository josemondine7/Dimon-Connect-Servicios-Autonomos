    <circle cx="130" cy="150" r="1.5" />
    <circle cx="158" cy="180" r="1.2" />
    <circle cx="187" cy="141" r="1.4" />
    <circle cx="236" cy="201" r="1.3" />
    <circle cx="296" cy="164" r="1.1" />
