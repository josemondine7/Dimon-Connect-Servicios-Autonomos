    <circle cx="284" cy="188" r="2.5" />
    <circle cx="604" cy="181" r="3" />
    <circle cx="735" cy="194" r="3.2" />
    <circle cx="817" cy="218" r="3.8" />
    <circle cx="919" cy="199" r="2.8" />
