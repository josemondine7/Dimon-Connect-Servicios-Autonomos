<svg
  xmlns="http://www.w3.org/2000/svg"
  viewBox="0 0 1200 620"
  role="img"
  aria-labelledby="mapTitle"
>
  <title id="mapTitle">Mapa mundial formado por puntos luminosos</title>

  <defs>
    <radialGradient id="pointGlow">
      <stop offset="0" stop-color="#d9ffff" stop-opacity="1" />
      <stop offset=".35" stop-color="#5cfaff" stop-opacity=".9" />
      <stop offset="1" stop-color="#19bff5" stop-opacity="0" />
    </radialGradient>

    <linearGradient id="mapLine" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#59ffff" stop-opacity=".25" />
      <stop offset=".5" stop-color="#00deff" stop-opacity=".9" />
      <stop offset="1" stop-color="#8bcaff" stop-opacity=".15" />
    </linearGradient>

    <filter id="softGlow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="3" />
    </filter>

    <pattern id="dots" width="15" height="15" patternUnits="userSpaceOnUse">
      <circle cx="3" cy="3" r="1.35" fill="#65efff" opacity=".55" />
      <circle cx="10" cy="9" r=".9" fill="#58dfff" opacity=".35" />
    </pattern>
  </defs>

  <!-- Siluetas geográficas estilizadas -->
  <g fill="url(#dots)" stroke="url(#mapLine)" stroke-width="1.2">

    <!-- Norteamérica -->
    <path d="
      M100 165
      C135 130 190 115 244 120
      C273 123 305 138 325 157
      L303 178
      L278 187
      L267 215
      L242 219
      L226 248
      L195 235
      L178 209
      L146 208
      L124 188
      Z
    " />

    <!-- Centroamérica -->
