<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Lira — Acceso</title>
  <link rel="stylesheet" href="css/variables.css">
  <link rel="stylesheet" href="css/global.css">
  <link rel="stylesheet" href="css/componentes.css">
  <link rel="stylesheet" href="css/responsivo.css">
  <script src="js/idioma.js"></script>
</head>
<body>

  <div class="volver-arriba">
    <a href="index.html" class="boton-volver" data-txt="volver">Volver</a>
  </div>

  <main class="pagina-contenedor pagina-centrada">
    <div class="tarjeta texto-centrado" style="margin-top: 80px;">
      <h2 style="color: var(--color-blanco); font-size: 24px; margin-bottom: 8px;">Lira</h2>
      <p style="color: var(--color-gris-claro); margin-bottom: 24px;" data-txt="ingresarContrasenaLira">Ingresá la contraseña de acceso</p>
      
      <div class="contenedor-mensaje"></div>
      
      <div class="form-grupo">
        <label data-txt="contraseña">Contraseña</label>
        <input type="password" id="contrasena-lira" placeholder="••••••••••••">
      </div>
      
      <button id="boton-acceder-lira" class="boton-enviar" data-txt="acceder">Acceder</button>
    </div>
  </main>

  <script src="js/flujos.js"></script>
  <script>
    aplicarTraducciones();
  </script>
</body>
</html>
