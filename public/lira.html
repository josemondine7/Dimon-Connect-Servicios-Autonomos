<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Panel de Administración — Lira</title>
  <style>
    *{margin:0;padding:0;box-sizing:border-box;font-family:'Segoe UI',sans-serif}
    html,body{background:url('fondo-Dimon.png') no-repeat center center fixed;background-size:cover;color:#fff;padding:1.5rem}
    .capa-sombra{position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(5,16,64,.6);z-index:-1}
    .contenedor{max-width:600px;margin:0 auto;position:relative;z-index:1;text-align:center;padding-top:3rem}
    h1{color:#00ccff;margin-bottom:2rem}
    .tarjeta{background:rgba(5,20,60,.8);padding:2rem;border-radius:16px;border:2px solid #00ccff}
    input{width:100%;padding:1rem;margin:1rem 0;border-radius:8px;border:none;font-size:1rem;background:rgba(255,255,255,.9);color:#051040}
    button{padding:1rem 2rem;border-radius:8px;border:none;background:#00ccff;color:#051040;font-size:1rem;font-weight:700;cursor:pointer}
    .volver{display:inline-block;color:#00ccff;text-decoration:none;margin-top:2rem}
  </style>
</head>
<body>
  <div class="capa-sombra"></div>
  <div class="contenedor">
    <h1>⚙️ Asistente Lira — Administración</h1>
    <div class="tarjeta">
      <p>Área restringida. Solo para uso interno de Dimon Connect.</p>
      <input type="password" placeholder="Ingresar contraseña de administración..." />
      <button onclick="alert('Acceso concedido — Bienvenido, José')">Ingresar</button>
    </div>
    <a href="index.html" class="volver">← Volver al inicio</a>
  </div>
</body>
</html>
